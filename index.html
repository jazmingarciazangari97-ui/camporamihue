// ── REPORTE POR CAMPO ─────────────────────────────────────
function SecReporte({db}){
  const [campoId,setCampoId]=useState((db.campos[0]&&db.campos[0].id)||"");
  const [anio,setAnio]=useState(db.years[db.years.length-1]);
  const [waO,setWaO]=useState(false);const [waT,setWaT]=useState("");

  const generar=()=>{
    const c=db.campos.find(x=>x.id==campoId);if(!c)return;
    const lotes=db.lotes.filter(l=>l.campoId==campoId&&l.anio==anio);
    const cosechas=db.cosechas.filter(x=>x.campoId==campoId);
    const gastos=db.gastos.filter(x=>x.campoId==campoId);
    const lluvias=db.lluvias.filter(x=>x.campoId==campoId);
    const retiros=db.retiros.filter(x=>x.campoId==campoId&&x.anio==anio);
    const totalCos=cosechas.reduce((s,x)=>s+(x.netos||0),0);
    const totalGas=gastos.reduce((s,x)=>s+(parseFloat(x.monto)||0),0);
    const totalMm=lluvias.reduce((s,x)=>s+parseFloat(x.mm||0),0);
    const haTotales=lotes.reduce((s,l)=>s+(parseFloat(l.ha)||0),0);
    let txt=`🌾 *REPORTE CAMPO: ${c.nombre}*\n`;
    txt+=`📍 ${c.localidad||"—"} · ${c.ha||"?"} ha · Propietario: ${c.propietario||"—"}\n`;
    txt+=`📅 Campaña ${anio}/${parseInt(anio)+1}\n\n`;
    if(lotes.length){txt+=`*🗺️ LOTES (${lotes.length}):*\n`;lotes.forEach(l=>{txt+=`• ${l.nom} — ${l.ha||"?"}ha — ${l.cereal||"—"} ${l.variedad||""}`;if(l.semillaKg)txt+=` — Semilla: ${l.semillaKg}kg/ha`;if(l.ureaKg)txt+=` — Urea: ${l.ureaKg}kg/ha`;txt+=`\n`;});}
    if(totalCos>0){txt+=`\n*🌽 COSECHA:*\n`;const porCer={};cosechas.forEach(c=>{porCer[c.cereal]=(porCer[c.cereal]||0)+(c.netos||0);});Object.entries(porCer).forEach(([cer,kg])=>txt+=`• ${cer}: ${fmt(kg)} kg netos\n`);txt+=`Total: *${fmt(totalCos)} kg* (${(totalCos/1000).toFixed(1)} t)\n`;}
    if(retiros.length){txt+=`\n*📦 INSUMOS USADOS (${anio}/${parseInt(anio)+1}):*\n`;const porTipo={};retiros.forEach(r=>{if(!porTipo[r.tipo])porTipo[r.tipo]=0;porTipo[r.tipo]+=r.qty||0;});Object.entries(porTipo).forEach(([t,qty])=>txt+=`• ${t}: ${fmt(qty)}\n`);}
    if(totalGas>0){txt+=`\n*💰 GASTOS TOTALES: $${fmt(totalGas)}*\n`;if(haTotales>0)txt+=`Costo/ha: $${fmt(Math.round(totalGas/haTotales))}\n`;}
    if(totalMm>0)txt+=`\n*🌧️ LLUVIA TOTAL: ${totalMm.toFixed(0)} mm*\n`;
    txt+=`\n_Generado con GenAFarm · ${new Date().toLocaleDateString("es-AR")}_`;
    setWaT(txt);setWaO(true);
  };

  return(
    <div>
      <InfoBox text="Generá un resumen completo de un campo para compartir por WhatsApp con el dueño o para tus registros." color="blue" emoji="📊"/>
      <Panel title="Seleccioná el campo y campaña" accent={C.az}>
        <FR><Inp label="Campo" value={campoId} onChange={v=>setCampoId(v)} opts={db.campos.map(c=>({v:c.id,l:c.nombre}))}/><Inp label="Campaña" value={anio} onChange={v=>setAnio(v)} opts={db.years}/></FR>
        <Btn onClick={generar} sx={{width:"100%",justifyContent:"center"}}>📊 Generar reporte completo</Btn>
      </Panel>
      {waO&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:14,backdropFilter:"blur(4px)"}}>
          <div style={{background:"#fff",borderRadius:22,padding:22,width:"100%",maxWidth:490,boxShadow:"0 24px 64px rgba(0,0,0,.25)"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
              <h3 style={{fontSize:"1.05rem",fontWeight:900}}>📊 Reporte listo</h3>
              <button onClick={()=>setWaO(false)} style={{background:"#f0f4f8",border:"none",width:30,height:30,borderRadius:"50%",cursor:"pointer"}}>✕</button>
            </div>
            <div style={{background:"#e9f7ef",borderRadius:11,padding:13,fontSize:"0.76rem",whiteSpace:"pre-wrap",wordBreak:"break-word",maxHeight:280,overflowY:"auto",fontFamily:"monospace",color:"#1a3a2a",lineHeight:1.6,marginBottom:12}}>{waT}</div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <Btn v="ghost" onClick={()=>setWaO(false)}>Cerrar</Btn>
              <Btn v="wa" onClick={()=>window.open("https://wa.me/?text="+encodeURIComponent(waT),"_blank")}>📱 Enviar por WhatsApp</Btn>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}



// ── RESUMEN ECONÓMICO ─────────────────────────────────────
function SecResumen({db}){
  const [campania,setCampania]=useState(CAMPANIAS[3]||db.years[db.years.length-1]);
  const [tab,setTab]=useState("general");

  // ── INGRESOS ──
  // Ventas de grano de esa campaña
  const ventasGrano=db.ventas.filter(v=>v.campania===campania||(v.fechaEntrega&&v.fechaEntrega.startsWith(campania.slice(0,4)))||(v.fecha&&v.fecha.startsWith(campania.slice(0,4))));
  const ingrVentas=ventasGrano.reduce((s,v)=>s+(parseFloat(v.precio||0)*parseFloat(v.toneladas||0)),0);

  // Ventas de animales
  const ventasAnim=db.movAnim.filter(m=>m.tipo==="Venta"&&m.fecha&&m.fecha.startsWith(campania.slice(0,4)));
  const ingrAnimales=ventasAnim.reduce((s,m)=>s+(parseFloat(m.precio||0)*parseFloat(m.cant||0)),0);

  const totalIngresos=ingrVentas+ingrAnimales;

  // ── GASTOS ──
  const gastosCamp=db.gastos.filter(g=>g.campania===campania||(g.fecha&&g.fecha.startsWith(campania.slice(0,4))));
  const totalGastos=gastosCamp.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);

  // Gastos por categoría
  const gastosCat={};
  gastosCamp.forEach(g=>{
    const cat=g.cat||"Otros";
    if(!gastosCat[cat])gastosCat[cat]=0;
    gastosCat[cat]+=parseFloat(g.monto)||0;
  });

  // Insumos comprados
  const insumosCamp=(db.comprasIns||[]).filter(c=>c.fecha&&c.fecha.startsWith(campania.slice(0,4)));
  const totalInsumos=insumosCamp.reduce((s,c)=>s+(parseFloat(c.precio||0)*parseFloat(c.qty||0)),0);

  // Trabajos/servicios
  const trabajosCamp=(db.trabajos||[]).filter(t=>t.fecha&&t.fecha.startsWith(campania.slice(0,4)));
  const totalTrabajos=trabajosCamp.reduce((s,t)=>s+(parseFloat(t.monto)||0),0);

  // Pagos de personal
  const pagosCamp=db.pagos.filter(p=>p.fecha&&p.fecha.startsWith(campania.slice(0,4)));
  const totalPersonal=pagosCamp.reduce((s,p)=>s+(parseFloat(p.monto)||0),0);

  // Combustible
  const combCamp=db.combustible.filter(c=>c.fecha&&c.fecha.startsWith(campania.slice(0,4)));
  const totalComb=combCamp.reduce((s,c)=>s+(parseFloat(c.total)||0),0);

  const totalEgresos=totalGastos+totalInsumos+totalTrabajos+totalPersonal+totalComb;
  const resultado=totalIngresos-totalEgresos;

  // Cosecha de esa campaña
  const cosechasCamp=db.cosechas.filter(c=>c.campania===campania||(c.fecha&&c.fecha.startsWith(campania.slice(0,4))));
  const kgTotales=cosechasCamp.reduce((s,c)=>{
    const kgCams=db.cosechaCamiones.filter(x=>x.cosechaId==c.id).reduce((ss,x)=>ss+x.kg,0);
    const kgSilos=(c.silobolsas&&c.silobolsas.length>0?(c.silobolsas||[]).reduce((ss,sb)=>ss+(parseFloat(sb.kg)||0),0):(parseFloat(c.kgSilo)||0));
    return s+kgSilos+kgCams;
  },0);

  // Colores para las barras
  const COLCAT={
    "Ferretería":C.am,"Veterinaria":C.az,"Repuestos":C.na,
    "Combustible":C.v,"Mano de obra":C.vi,"Semillas":C.ce,
    "Agroquímicos":C.ma,"Arrendamiento":C.ro,"Seguros":C.lt,
    "Mercadería":C.dk2,"Otros":C.md,
    "Insumos comprados":"#e84393","Personal":C.vi,
    "Combustible (tanque)":C.v,"Trabajos/Servicios":C.ce
  };

  // Construir breakdown de egresos para la barra
  const breakdown=[
    ...Object.entries(gastosCat).map(([k,v])=>({label:k,val:v,col:COLCAT[k]||C.md})),
    ...(totalInsumos>0?[{label:"Insumos comprados",val:totalInsumos,col:"#e84393"}]:[]),
    ...(totalPersonal>0?[{label:"Personal",val:totalPersonal,col:C.vi}]:[]),
    ...(totalComb>0?[{label:"Combustible (tanque)",val:totalComb,col:C.v}]:[]),
    ...(totalTrabajos>0?[{label:"Trabajos/Servicios",val:totalTrabajos,col:C.ce}]:[]),
  ].sort((a,b)=>b.val-a.val);

  const maxBar=breakdown.length>0?breakdown[0].val:1;

  return(
    <div>
      {/* Selector de campaña */}
      <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:14,flexWrap:"wrap"}}>
        <span style={{fontSize:"0.75rem",fontWeight:800,color:C.md}}>Campaña:</span>
        {CAMPANIAS.map(cp=>(
          <button key={cp} onClick={()=>setCampania(cp)} style={{padding:"6px 14px",borderRadius:30,border:`1.5px solid ${cp===campania?C.az:"#e2e8f0"}`,background:cp===campania?C.az:"#fff",color:cp===campania?"#fff":C.md,fontSize:"0.76rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>
            {cp}
          </button>
        ))}
      </div>

      <Tabs items={[{id:"general",label:"📊 General"},{id:"detalle",label:"📋 Detalle"},{id:"cosecha",label:"🌽 Cosecha"}]} active={tab} onChange={setTab}/>

      {tab==="general"&&<>
        {/* TARJETAS PRINCIPALES */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
          <div style={{background:`linear-gradient(135deg,${C.v},${C.v2})`,borderRadius:16,padding:16,boxShadow:`0 4px 20px ${C.v}44`}}>
            <div style={{fontSize:"0.7rem",fontWeight:800,color:"rgba(255,255,255,.75)",textTransform:"uppercase",marginBottom:6}}>💰 Ingresos totales</div>
            <div style={{fontSize:"1.6rem",fontWeight:900,color:"#fff"}}>${fmt(totalIngresos)}</div>
            {ingrVentas>0&&<div style={{fontSize:"0.72rem",color:"rgba(255,255,255,.7)",marginTop:4}}>🌽 Grano: ${fmt(ingrVentas)}</div>}
            {ingrAnimales>0&&<div style={{fontSize:"0.72rem",color:"rgba(255,255,255,.7)"}}>🐄 Animales: ${fmt(ingrAnimales)}</div>}
          </div>
          <div style={{background:`linear-gradient(135deg,${C.ro},#f07070)`,borderRadius:16,padding:16,boxShadow:`0 4px 20px ${C.ro}44`}}>
            <div style={{fontSize:"0.7rem",fontWeight:800,color:"rgba(255,255,255,.75)",textTransform:"uppercase",marginBottom:6}}>💸 Egresos totales</div>
            <div style={{fontSize:"1.6rem",fontWeight:900,color:"#fff"}}>${fmt(totalEgresos)}</div>
            <div style={{fontSize:"0.72rem",color:"rgba(255,255,255,.7)",marginTop:4}}>{breakdown.length} categorías</div>
          </div>
        </div>

        {/* RESULTADO NETO */}
        <div style={{background:resultado>=0?`linear-gradient(135deg,${C.v3},#d0f7e8)`:C.ro3,border:`2px solid ${resultado>=0?C.v:C.ro}`,borderRadius:18,padding:20,marginBottom:14,textAlign:"center"}}>
          <div style={{fontSize:"0.75rem",fontWeight:800,color:resultado>=0?C.v:C.ro,textTransform:"uppercase",letterSpacing:"1px",marginBottom:6}}>
            {resultado>=0?"✅ RESULTADO POSITIVO":"❌ RESULTADO NEGATIVO"}
          </div>
          <div style={{fontSize:"2.2rem",fontWeight:900,color:resultado>=0?C.v:C.ro,letterSpacing:"-1px"}}>
            {resultado>=0?"+ ":"- "}${fmt(Math.abs(resultado))}
          </div>
          {totalIngresos>0&&<div style={{fontSize:"0.78rem",color:C.md,marginTop:8}}>
            Margen: {Math.round((resultado/totalIngresos)*100)}% sobre ingresos
          </div>}
        </div>

// ── STOCK DE GRANOS ──────────────────────────────────────
function SecStockGranos({db}){
  const [filtCereal,setFiltCereal]=useState("Todos");

  // Calcular stock por cereal
  const cerealesUsados=[...new Set([
    ...db.silos.map(s=>s.cereal),
    ...db.ventas.map(v=>v.cereal),
    ...(db.cosechaCamiones||[]).map(c=>c.cereal).filter(Boolean)
  ])].filter(Boolean);

  const resumenPorCereal={};
  cerealesUsados.forEach(cer=>{
    // En silobolsas (disponible)
    const enSilos=db.silos.filter(s=>s.cereal===cer&&s.estado!=="Vaciada").reduce((s,x)=>s+(x.kgRest||0),0);
    const totalEmbolsado=db.silos.filter(s=>s.cereal===cer).reduce((s,x)=>s+(x.kg||0),0);
    const salidoSilos=db.salidasSilo.filter(s=>s.cereal===cer).reduce((s,x)=>s+(x.kg||0),0);

    // Salido directo de cosecha a camión
    const salidoCosecha=db.cosechaCamiones.filter(c=>c.cereal===cer).reduce((s,x)=>s+(x.kg||0),0);

    // Vendido (toneladas → kg)
    const vendido=db.ventas.filter(v=>v.cereal===cer&&v.estado!=="Cancelado").reduce((s,v)=>s+(parseFloat(v.toneladas||0)*1000),0);
    const entregado=db.ventas.filter(v=>v.cereal===cer&&v.estado==="Entregado").reduce((s,v)=>s+(parseFloat(v.toneladas||0)*1000),0);
    const pendEntrega=db.ventas.filter(v=>v.cereal===cer&&(v.estado==="Pendiente"||v.estado==="Fijado")).reduce((s,v)=>s+(parseFloat(v.toneladas||0)*1000),0);

    // Total cosechado de este cereal
    const totalCosechado=db.cosechas.filter(c=>c.cereal===cer).reduce((s,c)=>{
      const kgCams=db.cosechaCamiones.filter(x=>x.cosechaId==c.id&&x.cereal===cer).reduce((ss,x)=>ss+x.kg,0);
      const kgSilos=(c.silobolsas&&c.silobolsas.length>0?(c.silobolsas||[]).reduce((ss,sb)=>ss+(parseFloat(sb.kg)||0),0):(parseFloat(c.kgSilo)||0));
      return s+kgSilos+kgCams;
    },0);

    resumenPorCereal[cer]={
      enSilos, totalEmbolsado, salidoSilos, salidoCosecha,
      vendido, entregado, pendEntrega, totalCosechado,
      disponible: enSilos // lo que queda en bolsas
    };
  });

  const cerealesFilt=filtCereal==="Todos"?cerealesUsados:cerealesUsados.filter(c=>c===filtCereal);
  const totalDisponible=cerealesFilt.reduce((s,c)=>s+(resumenPorCereal[c]?.disponible||0),0);

  return(
    <div>
      {/* Filtro cereal */}
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
        {["Todos",...cerealesUsados].map(c=>(
          <button key={c} onClick={()=>setFiltCereal(c)} style={{padding:"7px 14px",borderRadius:30,border:`1.5px solid ${filtCereal===c?C.v:"#e2e8f0"}`,background:filtCereal===c?C.v:"#fff",color:filtCereal===c?"#fff":C.md,fontSize:"0.76rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>
            {c}
          </button>
        ))}
      </div>

      {/* Tarjeta resumen total */}
      {cerealesUsados.length>0&&<div style={{background:`linear-gradient(135deg,${C.dk},${C.dk2})`,borderRadius:18,padding:18,marginBottom:14}}>
        <div style={{fontSize:"0.72rem",fontWeight:800,color:"rgba(255,255,255,.6)",textTransform:"uppercase",marginBottom:6}}>📦 Total disponible en bolsas</div>
        <div style={{fontSize:"2rem",fontWeight:900,color:"#fff",marginBottom:4}}>{fmt(totalDisponible)} kg</div>
        <div style={{fontSize:"0.82rem",color:"rgba(255,255,255,.55)"}}>{(totalDisponible/1000).toFixed(1)} toneladas</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(100px,1fr))",gap:8,marginTop:12}}>
          {cerealesUsados.filter(c=>resumenPorCereal[c]?.disponible>0).map(c=>(
            <div key={c} style={{background:"rgba(255,255,255,.1)",borderRadius:10,padding:"8px",textAlign:"center"}}>
              <div style={{fontSize:"0.65rem",fontWeight:800,color:"rgba(255,255,255,.6)",textTransform:"uppercase"}}>{c}</div>
              <div style={{fontSize:"1rem",fontWeight:900,color:"#fff"}}>{fmt(resumenPorCereal[c].disponible)}</div>
              <div style={{fontSize:"0.62rem",color:"rgba(255,255,255,.4)"}}>kg</div>
            </div>
          ))}
        </div>
      </div>}

      {cerealesUsados.length===0&&<div style={{textAlign:"center",padding:40,color:C.lt}}>
        <div style={{fontSize:"2.5rem"}}>🌾</div>
        <p style={{marginTop:8,fontWeight:600}}>Sin datos de granos todavía</p>
        <p style={{fontSize:"0.8rem",marginTop:4}}>Registrá cosechas y silobolsas para ver el stock</p>
      </div>}

      {/* Detalle por cereal */}
      {cerealesFilt.map(cer=>{
        const r=resumenPorCereal[cer];
        if(!r)return null;
        const pctVendido=r.totalCosechado>0?Math.round((r.vendido/r.totalCosechado)*100):0;
        const pctDisp=r.totalCosechado>0?Math.round((r.disponible/r.totalCosechado)*100):0;

        // Silobolsas activas de este cereal
        const silosActivos=db.silos.filter(s=>s.cereal===cer&&s.estado!=="Vaciada"&&(s.kgRest||0)>0);

        return(
          <Panel key={cer} title={`🌾 ${cer}`} accent={ACCS[CERALES.indexOf(cer)%7]||C.v}>
            {/* Grid resumen */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(110px,1fr))",gap:8,marginBottom:12}}>
              <div style={{background:C.v3,borderRadius:12,padding:"10px",textAlign:"center",border:`1.5px solid ${C.v}33`}}>
                <div style={{fontSize:"0.62rem",fontWeight:800,color:C.md,textTransform:"uppercase",marginBottom:3}}>En bolsas</div>
                <div style={{fontSize:"1.15rem",fontWeight:900,color:C.v}}>{fmt(r.disponible)}</div>
                <div style={{fontSize:"0.65rem",color:C.lt}}>kg disponibles</div>
              </div>
              <div style={{background:C.az3,borderRadius:12,padding:"10px",textAlign:"center",border:`1.5px solid ${C.az}33`}}>
                <div style={{fontSize:"0.62rem",fontWeight:800,color:C.md,textTransform:"uppercase",marginBottom:3}}>Vendido</div>
                <div style={{fontSize:"1.15rem",fontWeight:900,color:C.az}}>{fmt(r.vendido)}</div>
                <div style={{fontSize:"0.65rem",color:C.lt}}>kg ({pctVendido}%)</div>
              </div>
              <div style={{background:C.na3,borderRadius:12,padding:"10px",textAlign:"center",border:`1.5px solid ${C.na}33`}}>
                <div style={{fontSize:"0.62rem",fontWeight:800,color:C.md,textTransform:"uppercase",marginBottom:3}}>Pend. entrega</div>
                <div style={{fontSize:"1.15rem",fontWeight:900,color:C.na}}>{fmt(r.pendEntrega)}</div>
                <div style={{fontSize:"0.65rem",color:C.lt}}>kg</div>
              </div>
              <div style={{background:C.bg,borderRadius:12,padding:"10px",textAlign:"center",border:"1.5px solid #e2e8f0"}}>
                <div style={{fontSize:"0.62rem",fontWeight:800,color:C.md,textTransform:"uppercase",marginBottom:3}}>Total cosecha</div>
                <div style={{fontSize:"1.15rem",fontWeight:900,color:C.dk}}>{fmt(r.totalCosechado)}</div>
                <div style={{fontSize:"0.65rem",color:C.lt}}>kg</div>
              </div>
            </div>

            {/* Barra de estado */}
            {r.totalCosechado>0&&<div style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.7rem",color:C.md,marginBottom:4}}>
                <span>Disponible {pctDisp}%</span>
                <span>Vendido {pctVendido}%</span>
              </div>
              <div style={{background:"#e2e8f0",borderRadius:20,height:10,overflow:"hidden",display:"flex"}}>
                <div style={{height:"100%",width:`${pctDisp}%`,background:C.v,borderRadius:"20px 0 0 20px",transition:"width .4s"}}/>
                <div style={{height:"100%",width:`${pctVendido}%`,background:C.az,transition:"width .4s"}}/>
                <div style={{height:"100%",flex:1,background:"#e2e8f0"}}/>
              </div>
              <div style={{display:"flex",gap:12,marginTop:4,fontSize:"0.68rem"}}>
                <span style={{color:C.v}}>● En bolsas</span>
                <span style={{color:C.az}}>● Vendido</span>
                <span style={{color:C.lt}}>● Salió a camión</span>
              </div>
            </div>}

            {/* Silobolsas activas */}
            {silosActivos.length>0&&<>
              <div style={{fontSize:"0.7rem",fontWeight:800,color:C.md,textTransform:"uppercase",marginBottom:6}}>🛍️ Bolsas activas ({silosActivos.length})</div>
              {silosActivos.map(s=>{
                const pct=s.kg>0?Math.round((s.kgRest/s.kg)*100):0;
                return(
                  <div key={s.id} style={{background:C.bg,borderRadius:10,padding:"9px 12px",marginBottom:6}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                      <div>
                        <span style={{fontWeight:800,fontSize:"0.85rem"}}>Bolsa {s.num||"S/N"}</span>
                        <span style={{fontSize:"0.72rem",color:C.md,marginLeft:8}}>Lote {s.lote||"—"} · {s.fecha||"—"}</span>
                      </div>
                      <span style={{fontWeight:900,color:C.v,fontSize:"0.9rem"}}>{fmt(s.kgRest)} kg</span>
                    </div>
                    <div style={{background:"#e2e8f0",borderRadius:20,height:5,overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${pct}%`,background:pct>50?C.v:pct>20?C.am:C.ro,borderRadius:20}}/>
                    </div>
                    <div style={{fontSize:"0.65rem",color:C.lt,textAlign:"right",marginTop:2}}>{pct}% restante de {fmt(s.kg)} kg</div>
                  </div>
                );
              })}
            </>}
          </Panel>
        );
      })}
    </div>
  );
}


// ── ARRENDAMIENTOS ────────────────────────────────────────
function SecArrendamientos({db,setDb}){
  const [mA,setMA]=useState(false);
  const [mP,setMP]=useState(false); // modal pago
  const [sel,setSel]=useState(null);
  const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));

  const arr=db.arrendamientos||[];
  const pagosArr=db.pagosArr||[];

  const hoy30=new Date();hoy30.setDate(hoy30.getDate()+60);
  const proxVenc=arr.filter(a=>a.vencimiento&&new Date(a.vencimiento)<=hoy30&&a.estado!=="Finalizado");

  const totalMensual=arr.filter(a=>a.estado==="Vigente"&&a.tipoPago==="Mensual").reduce((s,a)=>s+(parseFloat(a.monto)||0),0);
  const totalAnual=arr.filter(a=>a.estado==="Vigente"&&a.tipoPago==="Anual").reduce((s,a)=>s+(parseFloat(a.monto)||0),0);
  const totalHas=arr.filter(a=>a.estado==="Vigente").reduce((s,a)=>s+(parseFloat(a.ha)||0),0);

  return(
    <div>
      {proxVenc.length>0&&<InfoBox text={`⚠️ ${proxVenc.length} contrato${proxVenc.length>1?"s":""} vence en los próximos 60 días: ${proxVenc.map(a=>a.campo||a.propietario).join(", ")}`} color="orange" emoji="📋"/>}

      <div style={{display:"flex",gap:7,marginBottom:12}}>
        <Btn v="brown" onClick={()=>{setF({estado:"Vigente",tipoPago:"Anual",moneda:"Pesos"});setMA(true);}}>+ Arrendamiento</Btn>
      </div>

      {arr.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:9,marginBottom:12}}>
        <GC title="Ha arrendadas" val={fmt(totalHas)+" ha"} acc={C.v} emoji="🌾"/>
        {totalMensual>0&&<GC title="Pago mensual" val={"$"+fmt(totalMensual)} acc={C.na} emoji="📅"/>}
        {totalAnual>0&&<GC title="Pago anual" val={"$"+fmt(totalAnual)} acc={C.az} emoji="📆"/>}
        <GC title="Contratos" val={arr.filter(a=>a.estado==="Vigente").length} acc={C.ce} emoji="📋"/>
      </div>}

      {arr.length===0&&<div style={{textAlign:"center",padding:40,color:C.lt}}>
        <div style={{fontSize:"2.5rem"}}>📋</div>
        <p style={{marginTop:8,fontWeight:600}}>Sin arrendamientos registrados</p>
      </div>}

      {arr.map(a=>{
        const pagos=pagosArr.filter(p=>p.arrId===a.id);
        const totalPagado=pagos.reduce((s,p)=>s+(parseFloat(p.monto)||0),0);
        const ec=a.estado==="Vigente"?"green":a.estado==="Vencido"?"red":"gray";
        const diasVenc=a.vencimiento?Math.round((new Date(a.vencimiento)-new Date())/(1000*60*60*24)):null;
        return(
          <Panel key={a.id} accent={a.estado==="Vigente"?C.v:C.ro}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div>
                <div style={{fontWeight:900,fontSize:"0.98rem"}}>🌾 {a.campo||"—"}</div>
                <div style={{fontSize:"0.74rem",color:C.md,marginTop:2}}>
                  👤 {a.propietario||"—"} · {a.ha||"?"} ha
                  {a.localidad?` · 📍 ${a.localidad}`:""}
                </div>
              </div>
              <div style={{display:"flex",gap:5,alignItems:"center"}}>
                <Bdg label={a.estado||"Vigente"} col={ec}/>
                <Btn sz="xs" v="ghost" onClick={()=>{setF({...a});setMA(true);}}>✏️</Btn>
                <Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,arrendamientos:(db.arrendamientos||[]).filter(x=>x.id!==a.id)});}}>🗑️</Btn>
              </div>
            </div>

            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:8,marginBottom:10}}>
              <div style={{background:C.bg,borderRadius:10,padding:"8px",textAlign:"center"}}>
                <div style={{fontSize:"0.62rem",color:C.md,fontWeight:700,textTransform:"uppercase"}}>Monto</div>
                <div style={{fontSize:"1rem",fontWeight:900,color:C.dk}}>{a.moneda==="Quintales"?`${a.monto} qq`:`$${fmt(a.monto)}`}</div>
                <div style={{fontSize:"0.65rem",color:C.lt}}>{a.tipoPago||"Anual"}</div>
              </div>
              <div style={{background:C.bg,borderRadius:10,padding:"8px",textAlign:"center"}}>
                <div style={{fontSize:"0.62rem",color:C.md,fontWeight:700,textTransform:"uppercase"}}>$/ha</div>
                <div style={{fontSize:"1rem",fontWeight:900,color:C.dk}}>{a.ha&&a.monto&&a.moneda!=="Quintales"?"$"+fmt(Math.round(parseFloat(a.monto)/parseFloat(a.ha))):"—"}</div>
              </div>
              {diasVenc!==null&&<div style={{background:diasVenc<=60?C.ro3:C.v3,borderRadius:10,padding:"8px",textAlign:"center"}}>
                <div style={{fontSize:"0.62rem",color:C.md,fontWeight:700,textTransform:"uppercase"}}>Vencimiento</div>
                <div style={{fontSize:"0.85rem",fontWeight:900,color:diasVenc<=60?C.ro:C.v}}>{a.vencimiento}</div>
                <div style={{fontSize:"0.62rem",color:diasVenc<=60?C.ro:C.lt}}>{diasVenc>0?`${diasVenc} días`:diasVenc===0?"Hoy":"Vencido"}</div>
              </div>}
            </div>

            {a.condiciones&&<div style={{background:C.bg,borderRadius:9,padding:"7px 10px",fontSize:"0.78rem",color:C.md,marginBottom:8}}>📝 {a.condiciones}</div>}

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontSize:"0.74rem",color:C.md}}>Pagado: <b style={{color:C.v}}>${fmt(totalPagado)}</b></div>
              <Btn sz="xs" v="green" onClick={()=>{setSel(a);setF({fecha:hoy(),arrId:a.id,monto:a.monto,concepto:`Arrendamiento ${a.campo||""}`});setMP(true);}}>💰 Registrar pago</Btn>
            </div>

            {pagos.length>0&&<div style={{marginTop:8}}>
              <div style={{fontSize:"0.68rem",fontWeight:800,color:C.md,textTransform:"uppercase",marginBottom:4}}>Últimos pagos:</div>
              {pagos.slice(-3).reverse().map(p=>(
                <div key={p.id} style={{display:"flex",justifyContent:"space-between",fontSize:"0.74rem",padding:"4px 0",borderBottom:"1px solid #f0f4f8"}}>
                  <span>{p.fecha} · {p.concepto||"Pago"}</span>
                  <span style={{fontWeight:800,color:C.v}}>${fmt(p.monto)}</span>
                </div>
              ))}
            </div>}
          </Panel>
        );
      })}

      {/* MODAL ARRENDAMIENTO */}
      <Modal open={mA} onClose={()=>{setMA(false);setF({});}} title={f.id?"✏️ Editar Arrendamiento":"📋 Nuevo Arrendamiento"}>
        <FR>
          <Inp label="Campo / Establecimiento" value={f.campo||""} onChange={v=>sf("campo",v)} placeholder="Ej: La Esperanza"/>
          <Inp label="Propietario / Arrendador" value={f.propietario||""} onChange={v=>sf("propietario",v)} placeholder="Ej: Juan Pérez"/>
        </FR>
        <FR>
          <Inp label="Localidad" value={f.localidad||""} onChange={v=>sf("localidad",v)}/>
          <Inp label="Hectáreas" type="number" value={f.ha||""} onChange={v=>sf("ha",v)}/>
        </FR>
        <div style={{background:C.v3,border:"1.5px solid #b8f0d8",borderRadius:13,padding:13,marginBottom:10}}>
          <div style={{fontSize:"0.72rem",fontWeight:800,color:C.v,textTransform:"uppercase",marginBottom:9}}>💰 Condiciones de pago</div>
          <FR>
            <Inp label="Tipo de pago" value={f.tipoPago||"Anual"} onChange={v=>sf("tipoPago",v)} opts={["Mensual","Trimestral","Semestral","Anual","Por cosecha"]}/>
            <Inp label="Moneda" value={f.moneda||"Pesos"} onChange={v=>sf("moneda",v)} opts={["Pesos","Dólares","Quintales de soja","Quintales de maíz"]}/>
          </FR>
          <Inp label={`Monto (${f.moneda==="Quintales de soja"||f.moneda==="Quintales de maíz"?"qq":f.moneda==="Dólares"?"USD":"$"})`} type="number" value={f.monto||""} onChange={v=>sf("monto",v)} sx={{marginBottom:0}}/>
        </div>
        <FR>
          <Inp label="Inicio del contrato" type="date" value={f.inicio||""} onChange={v=>sf("inicio",v)}/>
          <Inp label="Vencimiento" type="date" value={f.vencimiento||""} onChange={v=>sf("vencimiento",v)}/>
        </FR>
        <FR>
          <Inp label="Estado" value={f.estado||"Vigente"} onChange={v=>sf("estado",v)} opts={["Vigente","En negociación","Vencido","Finalizado"]}/>
          <Inp label="Teléfono propietario" value={f.tel||""} onChange={v=>sf("tel",v)}/>
        </FR>
        <Inp label="Condiciones especiales / Notas" value={f.condiciones||""} onChange={v=>sf("condiciones",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>{setMA(false);setF({});}} sv="brown" onSave={()=>{
          const nd=f.id
            ?addMov({...db,arrendamientos:(db.arrendamientos||[]).map(x=>x.id===f.id?{...f}:x)},`✏️ Arrendamiento editado: ${f.campo}`)
            :addMov({...db,arrendamientos:[...(db.arrendamientos||[]),{id:Date.now(),...f}]},`📋 Arrendamiento: ${f.campo} ${f.ha}ha`);
          setDb(nd);setMA(false);setF({});
        }}/>
      </Modal>

      {/* MODAL PAGO */}
      <Modal open={mP} onClose={()=>{setMP(false);setSel(null);setF({});}} title="💰 Registrar Pago de Arrendamiento">
        {sel&&<InfoBox text={`📋 ${sel.campo||"—"} · ${sel.propietario||"—"} · ${sel.ha||"?"}ha`} color="brown" emoji=""/>}
        <Inp label="Fecha" type="date" value={f.fecha||hoy()} onChange={v=>sf("fecha",v)} sx={{marginBottom:8}}/>
        <Inp label="Concepto / Período" value={f.concepto||""} onChange={v=>sf("concepto",v)} placeholder="Ej: Arrendamiento campaña 2024/25" sx={{marginBottom:8}}/>
        <BloqueIVA f={f} sf={sf} label="Monto del arrendamiento"/>
        <Inp label="Nota" value={f.nota||""} onChange={v=>sf("nota",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>{setMP(false);setSel(null);setF({});}} sv="green" saveLabel="Registrar pago" onSave={()=>{
          const {neto,iva,total}=calcIVA(f);
          const arrPagoId=Date.now();
          let nd=addMov({...db,pagosArr:[...(db.pagosArr||[]),{id:arrPagoId,...f,monto:total,montoNeto:neto,montoIva:iva,ivaAlicuota:f.ivaAlicuota||"21"}]},`💰 Arrend. ${sel?sel.campo:"—"}: $${fmt(total)}`);
          nd=addCaja(nd,{tipo:"salida",monto:total,concepto:`Arrendamiento: ${sel?sel.campo:"—"}`,categoria:"Pago arrendamiento",area:"agropecuaria",fecha:f.fecha,origenTipo:"pago_arrendamiento",origenId:arrPagoId,contraparte:sel?sel.propietario:""});
          setDb(nd);setMP(false);setSel(null);setF({});
        }}/>
      </Modal>
    </div>
  );
}


// ── PRESUPUESTO POR CAMPAÑA ───────────────────────────────
function SecPresupuesto({db,setDb}){
  const [campania,setCampania]=useState(CAMPANIAS[3]);
  const [mI,setMI]=useState(false); // modal item
  const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));

  const presupuestos=db.presupuestos||[];
  const itemsCamp=presupuestos.filter(p=>p.campania===campania);

  // Real de esa campaña
  const gastosReal=db.gastos.filter(g=>g.campania===campania||(g.fecha&&g.fecha.startsWith(campania.slice(0,4)))).reduce((s,g)=>s+(parseFloat(g.monto)||0),0);
  const insumosReal=(db.comprasIns||[]).filter(c=>c.fecha&&c.fecha.startsWith(campania.slice(0,4))).reduce((s,c)=>s+(parseFloat(c.precio||0)*parseFloat(c.qty||0)),0);
  const personalReal=db.pagos.filter(p=>p.fecha&&p.fecha.startsWith(campania.slice(0,4))).reduce((s,p)=>s+(parseFloat(p.monto)||0),0);
  const combReal=db.combustible.filter(c=>c.fecha&&c.fecha.startsWith(campania.slice(0,4))).reduce((s,c)=>s+(parseFloat(c.total)||0),0);
  const trabajosReal=(db.trabajos||[]).filter(t=>t.fecha&&t.fecha.startsWith(campania.slice(0,4))).reduce((s,t)=>s+(parseFloat(t.monto)||0),0);
  const totalReal=gastosReal+insumosReal+personalReal+combReal+trabajosReal;

  const ingresosReal=db.ventas.filter(v=>v.fecha&&v.fecha.startsWith(campania.slice(0,4))).reduce((s,v)=>s+(parseFloat(v.precio||0)*parseFloat(v.toneladas||0)),0);

  // Presupuestado
  const totalPresupGastos=itemsCamp.filter(p=>p.tipo==="gasto").reduce((s,p)=>s+(parseFloat(p.monto)||0),0);
  const totalPresupIngresos=itemsCamp.filter(p=>p.tipo==="ingreso").reduce((s,p)=>s+(parseFloat(p.monto)||0),0);

  const CATS_GASTO=["Insumos/Agroquímicos","Semillas","Fertilizantes","Combustible","Mano de obra","Arrendamiento","Servicios/Contratistas","Fletes","Seguros","Maquinaria","Otros gastos"];
  const CATS_INGRESO=["Venta soja","Venta maíz","Venta trigo","Venta girasol","Venta animales","Otros ingresos"];

  return(
    <div>
      {/* Selector campaña */}
      <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:14,flexWrap:"wrap"}}>
        <span style={{fontSize:"0.75rem",fontWeight:800,color:C.md}}>Campaña:</span>
        {CAMPANIAS.map(cp=>(
          <button key={cp} onClick={()=>setCampania(cp)} style={{padding:"6px 14px",borderRadius:30,border:`1.5px solid ${cp===campania?C.az:"#e2e8f0"}`,background:cp===campania?C.az:"#fff",color:cp===campania?"#fff":C.md,fontSize:"0.76rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>{cp}</button>
        ))}
      </div>

      <div style={{display:"flex",gap:7,marginBottom:12}}>
        <Btn v="blue" onClick={()=>{setF({campania,tipo:"gasto",cat:"Insumos/Agroquímicos"});setMI(true);}}>+ Ítem gasto</Btn>
        <Btn v="green" onClick={()=>{setF({campania,tipo:"ingreso",cat:"Venta soja"});setMI(true);}}>+ Ítem ingreso</Btn>
      </div>

      {/* Comparación presupuestado vs real */}
      {(totalPresupGastos>0||totalPresupIngresos>0)&&<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
          {/* GASTOS */}
          <Panel accent={C.ro}>
            <div style={{fontSize:"0.7rem",fontWeight:800,color:C.md,textTransform:"uppercase",marginBottom:8}}>💸 Gastos</div>
            <div style={{marginBottom:6}}>
              <div style={{fontSize:"0.7rem",color:C.md}}>Presupuestado</div>
              <div style={{fontSize:"1.1rem",fontWeight:900,color:C.dk}}>${fmt(totalPresupGastos)}</div>
            </div>
            <div style={{marginBottom:8}}>
              <div style={{fontSize:"0.7rem",color:C.md}}>Real</div>
              <div style={{fontSize:"1.1rem",fontWeight:900,color:totalReal>totalPresupGastos?C.ro:C.v}}>${fmt(totalReal)}</div>
            </div>
            {totalPresupGastos>0&&<>
              <div style={{background:"#f0f4f8",borderRadius:20,height:7,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${Math.min(Math.round((totalReal/totalPresupGastos)*100),100)}%`,background:totalReal>totalPresupGastos?C.ro:C.v,borderRadius:20}}/>
              </div>
              <div style={{fontSize:"0.68rem",color:C.md,textAlign:"right",marginTop:2}}>{Math.round((totalReal/totalPresupGastos)*100)}% ejecutado</div>
            </>}
          </Panel>
          {/* INGRESOS */}
          <Panel accent={C.v}>
            <div style={{fontSize:"0.7rem",fontWeight:800,color:C.md,textTransform:"uppercase",marginBottom:8}}>💰 Ingresos</div>
            <div style={{marginBottom:6}}>
              <div style={{fontSize:"0.7rem",color:C.md}}>Presupuestado</div>
              <div style={{fontSize:"1.1rem",fontWeight:900,color:C.dk}}>${fmt(totalPresupIngresos)}</div>
            </div>
            <div style={{marginBottom:8}}>
              <div style={{fontSize:"0.7rem",color:C.md}}>Real</div>
              <div style={{fontSize:"1.1rem",fontWeight:900,color:ingresosReal>=totalPresupIngresos?C.v:C.na}}>${fmt(ingresosReal)}</div>
            </div>
            {totalPresupIngresos>0&&<>
              <div style={{background:"#f0f4f8",borderRadius:20,height:7,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${Math.min(Math.round((ingresosReal/totalPresupIngresos)*100),100)}%`,background:C.v,borderRadius:20}}/>
              </div>
              <div style={{fontSize:"0.68rem",color:C.md,textAlign:"right",marginTop:2}}>{Math.round((ingresosReal/totalPresupIngresos)*100)}% cobrado</div>
            </>}
          </Panel>
        </div>

        {/* Resultado presupuestado vs real */}
        <div style={{background:`linear-gradient(135deg,${C.dk},${C.dk2})`,borderRadius:16,padding:14,marginBottom:12}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:"0.65rem",color:"rgba(255,255,255,.6)",fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Resultado presupuestado</div>
              <div style={{fontSize:"1.2rem",fontWeight:900,color:totalPresupIngresos-totalPresupGastos>=0?C.v2:C.ro}}>{totalPresupIngresos-totalPresupGastos>=0?"+":""} ${fmt(totalPresupIngresos-totalPresupGastos)}</div>
            </div>
            <div style={{textAlign:"center",borderLeft:"1px solid rgba(255,255,255,.15)"}}>
              <div style={{fontSize:"0.65rem",color:"rgba(255,255,255,.6)",fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Resultado real</div>
              <div style={{fontSize:"1.2rem",fontWeight:900,color:ingresosReal-totalReal>=0?C.v2:C.ro}}>{ingresosReal-totalReal>=0?"+":""} ${fmt(ingresosReal-totalReal)}</div>
            </div>
          </div>
        </div>
      </>}

      {/* Items presupuestados */}
      {itemsCamp.length===0&&<div style={{textAlign:"center",padding:30,color:C.lt}}>
        <div style={{fontSize:"2.5rem"}}>📊</div>
        <p style={{marginTop:8,fontWeight:600}}>Sin presupuesto para {campania}</p>
        <p style={{fontSize:"0.8rem",marginTop:4}}>Agregá ítems de ingresos y gastos esperados</p>
      </div>}

      {itemsCamp.length>0&&<>
        {/* Gastos presupuestados */}
        {itemsCamp.filter(i=>i.tipo==="gasto").length>0&&<Panel title="💸 Gastos presupuestados" accent={C.ro}>
          {itemsCamp.filter(i=>i.tipo==="gasto").map(item=>(
            <div key={item.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #f0f4f8"}}>
              <div>
                <div style={{fontWeight:700,fontSize:"0.85rem"}}>{item.concepto||item.cat}</div>
                <div style={{fontSize:"0.7rem",color:C.md}}>{item.cat}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontWeight:900,color:C.ro}}>${fmt(item.monto)}</span>
                <Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,presupuestos:(db.presupuestos||[]).filter(x=>x.id!==item.id)});}}>🗑️</Btn>
              </div>
            </div>
          ))}
        </Panel>}

        {/* Ingresos presupuestados */}
        {itemsCamp.filter(i=>i.tipo==="ingreso").length>0&&<Panel title="💰 Ingresos presupuestados" accent={C.v}>
          {itemsCamp.filter(i=>i.tipo==="ingreso").map(item=>(
            <div key={item.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #f0f4f8"}}>
              <div>
                <div style={{fontWeight:700,fontSize:"0.85rem"}}>{item.concepto||item.cat}</div>
                <div style={{fontSize:"0.7rem",color:C.md}}>{item.cat}{item.toneladas?` · ${item.toneladas}t a $${fmt(item.precio)}/t`:""}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontWeight:900,color:C.v}}>${fmt(item.monto)}</span>
                <Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,presupuestos:(db.presupuestos||[]).filter(x=>x.id!==item.id)});}}>🗑️</Btn>
              </div>
            </div>
          ))}
        </Panel>}
      </>}

      {/* MODAL ITEM */}
      <Modal open={mI} onClose={()=>{setMI(false);setF({});}} title={f.tipo==="ingreso"?"💰 Ítem de ingreso esperado":"💸 Ítem de gasto esperado"}>
        <Inp label="Categoría" value={f.cat||""} onChange={v=>sf("cat",v)} opts={f.tipo==="ingreso"?CATS_INGRESO:CATS_GASTO} sx={{marginBottom:10}}/>
        <Inp label="Concepto / Descripción" value={f.concepto||""} onChange={v=>sf("concepto",v)} placeholder="Ej: Semilla soja 200 bolsas" sx={{marginBottom:10}}/>
        {f.tipo==="ingreso"&&<>
          <FR>
            <Inp label="Toneladas esperadas" type="number" value={f.toneladas||""} onChange={v=>{sf("toneladas",v);sf("monto",String(parseFloat(v||0)*parseFloat(f.precio||0)));}}/>
            <Inp label="Precio estimado $/t" type="number" value={f.precio||""} onChange={v=>{sf("precio",v);sf("monto",String(parseFloat(f.toneladas||0)*parseFloat(v||0)));}}/>
          </FR>
        </>}
        <Inp label="Monto total ($)" type="number" value={f.monto||""} onChange={v=>sf("monto",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>{setMI(false);setF({});}} sv={f.tipo==="ingreso"?"green":"orange"} onSave={()=>{
          const nd=addMov({...db,presupuestos:[...(db.presupuestos||[]),{id:Date.now(),...f,monto:parseFloat(f.monto)||0}]},`📊 Presup. ${f.tipo}: ${f.concepto||f.cat} $${fmt(f.monto)}`);
          setDb(nd);setMI(false);setF({});
        }}/>
      </Modal>
    </div>
  );
}


// ── GESTIÓN DE USUARIOS / PERMISOS ───────────────────────
function SecUsuarios({db,setDb,userEmail}){
  const [mU,setMU]=useState(false);
  const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));

function SecMargenes({db,setDb}){
  const [tab,setTab]=useState("calcular");
  const [dolar,setDolar]=useState("");  // cotización dólar
  const [editando,setEditando]=useState(null); // id del margen en edición

  // Estado del formulario
  const initF=()=>({
    cereal:"Soja", campania:CAMPANIAS[3], loteId:"",
    // Labores: USD/ha por labor
    labores:{},
    // Semilla
    semillaDesc:"", semillaUSD:"",
    // Fumigadas: array de {tipo, productos:[{nombre,litrosHa,precioUSD}]}
    fumigadas:[],
    // Fertilizantes
    fertDesc:"", fertUSD:"",
    ureaDesc:"", ureaUSD:"",
    // Estructura
    alquilerUSD:"", seguroUSD:"", adminUSD:"",
    // Comercialización
    flete2USD:"", secadaUSD:"", impuestoUSD:"",
    // Producción
    rendimiento:"", precioUSD:"",
    // Extras
    extras:[],
  });

  const [f,setF]=useState(initF());
  const sf=(k,v)=>setF(p=>({...p,[k]:v}));
  const sfL=(id,v)=>setF(p=>({...p,labores:{...p.labores,[id]:v}}));

  const margenes=db.margenes||[];

  // ── Cálculos ──
  const tc=parseFloat(dolar)||1;

  const totalLaboresUSD=LABORES_DEF.reduce((s,l)=>s+(parseFloat(f.labores[l.id])||0),0);

  const totalFumigadasUSD=f.fumigadas.reduce((s,fum)=>{
    const costFum=(fum.productos||[]).reduce((ss,p)=>ss+(parseFloat(p.litrosHa)||0)*(parseFloat(p.precioUSD)||0),0);
    return s+costFum+(parseFloat(fum.aplicacionUSD)||0);
  },0);

  const semUSD=parseFloat(f.semillaUSD)||0;
  const fertUSD=(parseFloat(f.fertUSD)||0)+(parseFloat(f.ureaUSD)||0);
  const estructuraUSD=(parseFloat(f.alquilerUSD)||0)+(parseFloat(f.seguroUSD)||0)+(parseFloat(f.adminUSD)||0);
  const comercUSD=(parseFloat(f.flete2USD)||0)+(parseFloat(f.secadaUSD)||0)+(parseFloat(f.impuestoUSD)||0);
  const extrasUSD=(f.extras||[]).reduce((s,e)=>s+(parseFloat(e.usd)||0),0);

  const totalCostosUSD=totalLaboresUSD+totalFumigadasUSD+semUSD+fertUSD+estructuraUSD+comercUSD+extrasUSD;
  const rendimiento=parseFloat(f.rendimiento)||0;
  const precioUSD=parseFloat(f.precioUSD)||0;
  const ingresoUSD=rendimiento*precioUSD/1000;
  const margenUSD=ingresoUSD-totalCostosUSD;

  // ── Agregar fumigada ──

    id:Date.now(), tipo:"Barbecho", aplicacionUSD:"",
    productos:[{nombre:"Glifosato",litrosHa:"",precioUSD:""}]
  }]);
  const updFum=(i,k,v)=>{const nf=[...f.fumigadas];nf[i]={...nf[i],[k]:v};sf("fumigadas",nf);};
  const updProd=(fi,pi,k,v)=>{const nf=[...f.fumigadas];nf[fi].productos=[...nf[fi].productos];nf[fi].productos[pi]={...nf[fi].productos[pi],[k]:v};sf("fumigadas",nf);};
  const addProd=(fi)=>{const nf=[...f.fumigadas];nf[fi].productos=[...nf[fi].productos,{nombre:"Glifosato",litrosHa:"",precioUSD:""}];sf("fumigadas",nf);};
  const delProd=(fi,pi)=>{const nf=[...f.fumigadas];nf[fi].productos=nf[fi].productos.filter((_,j)=>j!==pi);sf("fumigadas",nf);};
  const delFum=(i)=>sf("fumigadas",f.fumigadas.filter((_,j)=>j!==i));

  const guardarMargen=()=>{
    if(!f.cereal)return alert("Elegí un cereal");
    const datos={
      id:editando||Date.now(),
      fecha:editando?(db.margenes||[]).find(m=>m.id===editando)?.fecha||hoy():hoy(),
      cereal:f.cereal, campania:f.campania, loteId:f.loteId||null,
      labores:f.labores, fumigadas:f.fumigadas,
      semillaDesc:f.semillaDesc, semillaUSD:semUSD,
      fertDesc:f.fertDesc, fertUSD:parseFloat(f.fertUSD)||0,
      ureaDesc:f.ureaDesc, ureaUSD:parseFloat(f.ureaUSD)||0,
      alquilerUSD:parseFloat(f.alquilerUSD)||0,
      seguroUSD:parseFloat(f.seguroUSD)||0,
      adminUSD:parseFloat(f.adminUSD)||0,
      flete2USD:parseFloat(f.flete2USD)||0,
      secadaUSD:parseFloat(f.secadaUSD)||0,
      impuestoUSD:parseFloat(f.impuestoUSD)||0,
      extras:f.extras||[],
      rendimiento, precioUSD,
      totalCostosUSD, ingresoUSD, margenUSD,
      dolarAlGuardar:tc
    };
    const nd=editando
      ?addMov({...db,margenes:(db.margenes||[]).map(m=>m.id===editando?datos:m)},`✏️ Margen editado: ${f.cereal} ${f.campania}`)
      :addMov({...db,margenes:[...(db.margenes||[]),datos]},`📊 Margen ${f.cereal} ${f.campania}: USD ${fmt(Math.round(margenUSD))}/ha`);
    setDb(nd);

    alert(`✅ ${editando?"Editado":"Guardado"}!\n${f.cereal} ${f.campania}\nIngreso: USD ${fmt(Math.round(ingresoUSD))}/ha\nCostos: USD ${fmt(Math.round(totalCostosUSD))}/ha\nMargen: ${margenUSD>=0?"+":""}USD ${fmt(Math.round(margenUSD))}/ha`);
  };

  const editarMargen=(m)=>{

      cereal:m.cereal||"Soja", campania:m.campania||CAMPANIAS[3], loteId:m.loteId||"",
      labores:m.labores||{}, fumigadas:m.fumigadas||[],

      fertDesc:m.fertDesc||"", fertUSD:String(m.fertUSD||""),
      ureaDesc:m.ureaDesc||"", ureaUSD:String(m.ureaUSD||""),

    setEditando(m.id);

        </div>
        {dolar&&<div style={{textAlign:"right"}}>
          <div style={{fontSize:"0.65rem",color:"rgba(255,255,255,.5)"}}>USD 1 =</div>

        </div>}
      </div>

      <Tabs items={[{id:"calcular",label:"📊 Calcular"},{id:"guardados",label:"💾 Guardados"},{id:"comparar",label:"⚖️ Comparar"}]} active={tab} onChange={setTab}/>

      {tab==="calcular"&&<div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>

                  {m.semillaUSD>0&&<span style={{background:C.v3,color:C.v,padding:"3px 9px",borderRadius:20,fontSize:"0.7rem",fontWeight:700}}>🌱 USD {fmt(Math.round(m.semillaUSD))}</span>}

                </div>

            );
          })}
      </div>}

      {/* ── COMPARAR ── */}
      {tab==="comparar"&&<div>
        {(!margenes||margenes.length<2)
          ?<div style={{textAlign:"center",padding:40,color:C.lt}}><div style={{fontSize:"2.5rem"}}>⚖️</div><p style={{marginTop:8,fontWeight:600}}>Necesitás al menos 2 márgenes guardados</p></div>
          :<div>
            <InfoBox text="Ranking de márgenes de mayor a menor. Podés comparar distintos cultivos y campañas." color="blue" emoji="⚖️"/>
            {margenes.slice().sort((a,b)=>(b.margenUSD||0)-(a.margenUSD||0)).map((m,i)=>{
              const maxAbs=Math.max(...margenes.map(x=>Math.abs(x.margenUSD||0)));
              const pct=maxAbs>0?Math.round((Math.abs(m.margenUSD||0)/maxAbs)*100):0;
              const lote=db.lotes.find(l=>l.id==m.loteId);
              const campo=lote?db.campos.find(c=>c.id==lote.campoId):null;

              return(

                    <div>

                      <div style={{fontSize:"0.72rem",color:C.md,marginTop:2}}>{campo?`${campo.nombre} — ${lote.nom} · `:""}{m.fecha}</div>
                    </div>
                    <div style={{textAlign:"right"}}>

                      <div style={{fontSize:"0.65rem",color:C.lt}}>por hectárea</div>
                    </div>
                  </div>
                  <div style={{background:"#f0f4f8",borderRadius:20,height:8,overflow:"hidden",marginBottom:6}}>
                    <div style={{height:"100%",width:`${pct}%`,background:(m.margenUSD||0)>=0?`linear-gradient(90deg,${C.v},${C.v2})`:C.ro,borderRadius:20}}/>
                  </div>
                  <div style={{display:"flex",gap:12,fontSize:"0.72rem",color:C.md,flexWrap:"wrap"}}>
                    <span>📥 USD {fmt(Math.round(m.ingresoUSD||0))}/ha</span>
                    <span>📤 USD {fmt(Math.round(m.totalCostosUSD||0))}/ha</span>

                    {m.precioUSD>0&&<span>💵 USD {fmt(m.precioUSD)}/t</span>}

              );
            })}
            <Panel title="📊 Resumen" accent={C.az}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                <div style={{background:C.v3,borderRadius:10,padding:"10px",textAlign:"center"}}>
                  <div style={{fontSize:"0.62rem",color:C.md,fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Mejor</div>
                  <div style={{fontSize:"0.95rem",fontWeight:900,color:C.v}}>USD {fmt(Math.round(Math.max(...margenes.map(m=>m.margenUSD||0))))}</div>
                </div>
                <div style={{background:C.ro3,borderRadius:10,padding:"10px",textAlign:"center"}}>
                  <div style={{fontSize:"0.62rem",color:C.md,fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Peor</div>
                  <div style={{fontSize:"0.95rem",fontWeight:900,color:C.ro}}>USD {fmt(Math.round(Math.min(...margenes.map(m=>m.margenUSD||0))))}</div>

                  <div style={{fontSize:"0.62rem",color:C.md,fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Promedio</div>
                  <div style={{fontSize:"0.95rem",fontWeight:900,color:C.az}}>USD {fmt(Math.round(margenes.reduce((s,m)=>s+(m.margenUSD||0),0)/margenes.length))}</div>
                </div>
              </div>
            </Panel>
          </div>}
      </div>}
    </div>
  );
}


// ── EMPRESAS (P&L POR ÁREA) ───────────────────────────────
function SecEmpresas({db}){
  const [areaActiva,setAreaActiva]=useState(null);
  const [maqAb,setMaqAb]=useState(null);
  const [campania,setCampania]=useState(CAMPANIAS[3]);

  // Calcular ingresos y gastos por área para la campaña seleccionada
  const getPnL=(areaId)=>{
    const añoCamp=campania.slice(0,4);

    // GASTOS del área (de la sección Gastos)
    const gastos=db.gastos.filter(g=>
      g.area===areaId&&(g.campania===campania||(g.fecha||"").startsWith(añoCamp))
    ).reduce((s,g)=>s+(parseFloat(g.monto)||0),0);

    // INGRESOS según área
    let ingresos=0;
    let detIngresos=[];

    if(areaId==="agropecuaria"){
      // Ventas de grano
      const ventas=db.ventas.filter(v=>(v.fecha||"").startsWith(añoCamp));
      const totalVentas=ventas.reduce((s,v)=>s+(parseFloat(v.precio||0)*parseFloat(v.toneladas||0)),0);
      if(totalVentas>0)detIngresos.push({label:"Ventas de grano",monto:totalVentas});
      ingresos+=totalVentas;
    }

    if(areaId==="ganadera"){
      // Ventas de animales
      const ventAnim=db.movAnim.filter(m=>m.tipo==="Venta"&&(m.fecha||"").startsWith(añoCamp));
      const totalAnim=ventAnim.reduce((s,m)=>s+(parseFloat(m.precio||0)*parseFloat(m.cant||0)),0);
      if(totalAnim>0)detIngresos.push({label:"Venta de animales",monto:totalAnim});
      ingresos+=totalAnim;
    }

    if(areaId==="maquinaria"){
      // Ingresos por labores con máquina propia (generados automáticamente)
      const ingMaq=(db.ingresosMaq||[]).filter(x=>(x.fecha||"").startsWith(añoCamp));
      const totalMaq=ingMaq.reduce((s,x)=>s+(parseFloat(x.monto)||0),0);
      if(totalMaq>0)detIngresos.push({label:"Labores con máquina propia",monto:totalMaq,items:ingMaq});
      ingresos+=totalMaq;
    }

    return{gastos,ingresos,resultado:ingresos-gastos,detIngresos};
  };

  const areas=AREAS_EMPRESA;

  return(
    <div>
      {/* Selector campaña */}
      <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:14,flexWrap:"wrap"}}>
        <span style={{fontSize:"0.75rem",fontWeight:800,color:C.md}}>Campaña:</span>
        {CAMPANIAS.map(cp=>(
          <button key={cp} onClick={()=>setCampania(cp)} style={{padding:"6px 14px",borderRadius:30,border:`1.5px solid ${cp===campania?C.az:"#e2e8f0"}`,background:cp===campania?C.az:"#fff",color:cp===campania?"#fff":C.md,fontSize:"0.76rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>
            {cp}
          </button>
        ))}
      </div>

      {/* Cards resumen por área */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        {areas.map(area=>{
          const {gastos,ingresos,resultado}=getPnL(area.id);
          const activa=areaActiva===area.id;
          return(
            <div key={area.id}
              onClick={()=>setAreaActiva(activa?null:area.id)}
              style={{background:activa?area.col:"#fff",borderRadius:16,padding:14,boxShadow:"0 2px 12px rgba(0,0,0,.07)",border:`2px solid ${activa?area.col:area.col+"44"}`,cursor:"pointer",transition:"all .2s"}}
            >
              <div style={{fontSize:"0.78rem",fontWeight:800,color:activa?"#fff":area.col,marginBottom:8}}>{area.label}</div>
              <div style={{fontSize:"1.3rem",fontWeight:900,color:activa?"#fff":resultado>=0?C.v:C.ro}}>
                {resultado>=0?"+":""}{fmt(Math.round(resultado))}
              </div>
              <div style={{fontSize:"0.65rem",color:activa?"rgba(255,255,255,.7)":C.lt,marginTop:2}}>resultado</div>
              {(ingresos>0||gastos>0)&&<div style={{display:"flex",gap:8,marginTop:8,fontSize:"0.7rem"}}>
                <span style={{color:activa?"rgba(255,255,255,.8)":C.v}}>↑ ${fmt(Math.round(ingresos))}</span>
                <span style={{color:activa?"rgba(255,255,255,.8)":C.ro}}>↓ ${fmt(Math.round(gastos))}</span>
              </div>}
            </div>
          );
        })}
      </div>

      {/* Detalle del área seleccionada */}
      {areaActiva&&(()=>{
        const area=areas.find(a=>a.id===areaActiva);
        const {gastos,ingresos,resultado,detIngresos}=getPnL(areaActiva);

// ── ASISTENTE IA ──────────────────────────────────────────
function SecAsistente({db}){
  const [msgs,setMsgs]=useState([{role:"assistant",content:"¡Hola! Soy tu asistente de Campo Ramihue 🌾 Puedo responder preguntas sobre tus datos — gastos, cosechas, animales, ventas, márgenes, y más.\n\n🎤 También podés hablarme: tocá el micrófono, decí lo que querés saber, y te respondo."}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [escuchando,setEscuchando]=useState(false);
  const [reconError,setReconError]=useState("");
  const chatRef=React.useRef(null);
  const reconRef=React.useRef(null);

  React.useEffect(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},[msgs]);

  // ── MICRÓFONO ─────────────────────────────────────────
  const iniciarMicrofono=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setReconError("Tu navegador no soporta reconocimiento de voz. Usá Chrome.");return;}
    if(escuchando){reconRef.current&&reconRef.current.stop();setEscuchando(false);return;}
    const rec=new SR();
    rec.lang="es-AR";
    rec.continuous=false;
    rec.interimResults=false;
    rec.onstart=()=>{setEscuchando(true);setReconError("");};
    rec.onresult=(e)=>{
      const texto=e.results[0][0].transcript;
      setInput(texto);
      setEscuchando(false);
      // Enviar automáticamente
      setTimeout(()=>send(texto),300);
    };
    rec.onerror=(e)=>{
      setEscuchando(false);
      if(e.error==="not-allowed")setReconError("Permiso de micrófono denegado. Habilitalo en el navegador.");
      else if(e.error==="no-speech")setReconError("No se detectó voz. Intentá de nuevo.");
      else setReconError("Error de micrófono: "+e.error);
    };
    rec.onend=()=>setEscuchando(false);
    reconRef.current=rec;
    rec.start();
  };

      {exports.map((exp,i)=>(

        </div>
        <Inp label="Nº Factura / Remito (opcional)" value={f.factura||""} onChange={v=>sf("factura",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>{setMT(false);setF({});}} sv="teal" onSave={()=>{
          const tipoReal=f.tipo==="Otro"?(f.tipoManual||"Otro"):f.tipo;
          const {neto,iva,total}=calcIVA(f);
          const trabId=Date.now();
          let nd=f.id
            ?addMov({...db,trabajos:(db.trabajos||[]).map(x=>x.id===f.id?{...f,tipo:tipoReal,monto:total,montoNeto:neto,montoIva:iva,ivaAlicuota:f.ivaAlicuota||"21"}:x)},`✏️ Trabajo editado: ${tipoReal}`)
            :addMov({...db,trabajos:[...(db.trabajos||[]),{id:trabId,...f,tipo:tipoReal,monto:total,montoNeto:neto,montoIva:iva,ivaAlicuota:f.ivaAlicuota||"21"}]},`🔧 ${tipoReal}: ${f.proveedor||""} $${fmt(total)}`);
          if(!f.id&&total>0&&f.estado!=="Pendiente"){
            nd=addCaja(nd,{tipo:"salida",monto:total,concepto:`Trabajo: ${tipoReal}${f.proveedor?` — ${f.proveedor}`:""}`,categoria:"Pago servicio",area:"maquinaria",fecha:f.fecha,origenTipo:"trabajo",origenId:trabId,contraparte:f.proveedor||""});
          }
          setDb(nd);setMT(false);setF({});
        }}/>
      </Modal>
    </div>
  );
}

function SecDatos({db,setDb}){
  const ref=useRef();
  const [msg,setMsg]=useState("");

  const exportar=()=>{
    const json=JSON.stringify(db,null,2);
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="CampoRamihue_datos_"+new Date().toLocaleDateString("es-AR").replace(/\//g,"-")+".json";
    a.click();
    URL.revokeObjectURL(url);
    setMsg("✅ Datos exportados correctamente");
  };

  const importar=(file)=>{
    if(!file)return;
    const r=new FileReader();
    r.onload=e=>{
      try{
        const d=JSON.parse(e.target.result);
        if(!d.campos&&!d.gastos)throw new Error("Archivo inválido");
        if(!confirm("¿Importar estos datos? Se van a reemplazar los actuales."))return;
        setDb(d);
        try{localStorage.setItem("gfa2",JSON.stringify(d));}catch(err){}
        setMsg("✅ Datos importados correctamente");
      }catch(err){
        setMsg("❌ Error al leer el archivo. Verificá que sea un backup de GenAFarm.");
      }
    };
    r.readAsText(file);
  };

  return(
    <div>
      <InfoBox text="Exportá tus datos para hacer un backup o para pasarlos a otro dispositivo. Luego importalos en la nueva app." color="blue" emoji="💾"/>

      <Panel title="📤 Exportar mis datos" accent={C.v}>
        <p style={{fontSize:"0.82rem",color:C.dk2,marginBottom:14,lineHeight:1.5}}>Descargá un archivo con todos tus datos: campos, lotes, animales, gastos, cosechas y todo lo demás.</p>
        <Btn onClick={exportar} sx={{width:"100%",justifyContent:"center",marginBottom:8}}>💾 Descargar mis datos</Btn>
        <p style={{fontSize:"0.74rem",color:C.md,textAlign:"center"}}>Se descarga un archivo .json — guardalo en un lugar seguro</p>
      </Panel>

      <Panel title="📥 Importar datos" accent={C.az}>
        <p style={{fontSize:"0.82rem",color:C.dk2,marginBottom:14,lineHeight:1.5}}>Si ya tenés un backup descargado antes, subilo acá para recuperar todos tus datos.</p>
        <input ref={ref} type="file" accept=".json" style={{display:"none"}} onChange={e=>importar(e.target.files[0])}/>
        <Btn v="blue" onClick={()=>ref.current.click()} sx={{width:"100%",justifyContent:"center",marginBottom:8}}>📂 Seleccionar archivo de backup</Btn>
        <p style={{fontSize:"0.74rem",color:C.md,textAlign:"center"}}>⚠️ Esto reemplaza los datos actuales de la app</p>
      </Panel>

      {msg&&<div style={{background:msg.startsWith("✅")?C.v3:C.ro3,border:`1.5px solid ${msg.startsWith("✅")?"#b8f0d8":C.ro}`,borderRadius:13,padding:"14px 16px",textAlign:"center",fontSize:"0.88rem",fontWeight:700,color:msg.startsWith("✅")?C.v:C.ro}}>{msg}</div>}
    </div>
  );
}

function SecCaja({db,setDb}){
  const [tab,setTab]=useState("movimientos");
  const [mM,setMM]=useState(false);
  const [mesSel,setMesSel]=useState(mesActual());
  const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));

  const TIPOS_ENTRADA=["Cobro venta granos","Cobro servicio","Préstamo recibido","Aporte propio","Cobro arrendamiento","Devolución","Otro ingreso"];
  const TIPOS_SALIDA=["Pago proveedor","Pago personal","Pago arrendamiento","Pago cuota crédito","Retiro personal","Impuesto","Pago servicio","Otro egreso"];
  const MEDIOS=["Efectivo","Transferencia","Cheque","eChecq","Débito","Crédito"];

  const movs=db.movsCaja||[];
  const mesesDisp=[...new Set(movs.map(m=>(m.fecha||"").slice(0,7)).filter(Boolean))].sort((a,b)=>b.localeCompare(a));
  const movsMes=movs.filter(m=>(m.fecha||"").startsWith(mesSel));
  const entradas=movsMes.filter(m=>m.tipo==="entrada").reduce((s,m)=>s+(parseFloat(m.monto)||0),0);
  const salidas=movsMes.filter(m=>m.tipo==="salida").reduce((s,m)=>s+(parseFloat(m.monto)||0),0);
  const saldo=entradas-salidas;
  const saldoAcum=movs.filter(m=>(m.fecha||"")<=mesSel+"~").reduce((s,m)=>s+(m.tipo==="entrada"?1:-1)*(parseFloat(m.monto)||0),0);

  const formatMes=(k)=>{if(!k)return"";const[y,m]=k.split("-");return new Date(y,parseInt(m)-1,1).toLocaleString("es-AR",{month:"long",year:"numeric"});};

  return(
    <div>
      <div style={{display:"flex",gap:7,marginBottom:12}}>
        <Btn onClick={()=>{setF({fecha:hoy(),tipo:"entrada",medio:"Transferencia"});setMM(true);}}>+ Movimiento</Btn>

        {(mesesDisp.length>0?mesesDisp:[mesActual()]).slice(0,12).map(m=>(
          <button key={m} onClick={()=>setMesSel(m)} style={{padding:"6px 12px",borderRadius:30,border:`1.5px solid ${m===mesSel?C.v:"#e2e8f0"}`,background:m===mesSel?C.v:"#fff",color:m===mesSel?"#fff":C.md,fontSize:"0.74rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>
            {formatMes(m).slice(0,3).toUpperCase()} {m.slice(0,4)}
          </button>
        ))}
      </div>

      {/* Tarjetas resumen */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:12}}>
        <div style={{background:`linear-gradient(135deg,${C.v2},${C.v})`,borderRadius:14,padding:13,textAlign:"center"}}>
          <div style={{fontSize:"0.6rem",fontWeight:800,color:"rgba(255,255,255,.7)",textTransform:"uppercase",marginBottom:4}}>✅ Entradas</div>
          <div style={{fontSize:"1.1rem",fontWeight:900,color:"#fff"}}>${fmtC(entradas)}</div>
        </div>
        <div style={{background:`linear-gradient(135deg,${C.ro},#f07070)`,borderRadius:14,padding:13,textAlign:"center"}}>
          <div style={{fontSize:"0.6rem",fontWeight:800,color:"rgba(255,255,255,.7)",textTransform:"uppercase",marginBottom:4}}>❌ Salidas</div>
          <div style={{fontSize:"1.1rem",fontWeight:900,color:"#fff"}}>${fmtC(salidas)}</div>
        </div>
        <div style={{background:`linear-gradient(135deg,${saldo>=0?C.az:"#e05252"},${saldo>=0?"#5b9cf6":"#f07070"})`,borderRadius:14,padding:13,textAlign:"center"}}>
          <div style={{fontSize:"0.6rem",fontWeight:800,color:"rgba(255,255,255,.7)",textTransform:"uppercase",marginBottom:4}}>{saldo>=0?"💰 Superávit":"⚠️ Déficit"}</div>
          <div style={{fontSize:"1.1rem",fontWeight:900,color:"#fff"}}>${fmtC(Math.abs(saldo))}</div>
        </div>
      </div>
      <div style={{background:"#fff",borderRadius:13,padding:"10px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 2px 8px rgba(0,0,0,.05)"}}>
        <span style={{fontSize:"0.8rem",fontWeight:700,color:C.md}}>Saldo acumulado a fin de mes:</span>
        <span style={{fontSize:"1.1rem",fontWeight:900,color:saldoAcum>=0?C.v:C.ro}}>${fmtC(Math.round(saldoAcum))}</span>
      </div>

      <Tabs items={[{id:"movimientos",label:"📋 Movimientos"},{id:"flujo",label:"📈 Flujo anual"}]} active={tab} onChange={setTab}/>

      {tab==="movimientos"&&<>
        {movsMes.length===0&&<InfoBox text="Sin movimientos en este mes. Registrá entradas y salidas para ver el flujo de caja." color="blue" emoji="💵"/>}
        {movsMes.slice().sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).map(m=>(
          <div key={m.id} style={{background:"#fff",borderRadius:12,padding:"11px 14px",marginBottom:7,boxShadow:"0 1px 6px rgba(0,0,0,.05)",borderLeft:`3px solid ${m.tipo==="entrada"?C.v:C.ro}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:800,fontSize:"0.88rem",color:C.dk}}>{m.concepto||m.categoria||"—"}</div>
                <div style={{display:"flex",gap:6,marginTop:3,flexWrap:"wrap",alignItems:"center"}}>
                  <Bdg label={m.tipo==="entrada"?"✅ Entrada":"❌ Salida"} col={m.tipo==="entrada"?"green":"red"}/>
                  {m.auto&&<Bdg label="⚡ Auto" col="teal"/>}
                  <span style={{fontSize:"0.7rem",color:C.md}}>{m.fecha}</span>
                  {m.medio&&<span style={{fontSize:"0.7rem",color:C.md}}>· {m.medio}</span>}
                  {m.contraparte&&<span style={{fontSize:"0.7rem",color:C.md}}>· {m.contraparte}</span>}
                  {m.area&&m.area!=="general"&&<span style={{fontSize:"0.68rem",background:C.v3,color:C.v,padding:"1px 6px",borderRadius:10,fontWeight:700}}>{AREAS_EMPRESA.find(a=>a.id===m.area)?.label||m.area}</span>}
                </div>
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <span style={{fontWeight:900,fontSize:"1rem",color:m.tipo==="entrada"?C.v:C.ro}}>{m.tipo==="entrada"?"+":"-"}${fmtC(parseFloat(m.monto)||0)}</span>
                {!m.auto&&<button onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,movsCaja:(db.movsCaja||[]).filter(x=>x.id!==m.id)});}} style={{background:C.ro3,border:"none",borderRadius:6,padding:"4px 8px",cursor:"pointer",fontSize:"0.7rem",color:C.ro}}>🗑️</button>}
              </div>
            </div>
          </div>
        ))}
      </>}

      {tab==="flujo"&&(()=>{
        const hoyD=new Date();
        const meses12=[];
        for(let i=11;i>=0;i--){const d=new Date(hoyD.getFullYear(),hoyD.getMonth()-i,1);meses12.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);}
        const datos=meses12.map(key=>{
          const ms=movs.filter(m=>(m.fecha||"").startsWith(key));
          const e=ms.filter(m=>m.tipo==="entrada").reduce((s,m)=>s+(parseFloat(m.monto)||0),0);
          const s=ms.filter(m=>m.tipo==="salida").reduce((s,m)=>s+(parseFloat(m.monto)||0),0);
          const label=new Date(key+"-01").toLocaleString("es-AR",{month:"short"});
          return{key,label,entradas:e,salidas:s,neto:e-s};
        });
        const maxVal=Math.max(...datos.map(d=>Math.max(d.entradas,d.salidas)),1);
        return(
          <Panel title="📈 Flujo de caja — últimos 12 meses" accent={C.az}>

                      <div style={{flex:1,background:C.ro,borderRadius:"4px 4px 0 0",height:`${Math.round((d.salidas/maxVal)*100)}%`,minHeight:d.salidas>0?3:0,transition:"height .3s"}}/>
                    </div>
                    <div style={{fontSize:"0.6rem",fontWeight:700,color:d.neto>=0?C.v:C.ro,textAlign:"center"}}>{d.neto>=0?"+":""}{fmtC(Math.round(d.neto))}</div>

                ))}
              </div>
              <div style={{display:"flex",gap:12,justifyContent:"center",marginTop:8}}>
                <span style={{fontSize:"0.7rem",color:C.v,fontWeight:700}}>■ Entradas</span>
                <span style={{fontSize:"0.7rem",color:C.ro,fontWeight:700}}>■ Salidas</span>
              </div>
            </div>
          </Panel>
        );
      })()}

      <Modal open={mM} onClose={()=>setMM(false)} title="💵 Nuevo movimiento de caja">
        <FR>
          <Inp label="Fecha" type="date" value={f.fecha||hoy()} onChange={v=>sf("fecha",v)}/>
        </FR>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
          <button onClick={()=>sf("tipo","entrada")} style={{padding:"14px",borderRadius:12,border:`2px solid ${f.tipo==="entrada"?C.v:"#e2e8f0"}`,background:f.tipo==="entrada"?C.v3:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:800,color:f.tipo==="entrada"?C.v:C.md,fontSize:"0.88rem"}}>✅ Entrada</button>
          <button onClick={()=>sf("tipo","salida")} style={{padding:"14px",borderRadius:12,border:`2px solid ${f.tipo==="salida"?C.ro:"#e2e8f0"}`,background:f.tipo==="salida"?C.ro3:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:800,color:f.tipo==="salida"?C.ro:C.md,fontSize:"0.88rem"}}>❌ Salida</button>
        </div>
        <Inp label="Categoría" value={f.categoria||""} onChange={v=>sf("categoria",v)} opts={[{v:"",l:"-- Seleccionar --"},...(f.tipo==="entrada"?TIPOS_ENTRADA:TIPOS_SALIDA).map(t=>({v:t,l:t}))]} sx={{marginBottom:8}}/>
        <Inp label="Concepto / Detalle" value={f.concepto||""} onChange={v=>sf("concepto",v)} sx={{marginBottom:8}}/>
        <FR><Inp label="Monto ($)" type="number" value={f.monto||""} onChange={v=>sf("monto",v)}/><Inp label="Medio" value={f.medio||"Transferencia"} onChange={v=>sf("medio",v)} opts={MEDIOS}/></FR>
        <Inp label="Contraparte (quién pagó / a quién)" value={f.contraparte||""} onChange={v=>sf("contraparte",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>setMM(false)} onSave={()=>{
          if(!f.tipo)return alert("Elegí entrada o salida");
          const nd=addMov({...db,movsCaja:[...(db.movsCaja||[]),{id:Date.now(),...f,monto:parseFloat(f.monto)||0}]},
            `💵 Caja ${f.tipo==="entrada"?"(+)":"(-)"}${f.categoria?` ${f.categoria}`:""}: $${fmt(f.monto)}`);
          setDb(nd);setMM(false);setF({});
        }}/>
      </Modal>
    </div>
  );
}

function SecDeudores({db,setDb}){
  const [tab,setTab]=useState("deudores");

  const [mA,setMA]=useState(false);
  const [mPagoD,setMPagoD]=useState(false);
  const [mPagoA,setMPagoA]=useState(false);

  const deudores=db.deudores||[];
  const acreedores=db.acreedores||[];

  const totalDeudores=deudores.reduce((s,d)=>{const cobrado=(d.cobros||[]).reduce((ss,c)=>ss+(parseFloat(c.monto)||0),0);return s+Math.max(0,(parseFloat(d.monto)||0)-cobrado);},0);
  const totalAcreedores=acreedores.reduce((s,a)=>{const pagado=(a.pagos||[]).reduce((ss,p)=>ss+(parseFloat(p.monto)||0),0);return s+Math.max(0,(parseFloat(a.monto)||0)-pagado);},0);

  const SaldoItem=({item,tipo})=>{

    const vencido=item.vencimiento&&new Date(item.vencimiento)<new Date()&&saldo>0;
    return(

            <div style={{fontSize:"0.74rem",color:C.md,marginTop:2}}>{item.concepto||"—"} · {item.fecha||"—"}</div>
            {item.vencimiento&&<div style={{fontSize:"0.7rem",color:vencido?C.ro:C.md,fontWeight:vencido?800:400,marginTop:2}}>{vencido?"⚠️ Vencido":"📅 Vence"}: {item.vencimiento}</div>}

            <div style={{fontSize:"0.68rem",color:C.md,marginTop:3}}>{pct}% {tipo==="deudor"?"cobrado":"pagado"} · Original: ${fmt(original)}</div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontSize:"1.1rem",fontWeight:900,color:saldo===0?C.v:vencido?C.ro:tipo==="deudor"?C.v:C.na}}>{saldo===0?"✅ Cobrado":"$"+fmtC(Math.round(saldo))}</div>
            {saldo>0&&<div style={{display:"flex",gap:4,marginTop:6,justifyContent:"flex-end"}}>
              <button onClick={()=>{setSel(item);setF({fecha:hoy(),monto:""});tipo==="deudor"?setMPagoD(true):setMPagoA(true);}} style={{background:tipo==="deudor"?C.v3:C.na3,border:"none",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:"0.72rem",fontWeight:800,color:tipo==="deudor"?C.v:C.na}}>💰 {tipo==="deudor"?"Cobrar":"Pagar"}</button>
              <button onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,[tipo==="deudor"?"deudores":"acreedores"]:(tipo==="deudor"?deudores:acreedores).filter(x=>x.id!==item.id)});}} style={{background:C.ro3,border:"none",borderRadius:8,padding:"5px 8px",cursor:"pointer",fontSize:"0.7rem",color:C.ro}}>🗑️</button>
            </div>}
          </div>
        </div>

          <div style={{fontSize:"1.2rem",fontWeight:900,color:"#fff"}}>${fmtC(Math.round(totalDeudores))}</div>
          <div style={{fontSize:"0.68rem",color:"rgba(255,255,255,.7)",marginTop:2}}>{deudores.filter(d=>{const c=(d.cobros||[]).reduce((s,x)=>s+(parseFloat(x.monto)||0),0);return c<(parseFloat(d.monto)||0);}).length} pendientes</div>
        </div>
        <div style={{background:`linear-gradient(135deg,${C.na},${C.na2})`,borderRadius:14,padding:13,textAlign:"center"}}>

          <div style={{fontSize:"1.2rem",fontWeight:900,color:"#fff"}}>${fmtC(Math.round(totalAcreedores))}</div>
          <div style={{fontSize:"0.68rem",color:"rgba(255,255,255,.7)",marginTop:2}}>{acreedores.filter(a=>{const p=(a.pagos||[]).reduce((s,x)=>s+(parseFloat(x.monto)||0),0);return p<(parseFloat(a.monto)||0);}).length} pendientes</div>

      {/* Modal nuevo deudor */}

        <Inp label="Concepto (¿por qué te debe?)" value={f.concepto||""} onChange={v=>sf("concepto",v)} sx={{marginBottom:8}}/>
        <FR><Inp label="Fecha" type="date" value={f.fecha||hoy()} onChange={v=>sf("fecha",v)}/><Inp label="Vencimiento" type="date" value={f.vencimiento||""} onChange={v=>sf("vencimiento",v)}/></FR>
        <FR><Inp label="Monto ($)" type="number" value={f.monto||""} onChange={v=>sf("monto",v)}/><Inp label="Teléfono" value={f.tel||""} onChange={v=>sf("tel",v)}/></FR>
        <Inp label="Nota" value={f.nota||""} onChange={v=>sf("nota",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>setMD(false)} onSave={()=>{setDb({...db,deudores:[...(db.deudores||[]),{id:Date.now(),...f,monto:parseFloat(f.monto)||0,cobros:[]}]});setMD(false);setF({});}}/>

        <Inp label="Nota" value={f.nota||""} onChange={v=>sf("nota",v)} sx={{marginBottom:4}}/>

        <Inp label="Nota" value={f.nota||""} onChange={v=>sf("nota",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>{setMPagoD(false);setSel(null);setF({});}} saveLabel="Registrar cobro" onSave={()=>{
          const montoCobro=parseFloat(f.monto)||0;
          const cobroId=Date.now();
          let nd={...db,deudores:(db.deudores||[]).map(d=>d.id===sel.id?{...d,cobros:[...(d.cobros||[]),{fecha:f.fecha||hoy(),monto:montoCobro,nota:f.nota||""}]}:d)};
          nd=addCaja(nd,{tipo:"entrada",monto:montoCobro,concepto:`Cobro: ${sel.nombre||"—"} — ${sel.concepto||""}`,categoria:"Cobro deudor",area:"general",fecha:f.fecha,origenTipo:"cobro_deudor",origenId:sel.id,contraparte:sel.nombre||""});

// ── CRÉDITOS BANCARIOS ────────────────────────────────────
function SecCreditos({db,setDb}){
  const [mC,setMC]=useState(false);
  const [mPago,setMPago]=useState(false);
  const [sel,setSel]=useState(null);
  const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));

  const creditos=db.creditos||[];
  const BANCOS=["Banco Nación","Banco Provincia","Galicia","Santander","HSBC","BBVA","Macro","Supervielle","Otro"];
  const TIPOS_CRED=["Préstamo personal","Préstamo prendario","Hipotecario","Línea agro","Descubierto en cuenta","Tarjeta crédito","Otro"];

  const totalDeuda=creditos.reduce((s,c)=>{
    const pagado=(c.pagosRealizados||[]).reduce((ss,p)=>ss+(parseFloat(p.monto)||0),0);
    return s+Math.max(0,(parseFloat(c.montoTotal)||0)-pagado);
  },0);
  const proxVencer=creditos.filter(c=>{
    const pagado=(c.pagosRealizados||[]).reduce((s,p)=>s+(parseFloat(p.monto)||0),0);
    const saldo=(parseFloat(c.montoTotal)||0)-pagado;
    if(saldo<=0)return false;
    if(!c.proximaCuota)return false;
    const dias=(new Date(c.proximaCuota)-new Date())/(1000*60*60*24);
    return dias<=15&&dias>=0;
  });

  return(
    <div>
      {proxVencer.length>0&&<div style={{background:"#fff3cd",border:"1.5px solid #f5c842",borderRadius:12,padding:"10px 14px",marginBottom:12,display:"flex",gap:8,alignItems:"center"}}>
        <span style={{fontSize:"1.2rem"}}>⚠️</span>
        <div><div style={{fontWeight:800,fontSize:"0.82rem",color:"#856404"}}>Cuotas próximas a vencer ({proxVencer.length})</div>
        <div style={{fontSize:"0.74rem",color:"#856404"}}>{proxVencer.map(c=>c.banco||c.descripcion).join(", ")}</div></div>
      </div>}

      <div style={{display:"flex",gap:7,marginBottom:12}}><Btn v="blue" onClick={()=>{setF({fechaInicio:hoy()});setMC(true);}}>+ Crédito / Préstamo</Btn></div>

      {/* Resumen deuda total */}
      {creditos.length>0&&<div style={{background:`linear-gradient(135deg,${C.az},#5b9cf6)`,borderRadius:14,padding:14,marginBottom:12}}>
        <div style={{fontSize:"0.7rem",fontWeight:800,color:"rgba(255,255,255,.7)",textTransform:"uppercase",marginBottom:4}}>🏦 Deuda bancaria total</div>
        <div style={{fontSize:"1.8rem",fontWeight:900,color:"#fff"}}>${fmtC(Math.round(totalDeuda))}</div>
        <div style={{fontSize:"0.78rem",color:"rgba(255,255,255,.7)",marginTop:3}}>{creditos.length} crédito{creditos.length!==1?"s":""} activo{creditos.length!==1?"s":""}</div>
      </div>}

      {creditos.length===0&&<InfoBox text="Registrá tus préstamos y créditos bancarios para tener el control de las cuotas y saldo pendiente." color="blue" emoji="🏦"/>}

      {creditos.map(c=>{
        const pagado=(c.pagosRealizados||[]).reduce((s,p)=>s+(parseFloat(p.monto)||0),0);
        const saldo=Math.max(0,(parseFloat(c.montoTotal)||0)-pagado);
        const pct=(parseFloat(c.montoTotal)||0)>0?Math.min(100,Math.round((pagado/(parseFloat(c.montoTotal)||1))*100)):0;
        const cancelado=saldo<=0;
        const proxDias=c.proximaCuota?Math.round((new Date(c.proximaCuota)-new Date())/(1000*60*60*24)):null;
        return(
          <div key={c.id} style={{background:"#fff",borderRadius:14,padding:14,marginBottom:10,boxShadow:"0 2px 12px rgba(0,0,0,.06)",borderTop:`3px solid ${cancelado?C.v:C.az}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div>
                <div style={{fontWeight:900,fontSize:"0.95rem",color:C.dk}}>🏦 {c.banco||"Banco"}</div>
                <div style={{fontSize:"0.75rem",color:C.md,marginTop:2}}>{c.tipo||"—"} · Inicio: {c.fechaInicio||"—"}</div>
                {c.descripcion&&<div style={{fontSize:"0.75rem",color:C.md}}>{c.descripcion}</div>}
              </div>
              {cancelado?<Bdg label="✅ Cancelado" col="green"/>:<div style={{textAlign:"right"}}>
                <div style={{fontSize:"1.1rem",fontWeight:900,color:C.az}}>${fmtC(Math.round(saldo))}</div>

              </div>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:8}}>
              <div style={{background:C.bg,borderRadius:8,padding:"7px",textAlign:"center"}}>
                <div style={{fontSize:"0.58rem",fontWeight:700,color:C.md,textTransform:"uppercase"}}>Total</div>
                <div style={{fontSize:"0.82rem",fontWeight:800,color:C.dk}}>${fmtC(parseFloat(c.montoTotal)||0)}</div>
              </div>
              <div style={{background:C.v3,borderRadius:8,padding:"7px",textAlign:"center"}}>
                <div style={{fontSize:"0.58rem",fontWeight:700,color:C.v,textTransform:"uppercase"}}>Pagado</div>
                <div style={{fontSize:"0.82rem",fontWeight:800,color:C.v}}>${fmtC(Math.round(pagado))}</div>
              </div>
              <div style={{background:C.az3,borderRadius:8,padding:"7px",textAlign:"center"}}>

          if(parseFloat(f.montoTotal)>0){

            let nd={...db,creditos:[...(db.creditos||[]),{id:credId,...f,montoTotal:parseFloat(f.montoTotal)||0,cuotaMensual:parseFloat(f.cuotaMensual)||0,pagosRealizados:[]}]};
