          setMC(false);setF({});
        }}/>
      </Modal>

      {/* Modal pago cuota */}
      <Modal open={mPago} onClose={()=>{setMPago(false);setSel(null);setF({});}} title="💰 Pagar cuota">
        {sel&&<InfoBox text={`${sel.banco||"—"} · ${sel.tipo||"—"} · Saldo: $${fmt(Math.max(0,(parseFloat(sel.montoTotal)||0)-(sel.pagosRealizados||[]).reduce((s,p)=>s+(parseFloat(p.monto)||0),0)))}`} color="blue" emoji="🏦"/>}
        <FR><Inp label="Fecha" type="date" value={f.fecha||hoy()} onChange={v=>sf("fecha",v)}/><Inp label="Monto ($)" type="number" value={f.monto||""} onChange={v=>sf("monto",v)}/></FR>

          nd=addCaja(nd,{tipo:"salida",monto:montoCuota,concepto:`Cuota ${sel.banco||"—"}: ${sel.tipo||""}`,categoria:"Pago cuota crédito",area:"general",fecha:f.fecha,origenTipo:"pago_credito",origenId:pagoCredId,contraparte:sel.banco||""});
          setDb(nd);setMPago(false);setSel(null);setF({});
        }}/>
      </Modal>
    </div>
  );
}

function buildWA(db){
  const d=new Date().toLocaleDateString("es-AR");
  const gm=db.gastos.filter(g=>g.fecha.startsWith(mesActual())).reduce((s,g)=>s+(parseFloat(g.monto)||0),0);
  const mm=db.lluvias.filter(l=>l.fecha.startsWith(mesActual())).reduce((s,l)=>s+parseFloat(l.mm||0),0);
  return`🌾 *GENAFARM – Resumen*\n📅 ${d}\n\n🌍 Campos: ${db.campos.length} · Lotes: ${db.lotes.length}\n🐄 Animales: ${fmt(db.animales.reduce((s,a)=>s+(parseInt(a.cant)||0),0))}\n🛍️ Silos activas: ${db.silos.filter(s=>s.estado==="Activa").length}\n🌧️ Lluvia este mes: ${mm.toFixed(0)}mm\n📦 Insumos: ${db.insumos.length}\n🌽 Cosecha: ${fmt(db.cosechas.reduce((s,c)=>{const kgC=db.cosechaCamiones.filter(x=>x.cosechaId==c.id).reduce((ss,x)=>ss+(parseFloat(x.kg)||0),0);const kgS=c.silobolsas&&c.silobolsas.length>0?(c.silobolsas||[]).reduce((ss,sb)=>ss+(parseFloat(sb.kg)||0),0):(parseFloat(c.kgSilo)||0);const t=kgS+kgC;return s+(t>0?t:(c.netos||0));},0))} kg\n📋 Ventas pend.: ${fmt(db.ventas.filter(v=>v.estado==="Pendiente").reduce((s,v)=>s+(parseFloat(v.toneladas)||0),0))} t\n💰 Gastos mes: $${fmt(gm)}\n📅 Tareas pend.: ${db.tareas.filter(t=>t.est!=="Completada").length}\n\n_GenAFarm_`;
}

              <text x="50%" y="57%" dominantBaseline="middle" textAnchor="middle" fontFamily="Georgia,serif" fontSize="36" fontWeight="bold" fontStyle="italic" fill="white" letterSpacing="-1">ER</text>

  const [syncing,setSyncing]=useState(false);

  // Auth listener
  useEffect(()=>{
    const unsub=fbAuth.onAuthStateChanged(u=>{
      setUser(u);
      setAuthLoading(false);
    });
    return ()=>unsub();
  },[]);

  // Firebase sync - listen to changes
  useEffect(()=>{
    if(!user)return;
    const dbRef=fbDb.ref("genafarm/datos");
    const handler=dbRef.on("value",(snapshot)=>{
      const data=snapshot.val();
      if(data){
        setDb({...initDB(),...data});
      }
    });
    return ()=>dbRef.off("value",handler);
  },[user]);

  const save=(nd)=>{
    setDb(nd);
    // Save to Firebase
    if(user){
      setSyncing(true);
      fbDb.ref("genafarm/datos").set(nd)
        .then(()=>setSyncing(false))
        .catch(()=>setSyncing(false));

              <div style={{fontSize:"0.58rem",fontWeight:800,color:"rgba(255,255,255,.35)",textTransform:"uppercase",letterSpacing:"1px",padding:"8px 16px 4px"}}>{g.label}</div>
              {g.items.map(n=>(
                <button key={n.id} onClick={()=>setSec(n.id)} style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"8px 16px",background:sec===n.id?`linear-gradient(90deg,${C.v}22,transparent)`:"none",border:"none",borderLeft:sec===n.id?`3px solid ${C.v}`:"3px solid transparent",cursor:"pointer",fontFamily:"inherit",transition:"all .15s",textAlign:"left"}}>
                  <span style={{fontSize:"1.05rem",flexShrink:0,opacity:sec===n.id?1:0.7}}>{n.i}</span>
                  <span style={{fontSize:"0.8rem",fontWeight:sec===n.id?800:500,color:sec===n.id?"#fff":"rgba(255,255,255,.65)",letterSpacing:"0.1px"}}>{n.l}</span>
                </button>
              ))}
            </div>
          ))}
        </div>
        {/* Footer sidebar */}
        <div style={{padding:"12px 16px",borderTop:"1px solid rgba(255,255,255,.08)"}}>
          <div style={{fontSize:"0.7rem",color:"rgba(255,255,255,.4)",marginBottom:8}}>{user?.email}</div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setWaO(true)} style={{flex:1,background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.2)",color:"rgba(255,255,255,.8)",padding:"7px 6px",borderRadius:8,fontSize:"0.72rem",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>📤 WA</button>
            <button onClick={()=>fbAuth.signOut()} style={{flex:1,background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.2)",color:"rgba(255,255,255,.8)",padding:"7px 6px",borderRadius:8,fontSize:"0.72rem",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>🚪 Salir</button>
          </div>
        </div>
      </div>

      {/* MAIN CONTENT */}
      <div style={{marginLeft:220,flex:1,minHeight:"100vh",display:"flex",flexDirection:"column"}}>
        {/* Top bar */}
        <div style={{background:"#fff",borderBottom:"1px solid #e8ecef",padding:"0 28px",height:56,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50,boxShadow:"0 1px 8px rgba(0,0,0,.05)"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:"1.4rem"}}>{si?.i}</span>
            <h1 style={{fontSize:"1.15rem",fontWeight:900,color:C.dk,margin:0}}>{si?.l}</h1>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {syncing&&<span style={{fontSize:"0.75rem",color:C.md,fontWeight:600}}>⟳ Sincronizando...</span>}
            <div style={{background:C.v3,color:C.v,padding:"4px 12px",borderRadius:20,fontSize:"0.72rem",fontWeight:800,border:`1px solid ${C.v}33`}}>{user?.email?.split("@")[0]}</div>
          </div>
        </div>
        {/* Contenido principal */}
        <div style={{padding:"24px 28px 40px",flex:1}}>
          <Contenido/>
        </div>
      </div>
      <ModalWA/>
    </div>
  );

  // ══════════════════════════════════════════════════════════
  // LAYOUT MOBILE (igual que antes)
  // ══════════════════════════════════════════════════════════
  return(
    <div style={{fontFamily:"system-ui,-apple-system,sans-serif",background:C.bg,minHeight:"100vh",maxWidth:480,margin:"0 auto"}}>
      {/* HEADER */}
      <div style={{background:`linear-gradient(135deg,${C.v2},${C.az})`,padding:"0 16px",height:56,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,boxShadow:`0 4px 20px ${C.v}44`}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" style={{flexShrink:0}}>
            <circle cx="17" cy="17" r="17" fill="rgba(255,255,255,0.22)"/>
            <text x="50%" y="57%" dominantBaseline="middle" textAnchor="middle" fontFamily="Georgia,serif" fontSize="15" fontWeight="bold" fontStyle="italic" fill="white" letterSpacing="-0.5">ER</text>
          </svg>
          <div>
            <div style={{fontSize:"1.1rem",fontWeight:900,color:"#fff",letterSpacing:"-0.3px",lineHeight:1}}>Campo Ramihue</div>
            <div style={{fontSize:"0.6rem",color:"rgba(255,255,255,0.7)",letterSpacing:"0.5px",textTransform:"uppercase"}}>Gestión agropecuaria</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {syncing&&<span style={{fontSize:"0.7rem",color:"rgba(255,255,255,.7)"}}>⟳</span>}
          <button onClick={()=>setWaO(true)} style={{background:"rgba(255,255,255,.2)",border:"1.5px solid rgba(255,255,255,.4)",color:"#fff",padding:"5px 10px",borderRadius:30,fontSize:"0.74rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>📤 WA</button>
          <button onClick={()=>fbAuth.signOut()} style={{background:"rgba(255,255,255,.15)",border:"1.5px solid rgba(255,255,255,.3)",color:"#fff",padding:"5px 10px",borderRadius:30,fontSize:"0.74rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit"}} title="Cerrar sesión">🚪</button>
        </div>
      </div>
      {/* TÍTULO */}
      <div style={{padding:"13px 14px 0"}}>
        <h2 style={{fontSize:"1.1rem",fontWeight:900,color:C.dk,marginBottom:11}}>{si?.i} {si?.l}</h2>
      </div>
      {/* CONTENIDO */}
      <div style={{padding:"0 14px 88px"}}>
        <Contenido/>
      </div>
      {/* BOTTOM NAV */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"#fff",borderTop:"1px solid #e8ecef",zIndex:99,boxShadow:"0 -4px 20px rgba(0,0,0,.08)"}}>
        <div style={{display:"flex"}}>
          {NAV_RAPIDO.map(n=>(
            <button key={n.id} onClick={()=>setSec(n.id)} style={{flex:1,padding:"10px 4px 8px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,fontFamily:"inherit",fontSize:"0.68rem",fontWeight:800,color:sec===n.id?C.v:C.lt,textTransform:"uppercase",letterSpacing:"0.2px",transition:"color .15s",borderTop:sec===n.id?`2.5px solid ${C.v}`:"2.5px solid transparent"}}>
              <span style={{fontSize:"1.6rem",lineHeight:1,transform:sec===n.id?"translateY(-2px)":"none",transition:"transform .15s"}}>{n.i}</span>
              {n.l}
            </button>
          ))}
          <button onClick={()=>setMenuO(true)} style={{flex:1,padding:"10px 4px 8px",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,fontFamily:"inherit",fontSize:"0.68rem",fontWeight:800,color:menuO?C.v:C.lt,textTransform:"uppercase",letterSpacing:"0.2px",borderTop:menuO?`2.5px solid ${C.v}`:"2.5px solid transparent"}}>
            <span style={{fontSize:"1.6rem",lineHeight:1,transform:menuO?"translateY(-2px)":"none",transition:"transform .15s"}}>☰</span>
            Más
          </button>
        </div>
      </div>
      {/* MENÚ COMPLETO MOBILE */}
      {menuO&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:200,display:"flex",alignItems:"flex-end",backdropFilter:"blur(3px)"}} onClick={()=>setMenuO(false)}>
          <div style={{background:"#fff",width:"100%",maxWidth:480,margin:"0 auto",borderRadius:"22px 22px 0 0",padding:"20px 16px 32px",boxShadow:"0 -8px 40px rgba(0,0,0,.2)"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="14" fill="url(#mg1)"/><defs><linearGradient id="mg1" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0%" stopColor="#2ecc87"/><stop offset="100%" stopColor="#3d84f5"/></linearGradient></defs><text x="50%" y="57%" dominantBaseline="middle" textAnchor="middle" fontFamily="Georgia,serif" fontSize="12" fontWeight="bold" fontStyle="italic" fill="white">ER</text></svg>
                <div style={{fontSize:"1rem",fontWeight:900,color:C.dk}}>Campo Ramihue</div>
              </div>
              <button onClick={()=>setMenuO(false)} style={{background:"#f0f4f8",border:"none",width:32,height:32,borderRadius:"50%",cursor:"pointer",fontSize:"1rem"}}>✕</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
              {NAVS.map(n=>(
                <button key={n.id} onClick={()=>{setSec(n.id);setMenuO(false);}} style={{background:sec===n.id?C.v3:"#f4f7fa",border:`1.5px solid ${sec===n.id?C.v:"#e8ecef"}`,borderRadius:14,padding:"12px 6px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:5,fontFamily:"inherit",transition:"all .15s"}}>
                  <span style={{fontSize:"1.7rem",lineHeight:1}}>{n.i}</span>
                  <span style={{fontSize:"0.65rem",fontWeight:800,color:sec===n.id?C.v:C.dk2,textAlign:"center",lineHeight:1.2,textTransform:"uppercase",letterSpacing:"0.2px"}}>{n.l}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      )}
      <ModalWA/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
