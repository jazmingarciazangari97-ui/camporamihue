    ],
    "🧴 Coadyuvantes":[
      "Aceite mineral","Adherente","Sulfato de amonio","Break-thru","LI-700"
    ],
  };
  const TODOS_PROD=Object.values(PRODUCTOS_CAT).flat();

  // Filtrar lista
  const lista=db.aplicaciones.filter(a=>{
    const mCampo=!filtCampo||a.campoId==filtCampo;
    const mTipo=!filtTipo||a.tipo===filtTipo;
    return mCampo&&mTipo;
  });

  // Agregar/quitar producto en formulario
  const addProd=()=>sf("productos",[...(Array.isArray(f.productos)?f.productos:[]),{nombre:"Glifosato",dosis:"",und:"L/ha"}]);
  const updProd=(i,k,v)=>{const ps=[...(Array.isArray(f.productos)?f.productos:[])];ps[i]={...ps[i],[k]:v};sf("productos",ps);};
  const delProd=(i)=>sf("productos",(Array.isArray(f.productos)?f.productos:[]).filter((_,j)=>j!==i));

  const guardarAplic=()=>{
    const lotesSelec=f.lotesMulti&&f.lotesMulti.length>0?f.lotesMulti:["Sin lote"];
    const ha=parseFloat(f.ha)||0;
    // Generar texto resumen de productos
    const prodTexto=(Array.isArray(f.productos)?f.productos:[]).filter(p=>p.nombre).map(p=>`${p.nombre}${p.dosis?` ${p.dosis}${p.und||"L/ha"}`:""}`).join(" + ");
    if(f.id){
      const nd=addMov({...db,aplicaciones:db.aplicaciones.map(x=>x.id===f.id?{...f,lote:lotesSelec[0],lotes:lotesSelec,productos:f.productos,prodTexto}:x)},`✏️ Aplicación editada: ${f.tipo}`);
      setDb(nd);
    }else{
      const nuevas=lotesSelec.map((lote,idx)=>({id:Date.now()+idx,...f,lote,lotes:lotesSelec,productos:f.productos,prodTexto,ha:ha||f.ha}));
      const nd=addMov({...db,aplicaciones:[...db.aplicaciones,...nuevas]},
        `🌿 ${f.tipo}: ${lotesSelec.length} lote${lotesSelec.length>1?"s":""} — ${prodTexto}`);
      setDb(nd);
    }
    setMA(false);setF({productos:[]});
  };

  return(
    <div>
      <Tabs items={[{id:"lista",label:"🌿 Aplicaciones"},{id:"filtros",label:"🔍 Filtrar"}]} active={tab} onChange={setTab}/>

      {tab==="lista"&&<div>
        <div style={{display:"flex",gap:7,marginBottom:12}}>
          <Btn v="teal" onClick={()=>{setF({fecha:hoy(),campoId:(db.campos[0]&&db.campos[0].id),tipo:"Barbecho",productos:[]});setMA(true);}}>+ Registrar aplicación</Btn>
        </div>

        {!lista.length
          ?<div style={{textAlign:"center",padding:30,color:C.lt}}><div style={{fontSize:"2.5rem"}}>🌿</div><p>Sin aplicaciones registradas</p></div>
          :lista.slice().reverse().map(a=>{
            const prods=Array.isArray(a.productos)&&a.productos.length>0?a.productos:null;
            return(
              <Panel key={a.id} accent={C.ce}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:900,fontSize:"0.95rem"}}>🌿 {a.tipo||"—"}</div>
                    <div style={{fontSize:"0.74rem",color:C.md,marginTop:2}}>
                      📅 {a.fecha} · 🌾 {camNom(db,a.campoId)}
                      {a.campania?` · Camp. ${a.campania}`:""}
                    </div>
                    <div style={{fontSize:"0.74rem",color:C.md,marginTop:1}}>
                      📍 {(a.lotes&&a.lotes.length>1)?a.lotes.join(", "):(a.lote||"—")}
                      {a.ha?` · ${a.ha} ha`:""}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:5}}>
                    <Btn sz="xs" v="ghost" onClick={()=>{setF({...a,productos:Array.isArray(a.productos)?a.productos:[]});setMA(true);}}>✏️</Btn>
                    <Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,aplicaciones:db.aplicaciones.filter(x=>x.id!==a.id)});}}>🗑️</Btn>
                  </div>
                </div>
                {a.cultivo&&<div style={{marginBottom:6}}><Bdg label={a.cultivo} col="green"/></div>}
                {/* Productos estructurados */}
                {prods?<div style={{background:C.ce3,borderRadius:10,padding:"8px 10px",marginBottom:4}}>
                  {prods.filter(p=>p.nombre).map((p,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:"0.78rem",marginBottom:2}}>
                      <span style={{fontWeight:700,color:C.dk}}>{p.nombre}</span>
                      <span style={{color:C.ce,fontWeight:800}}>{p.dosis&&`${p.dosis} ${p.und||"L/ha"}`}</span>
                    </div>
                  ))}
                </div>:a.prodTexto&&<div style={{background:C.ce3,borderRadius:9,padding:"7px 10px",fontSize:"0.8rem",marginBottom:4}}><span style={{fontWeight:700}}>Productos: </span>{a.prodTexto}</div>}
                <div style={{display:"flex",gap:12,flexWrap:"wrap",fontSize:"0.74rem",color:C.md}}>
                  {a.quien&&<span><b>Aplicó:</b> {a.quien}</span>}
                  {a.obs&&<span><b>Obs:</b> {a.obs}</span>}
                </div>
              </Panel>
            );
          })}
      </div>}

      {tab==="filtros"&&<div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
          <Inp label="Campo" value={filtCampo} onChange={v=>setFiltCampo(v)} opts={[{v:"",l:"Todos"},...db.campos.map(c=>({v:c.id,l:c.nombre}))]}/>
          <Inp label="Tipo" value={filtTipo} onChange={v=>setFiltTipo(v)} opts={[{v:"",l:"Todos"},...TIPOS_APLIC]}/>
        </div>
        {lista.slice().reverse().map(a=>(
          <div key={a.id} style={{background:"#fff",borderRadius:12,padding:"10px 13px",marginBottom:7,boxShadow:"0 1px 6px rgba(0,0,0,.05)",borderLeft:`3px solid ${C.ce}`}}>
            <div style={{fontWeight:800,fontSize:"0.88rem"}}>{a.tipo} — {(a.lotes&&a.lotes.length>1)?a.lotes.join(", "):(a.lote||"—")}</div>
            <div style={{fontSize:"0.72rem",color:C.md,marginTop:2}}>{a.fecha} · {camNom(db,a.campoId)}{a.ha?` · ${a.ha}ha`:""}</div>
            {(a.prodTexto||(a.productos&&a.productos.length>0))&&<div style={{fontSize:"0.74rem",color:C.ce,marginTop:3,fontWeight:600}}>{a.prodTexto||(a.productos||[]).map(p=>p.nombre).join(", ")}</div>}
          </div>
        ))}
      </div>}

      {/* MODAL REGISTRO */}
      <Modal open={mA} onClose={()=>{setMA(false);setF({productos:[]});}} title={f.id?"✏️ Editar Aplicación":"🌿 Registrar Aplicación"}>
        <FR>
          <Inp label="Fecha" type="date" value={f.fecha||hoy()} onChange={v=>sf("fecha",v)}/>
          <Inp label="Tipo" value={f.tipo||"Barbecho"} onChange={v=>sf("tipo",v)} opts={TIPOS_APLIC}/>
        </FR>
        <FR>
          <Inp label="Campo" value={f.campoId||""} onChange={v=>{sf("campoId",v);sf("lotesMulti",[]);}} opts={db.campos.map(c=>({v:c.id,l:c.nombre}))}/>
          <Inp label="Cultivo" value={f.cultivo||""} onChange={v=>sf("cultivo",v)} opts={[{v:"",l:"-- Seleccionar --"},...CERALES]}/>
        </FR>
        {f.campoId&&<div style={{background:"#eefaf5",border:"1.5px solid #b8f0d833",borderRadius:13,padding:13,marginBottom:10}}>
          <SelectorLotes db={db} campoId={f.campoId} lotesSeleccionados={f.lotesMulti||[]} onChange={v=>sf("lotesMulti",v)}/>
        </div>}
        <FR>
          <Inp label="Ha tratadas" type="number" value={f.ha||""} onChange={v=>sf("ha",v)} placeholder="Ej: 150"/>
          <Inp label="Quién aplicó" value={f.quien||""} onChange={v=>sf("quien",v)}/>
        </FR>
        <FR><Inp label="Campaña" value={f.campania||CAMPANIAS[3]} onChange={v=>sf("campania",v)} opts={CAMPANIAS}/></FR>

        {/* PRODUCTOS ESTRUCTURADOS */}
        <div style={{background:C.ce3,border:`1.5px solid ${C.ce}33`,borderRadius:13,padding:13,marginBottom:10}}>
          <div style={{fontSize:"0.72rem",fontWeight:800,color:C.ce,textTransform:"uppercase",marginBottom:10}}>🧪 Productos aplicados</div>
          {(Array.isArray(f.productos)?f.productos:[]).map((p,i)=>(
            <div key={i} style={{marginBottom:9}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 80px 70px auto",gap:6,alignItems:"end"}}>
                {/* Selector de producto */}
                <div>
                  {i===0&&<label style={{fontSize:"0.65rem",fontWeight:800,color:C.md,textTransform:"uppercase",display:"block",marginBottom:4}}>Producto</label>}
                  <select value={p.nombre||""} onChange={e=>updProd(i,"nombre",e.target.value)}
                    style={{width:"100%",padding:"8px 10px",border:"1.5px solid #e2e8f0",borderRadius:9,fontFamily:"inherit",fontSize:"0.82rem",outline:"none",background:"#fff"}}>
                    {Object.entries(PRODUCTOS_CAT).map(([cat,prods])=>(
                      <optgroup key={cat} label={cat}>
                        {prods.map(pr=><option key={pr} value={pr}>{pr}</option>)}
                      </optgroup>
                    ))}
                    <optgroup label="✏️ Otro">
                      <option value="__otro">Otro producto...</option>
                    </optgroup>
                  </select>
                  {p.nombre==="__otro"&&<input value={p.nombreCustom||""} onChange={e=>updProd(i,"nombreCustom",e.target.value)} placeholder="Nombre del producto" style={{width:"100%",marginTop:4,padding:"7px 10px",border:"1.5px solid #e2e8f0",borderRadius:9,fontFamily:"inherit",fontSize:"0.82rem",outline:"none"}}/>}
                </div>
                <div>
                  {i===0&&<label style={{fontSize:"0.65rem",fontWeight:800,color:C.md,textTransform:"uppercase",display:"block",marginBottom:4}}>Dosis</label>}
                  <input type="number" value={p.dosis||""} onChange={e=>updProd(i,"dosis",e.target.value)} placeholder="0" style={{width:"100%",padding:"8px 8px",border:"1.5px solid #e2e8f0",borderRadius:9,fontFamily:"inherit",fontSize:"0.85rem",textAlign:"right",outline:"none"}}/>
                </div>
                <div>
                  {i===0&&<label style={{fontSize:"0.65rem",fontWeight:800,color:C.md,textTransform:"uppercase",display:"block",marginBottom:4}}>Und.</label>}
                  <select value={p.und||"L/ha"} onChange={e=>updProd(i,"und",e.target.value)}
                    style={{width:"100%",padding:"8px 6px",border:"1.5px solid #e2e8f0",borderRadius:9,fontFamily:"inherit",fontSize:"0.8rem",outline:"none",background:"#fff"}}>
                    <option>L/ha</option>
                    <option>Kg/ha</option>
                    <option>cc/ha</option>
                    <option>g/ha</option>
                    <option>L</option>
                    <option>Kg</option>
                  </select>
                </div>
                <button onClick={()=>delProd(i)} style={{background:C.ro3,border:"none",borderRadius:8,padding:"8px",cursor:"pointer",color:C.ro,fontWeight:900,marginTop:i===0?18:0}}>✕</button>
              </div>
            </div>
          ))}
          <Btn v="teal" sz="sm" onClick={addProd}>+ Agregar producto</Btn>
          {(Array.isArray(f.productos)?f.productos:[]).length>0&&f.ha&&<div style={{marginTop:8,fontSize:"0.76rem",color:C.ce,fontWeight:700}}>
            Total estimado: {(f.productos||[]).filter(p=>p.dosis&&p.und&&p.und.includes("/ha")).map(p=>`${Math.round(parseFloat(p.dosis||0)*parseFloat(f.ha||0)*10)/10} ${(p.und||"L/ha").replace("/ha","")} de ${p.nombre==="__otro"?p.nombreCustom:p.nombre}`).join(" · ")}
          </div>}
        </div>

        <Inp label="Observaciones" value={f.obs||""} onChange={v=>sf("obs",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>{setMA(false);setF({productos:[]});}} sv="teal" onSave={guardarAplic}/>
      </Modal>
    </div>
  );
}


// ── SIEMBRA ───────────────────────────────────────────────
function SecSiembra({db,setDb}){
  const [mS,setMS]=useState(false);
  const [busqueda,setBusqueda]=useState("");
  const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));

  const lotesDelCampo=f.campoId?db.lotes.filter(l=>l.campoId==f.campoId):[];

  // Filtrar siembras
  const bq=busqueda.toLowerCase().trim();
  const lista=db.siembras||[];
  const listaFilt=bq?lista.filter(s=>{
    const cf=db.campos.find(x=>x.id==s.campoId);
    return (cf&&cf.nombre&&cf.nombre.toLowerCase().includes(bq))||s.lote.toLowerCase().includes(bq)||s.cereal.toLowerCase().includes(bq)||s.variedad.toLowerCase().includes(bq);
  }):lista;

  return(
    <div>
      <div style={{display:"flex",gap:7,marginBottom:12}}>
        <Btn onClick={()=>{setF({fecha:hoy(),campoId:(db.campos[0]&&db.campos[0].id),cereal:"Soja"});setMS(true);}}>+ Registrar siembra</Btn>
      </div>

      {/* BUSCADOR */}
      <div style={{position:"relative",marginBottom:12}}>
        <input type="text" value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="🔍 Buscar por campo, lote, cultivo o variedad..." style={{width:"100%",padding:"11px 14px 11px 38px",border:"1.5px solid #e2e8f0",borderRadius:13,fontFamily:"inherit",fontSize:"0.9rem",color:C.dk,background:"#fff",outline:"none"}}/>
        <span style={{position:"absolute",left:13,top:"50%",transform:"translateY(-50%)",fontSize:"1rem",pointerEvents:"none"}}>🔍</span>
        {busqueda&&<button onClick={()=>setBusqueda("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:"1rem",color:C.md}}>✕</button>}
      </div>
      {busqueda&&<div style={{fontSize:"0.78rem",color:C.v,fontWeight:700,marginBottom:8}}>{listaFilt.length} resultado{listaFilt.length!==1?"s":""} para "{busqueda}"</div>}

      {/* LISTADO */}
      {!listaFilt.length
        ?<div style={{textAlign:"center",padding:30,color:C.lt}}><div style={{fontSize:"2.5rem"}}>🌱</div><p style={{marginTop:8}}>{busqueda?"Sin resultados":"Sin siembras registradas"}</p></div>
        :listaFilt.slice().reverse().map(s=>{
          const cf=db.campos.find(x=>x.id==s.campoId);
          return(
            <Panel key={s.id} accent={C.v}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                <div>
                  <div style={{fontWeight:900,fontSize:"0.98rem"}}>🌱 {s.cereal} {s.variedad?`— ${s.variedad}`:""}</div>
                  <div style={{fontSize:"0.74rem",color:C.md,marginTop:2}}>🌾 {cf?cf.nombre:"—"} · Lote <b>{s.lote||"—"}</b> · 📅 {s.fecha}{s.campania?` · Camp. ${s.campania}`:""}</div>
                </div>
                <div style={{display:"flex",gap:5}}>
                  <Btn sz="xs" v="ghost" onClick={()=>{setF({...s});setMS(true);}}>✏️</Btn>
                  <Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,siembras:(db.siembras||[]).filter(x=>x.id!==s.id)});}}>🗑️</Btn>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:8}}>
                {s.semillaKg&&<div style={{background:C.v3,borderRadius:10,padding:"8px 10px",textAlign:"center"}}><div style={{fontSize:"0.64rem",color:C.md,fontWeight:700,textTransform:"uppercase"}}>Semilla</div><div style={{fontSize:"1rem",fontWeight:900,color:C.v}}>{s.semillaKg} kg/ha</div></div>}
                {s.fertTipo&&<div style={{background:C.az3,borderRadius:10,padding:"8px 10px",textAlign:"center"}}><div style={{fontSize:"0.64rem",color:C.md,fontWeight:700,textTransform:"uppercase"}}>Fertilizante</div><div style={{fontSize:"0.9rem",fontWeight:900,color:C.az}}>{s.fertTipo}</div>{s.fertKg&&<div style={{fontSize:"0.7rem",color:C.md}}>{s.fertKg} kg/ha</div>}</div>}
                {s.ureaKg&&<div style={{background:C.na3,borderRadius:10,padding:"8px 10px",textAlign:"center"}}><div style={{fontSize:"0.64rem",color:C.md,fontWeight:700,textTransform:"uppercase"}}>Urea</div><div style={{fontSize:"1rem",fontWeight:900,color:C.na}}>{s.ureaKg} kg/ha</div></div>}
                {s.ha&&<div style={{background:C.bg,borderRadius:10,padding:"8px 10px",textAlign:"center"}}><div style={{fontSize:"0.64rem",color:C.md,fontWeight:700,textTransform:"uppercase"}}>Hectáreas</div><div style={{fontSize:"1rem",fontWeight:900,color:C.dk}}>{s.ha} ha</div></div>}
              </div>
              {s.nota&&<div style={{fontSize:"0.74rem",color:C.md,marginTop:8}}>📝 {s.nota}</div>}
            </Panel>
          );
        })}

      {/* MODAL */}
      <Modal open={mS} onClose={()=>{setMS(false);setF({});}} title={f.id?"✏️ Editar Siembra":"🌱 Registrar Siembra"}>
        {/* CAMPO Y LOTE */}
        <div style={{background:C.v3,border:"1.5px solid #b8f0d8",borderRadius:13,padding:13,marginBottom:10}}>
          <div style={{fontSize:"0.72rem",fontWeight:800,color:C.v,textTransform:"uppercase",marginBottom:9}}>📍 Ubicación</div>
          <FR>
            <Inp label="Campo" value={f.campoId||""} onChange={v=>{sf("campoId",v);sf("lote","");}} opts={db.campos.map(c=>({v:c.id,l:c.nombre}))}/>
            <Inp label="Lote" value={f.lote||""} onChange={v=>sf("lote",v)}
              opts={f.campoId
                ?[{v:"",l:"-- Seleccionar lote --"},...[...new Set(db.lotes.filter(l=>l.campoId==f.campoId).map(l=>l.nom))].map(n=>({v:n,l:n})),{v:"__otro",l:"Otro..."}]
                :[{v:"",l:"-- Elegí campo primero --"}]}/>
          </FR>
          {f.lote==="__otro"&&<Inp label="Nombre del lote" value={f.loteManual||""} onChange={v=>sf("loteManual",v)} sx={{marginBottom:4}}/>}
          <FR>
            <Inp label="Fecha de siembra" type="date" value={f.fecha||hoy()} onChange={v=>sf("fecha",v)}/>
            <Inp label="Hectáreas sembradas" type="number" value={f.ha||""} onChange={v=>sf("ha",v)} placeholder="Ej: 48"/>
          </FR>
        </div>

        {/* CULTIVO */}
        <div style={{background:C.az3,border:"1.5px solid #b8d5f8",borderRadius:13,padding:13,marginBottom:10}}>
          <div style={{fontSize:"0.72rem",fontWeight:800,color:C.az,textTransform:"uppercase",marginBottom:9}}>🌱 Cultivo</div>
          <FR>
            <Inp label="Cereal" value={f.cereal||"Soja"} onChange={v=>sf("cereal",v)} opts={CERALES}/>
            <Inp label="Variedad / Híbrido" value={f.variedad||""} onChange={v=>sf("variedad",v)} placeholder="Ej: DM 4670 STS"/>
          </FR>
          <FR>
            <Inp label="Semilla (kg/ha)" type="number" value={f.semillaKg||""} onChange={v=>sf("semillaKg",v)} placeholder="Ej: 65"/>
          </FR>
        </div>

        {/* FERTILIZACIÓN */}
        <div style={{background:C.na3,border:"1.5px solid #f8d8b0",borderRadius:13,padding:13,marginBottom:10}}>
          <div style={{fontSize:"0.72rem",fontWeight:800,color:C.na,textTransform:"uppercase",marginBottom:9}}>🧪 Fertilización</div>
          <FR>
            <Inp label="Fertilizante tipo" value={f.fertTipo||""} onChange={v=>sf("fertTipo",v)} opts={[{v:"",l:"-- Sin fertilizante --"},"MAP","Superfosfato triple","Fosfato diamónico","Nitrato de amonio","Otro"]}/>
            <Inp label="Fertilizante (kg/ha)" type="number" value={f.fertKg||""} onChange={v=>sf("fertKg",v)} placeholder="Ej: 100"/>
          </FR>
          <Inp label="Urea (kg/ha)" type="number" value={f.ureaKg||""} onChange={v=>sf("ureaKg",v)} placeholder="Ej: 80"/>
        </div>

        <FR><Inp label="Campaña" value={f.campania||CAMPANIAS[3]} onChange={v=>sf("campania",v)} opts={CAMPANIAS}/></FR>
        <Inp label="Nota" value={f.nota||""} onChange={v=>sf("nota",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>{setMS(false);setF({});}} onSave={()=>{
          const loteReal=f.lote==="__otro"?(f.loteManual||""):f.lote;
          if(!loteReal&&!f.lote)return alert("Seleccioná o ingresá un lote");
          const nd=f.id
            ?addMov({...db,siembras:(db.siembras||[]).map(x=>x.id===f.id?{...f,lote:loteReal}:x)},`✏️ Siembra editada: ${f.cereal} lote ${loteReal}`)
            :addMov({...db,siembras:[...(db.siembras||[]),{id:Date.now(),...f,lote:loteReal}]},`🌱 Siembra: ${f.cereal} ${f.variedad||""} en ${f.lote||""} – ${camNom(db,f.campoId)}`);
          setDb(nd);setMS(false);setF({});
        }}/>
      </Modal>
    </div>
  );
}

// ── LABORES ───────────────────────────────────────────────

    "Alambrado","Tranquera","Aguada/Bebedero","Picada cortafuego","Desmonte","Topografía",
    // Mantenimiento
    "Mecánico","Soldadura","Electricidad","Plomería","Pintura","Construcción",
    // Transporte
    "Flete","Transporte interno","Acarreo",
    // Personal
    "Jornada peón","Fumigador","Tractorista","Cosechador",
    "Otro"
  ];

  const bq=busqueda.toLowerCase().trim();
  const laboresAll=db.labores||[];
  const trabajosAll=db.trabajos||[];

  const listaLab=laboresAll.filter(l=>{
    if(!bq)return true;
    return (l.tipo||"").toLowerCase().includes(bq)||(camNom(db,l.campoId)||"").toLowerCase().includes(bq)||(l.lote||"").toLowerCase().includes(bq)||(l.maquina||"").toLowerCase().includes(bq);
  });

  const listaTrab=trabajosAll.filter(t=>{
    if(!bq)return true;
    return (t.tipo||"").toLowerCase().includes(bq)||(camNom(db,t.campoId)||"").toLowerCase().includes(bq)||(t.proveedor||"").toLowerCase().includes(bq);
  });

  const lotesOpts=f.campoId
    ?[{v:"",l:"-- Seleccionar lote --"},...[...new Set(db.lotes.filter(l=>l.campoId==f.campoId).map(l=>l.nom))].map(n=>({v:n,l:n})),{v:"__otro",l:"Otro lote..."}]
    :[{v:"",l:"-- Elegí campo primero --"}];

  const totalLabMes=laboresAll.filter(l=>l.fecha&&l.fecha.startsWith(mesActual())).reduce((s,l)=>s+(parseFloat(l.costo)||0),0);
  const totalPropias=laboresAll.filter(l=>l.propia).reduce((s,l)=>s+(parseFloat(l.costo)||0),0);

  const guardarLabor=()=>{
    const loteReal=f.lote==="__otro"?(f.loteManual||""):f.lote;
    const tipoReal=f.tipo==="Otro"?(f.tipoManual||"Otro"):f.tipo;
    const {neto,iva,total:costo}=calcIVA(f,"costo");
    const ivaData={montoNeto:neto,montoIva:iva,ivaAlicuota:f.ivaAlicuota||"21"};
    const lotesSelec=f.lotesMulti&&f.lotesMulti.length>0?f.lotesMulti:[loteReal].filter(Boolean);

    let nd;
    if(f.id){
      nd=addMov({...db,labores:laboresAll.map(x=>x.id===f.id?{...f,tipo:tipoReal,lote:loteReal,lotes:lotesSelec,costo,...ivaData}:x)},
        `✏️ Labor editada: ${tipoReal}`);
    }else{
      const nuevasLabores=lotesSelec.map((lote,idx)=>({id:Date.now()+idx,...f,tipo:tipoReal,lote,lotes:lotesSelec,costo:costo/lotesSelec.length,...ivaData}));
      const nuevaLabor=nuevasLabores[0];
      nd={...db,labores:[...laboresAll,...nuevasLabores]};

      if(f.propia&&costo>0){
        const ingresoMaq={id:Date.now()+1,fecha:f.fecha||hoy(),tipo:"ingreso_labor",concepto:`Labor: ${tipoReal} — ${camNom(db,f.campoId)}${loteReal?` Lote ${loteReal}`:""}`,monto:costo,area:"maquinaria",maquinaId:f.maquinaId||null,maquinaNom:f.maquina||"",laborId:nuevaLabor.id,campania:f.campania||"",campoId:f.campoId||null,auto:true};
        nd={...nd,ingresosMaq:[...(nd.ingresosMaq||[]),ingresoMaq]};
        if(f.areaGasto){
          const gastoAuto={id:Date.now()+2,fecha:f.fecha||hoy(),concepto:`Labor: ${tipoReal}${f.maquina?` (${f.maquina})`:""}`,cat:"Mano de obra",area:f.areaGasto,monto:costo,...ivaData,campoId:f.campoId||null,campania:f.campania||"",lote:loteReal,laborId:nuevaLabor.id,prov:"Máquina propia",auto:true};
          nd={...nd,gastos:[...(nd.gastos||[]),gastoAuto]};
        }
      }
      if(!f.propia&&f.areaGasto&&costo>0){
        const gastoTercero={id:Date.now()+3,fecha:f.fecha||hoy(),concepto:`Labor: ${tipoReal}${f.maquina?` (${f.maquina})`:""}`,cat:"Mano de obra",area:f.areaGasto,monto:costo,...ivaData,campoId:f.campoId||null,campania:f.campania||"",lote:loteReal,laborId:nuevaLabor.id,prov:f.maquina||"Tercero",auto:true};
        nd={...nd,gastos:[...(nd.gastos||[]),gastoTercero]};
      }
      nd=addMov(nd,`🚜 Labor: ${tipoReal} en ${camNom(db,f.campoId)}${f.propia?" (propia)":""}`);
    }
    setDb(nd);setML(false);setF({});
  };

  return(
    <div>
      <Tabs items={[{id:"labores",label:"🚜 Labores"},{id:"servicios",label:"🔧 Servicios terceros"}]} active={tab} onChange={setTab}/>

      {tab==="labores"&&<div>
        <div style={{display:"flex",gap:7,marginBottom:10}}>
          <Btn v="brown" onClick={()=>{setF({fecha:hoy(),campoId:(db.campos[0]&&db.campos[0].id),tipo:"Disco",propia:true});setML(true);}}>+ Labor</Btn>
        </div>
        {totalPropias>0&&<div style={{background:C.ma3,border:`1.5px solid ${C.ma}33`,borderRadius:12,padding:"10px 14px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:"0.78rem",fontWeight:700,color:C.ma}}>🚜 Labores con máquina propia → ingreso Maquinaria</span>
          <span style={{fontWeight:900,color:C.ma}}>${fmt(totalPropias)}</span>
        </div>}
        <Buscador value={busqueda} onChange={setBusqueda} placeholder="🔍 Buscar labor..."/>
        {!listaLab.length
          ?<div style={{textAlign:"center",padding:30,color:C.lt}}><div style={{fontSize:"2.5rem"}}>🚜</div><p style={{marginTop:8}}>{busqueda?"Sin resultados":"Sin labores registradas"}</p></div>
          :listaLab.slice().reverse().map(l=>(
            <div key={l.id} style={{background:"#fff",borderRadius:13,padding:"12px 14px",marginBottom:8,boxShadow:"0 2px 8px rgba(0,0,0,.05)",borderLeft:`3px solid ${l.propia?C.ma:"#e2e8f0"}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:900,fontSize:"0.92rem"}}>🚜 {l.tipo}</div>
                  <div style={{fontSize:"0.73rem",color:C.md,marginTop:2}}>
                    {l.fecha} · {camNom(db,l.campoId)}{l.lote?` · Lote ${l.lote}`:""}
                    {l.campania?` · ${l.campania}`:""}
                  </div>
                  <div style={{display:"flex",gap:6,marginTop:5,flexWrap:"wrap",alignItems:"center"}}>
                    {l.propia
                      ?<span style={{background:C.ma3,color:C.ma,padding:"2px 8px",borderRadius:20,fontSize:"0.68rem",fontWeight:800}}>🚜 Máq. propia{l.maquina?`: ${l.maquina}`:""}</span>
                      :<span style={{background:C.bg,color:C.md,padding:"2px 8px",borderRadius:20,fontSize:"0.68rem",fontWeight:700}}>👤 Tercero{l.maquina?`: ${l.maquina}`:""}</span>}
                    {l.propia&&l.areaGasto&&(()=>{const a=AREAS_EMPRESA.find(x=>x.id===l.areaGasto);return a?<span style={{background:a.col3,color:a.col,padding:"2px 8px",borderRadius:20,fontSize:"0.68rem",fontWeight:800}}>→ gasto {a.label}</span>:null;})()}
                    {l.ha&&<span style={{fontSize:"0.72rem",color:C.md}}>{l.ha} ha</span>}
                    {l.costo>0&&<span style={{fontSize:"0.82rem",fontWeight:900,color:l.propia?C.ma:C.dk}}>${fmt(l.costo)}</span>}
                  </div>
                  {l.obs&&<div style={{fontSize:"0.74rem",color:C.md,marginTop:4}}>📝 {l.obs}</div>}
                </div>
                <div style={{display:"flex",gap:4,marginLeft:8}}>
                  <Btn sz="xs" v="ghost" onClick={()=>{setF({...l});setML(true);}}>✏️</Btn>
                  <Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,labores:laboresAll.filter(x=>x.id!==l.id),ingresosMaq:(db.ingresosMaq||[]).filter(x=>x.laborId!==l.id),gastos:(db.gastos||[]).filter(x=>x.laborId!==l.id)});}}>🗑️</Btn>
                </div>
              </div>
            </div>
          ))}
      </div>}

      {tab==="servicios"&&<div>
        <div style={{display:"flex",gap:7,marginBottom:10}}>
          <Btn v="teal" onClick={()=>{setF({fecha:hoy(),campoId:(db.campos[0]&&db.campos[0].id)});setML(true);}}>+ Servicio de tercero</Btn>
        </div>
        <Buscador value={busqueda} onChange={setBusqueda} placeholder="🔍 Buscar servicio..."/>
        {!listaTrab.length
          ?<div style={{textAlign:"center",padding:30,color:C.lt}}><div style={{fontSize:"2.5rem"}}>🔧</div><p style={{marginTop:8}}>{busqueda?"Sin resultados":"Sin servicios registrados"}</p></div>
          :listaTrab.slice().reverse().map(t=>(
            <Panel key={t.id} accent={C.ce}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div>
                  <div style={{fontWeight:900,fontSize:"0.92rem"}}>🔧 {t.tipo}</div>
                  <div style={{fontSize:"0.73rem",color:C.md,marginTop:2}}>{t.fecha} · {camNom(db,t.campoId)}{t.lote?` · ${t.lote}`:""}</div>
                  {t.proveedor&&<div style={{fontSize:"0.73rem",color:C.md,marginTop:1}}>👤 {t.proveedor}</div>}
                  {t.monto>0&&<div style={{fontSize:"0.9rem",fontWeight:900,color:C.dk,marginTop:4}}>${fmt(t.monto)}</div>}
                </div>
                <div style={{display:"flex",gap:4}}>
                  <Btn sz="xs" v="ghost" onClick={()=>{setF({...t});setML(true);}}>✏️</Btn>
                  <Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,trabajos:trabajosAll.filter(x=>x.id!==t.id)});}}>🗑️</Btn>
                </div>
              </div>
            </Panel>
          ))}
      </div>}

      {/* MODAL LABOR / SERVICIO */}
      <Modal open={mL} onClose={()=>{setML(false);setF({});}} title={f.id?(tab==="labores"?"✏️ Editar Labor":"✏️ Editar Servicio"):(tab==="labores"?"🚜 Registrar Labor":"🔧 Registrar Servicio")}>
        {tab==="labores"&&<>
          {/* TIPO */}
          <div style={{marginBottom:12}}>
            <label style={{fontSize:"0.7rem",fontWeight:800,color:C.md,textTransform:"uppercase",letterSpacing:"0.4px",display:"block",marginBottom:8}}>Tipo de labor</label>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7}}>
              {TIPOS_LABOR.map(t=>(
                <button key={t} onClick={()=>sf("tipo",t)} style={{padding:"10px 6px",borderRadius:11,border:`2px solid ${f.tipo===t?C.ma:"#e2e8f0"}`,background:f.tipo===t?C.ma3:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:800,color:f.tipo===t?C.ma:C.md,fontSize:"0.75rem",textAlign:"center"}}>
                  {t}
                </button>
              ))}
            </div>
            {f.tipo==="Otro"&&<Inp label="Descripción" value={f.tipoManual||""} onChange={v=>sf("tipoManual",v)} sx={{marginTop:8}}/>}
          </div>
          <FR>
            <Inp label="Fecha" type="date" value={f.fecha||hoy()} onChange={v=>sf("fecha",v)}/>
            <Inp label="Campaña" value={f.campania||CAMPANIAS[3]} onChange={v=>sf("campania",v)} opts={CAMPANIAS}/>
          </FR>
          <FR>
            <Inp label="Campo" value={f.campoId||""} onChange={v=>{sf("campoId",v);sf("lote","");}} opts={db.campos.map(c=>({v:c.id,l:c.nombre}))}/>
            <div style={{background:C.ma3,border:`1.5px solid #d4b89633`,borderRadius:13,padding:13,marginBottom:10}}>
            <SelectorLotes db={db} campoId={f.campoId} lotesSeleccionados={f.lotesMulti||[]} onChange={v=>sf("lotesMulti",v)}/>
          </div>
          </FR>
          {f.lote==="__otro"&&<Inp label="Nombre del lote" value={f.loteManual||""} onChange={v=>sf("loteManual",v)} sx={{marginBottom:9}}/>}
          <FR>
            <Inp label="Hectáreas" type="number" value={f.ha||""} onChange={v=>sf("ha",v)} placeholder="Ej: 48"/>
          </FR>
          <BloqueIVA f={f} sf={sf} campoMonto="costo" label="Costo de la labor"/>

          {/* MÁQUINA PROPIA O TERCERO */}
          <div style={{marginBottom:12}}>
            <label style={{fontSize:"0.7rem",fontWeight:800,color:C.md,textTransform:"uppercase",letterSpacing:"0.4px",display:"block",marginBottom:8}}>¿Con qué se hizo?</label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <button onClick={()=>sf("propia",true)} style={{padding:"13px",borderRadius:12,border:`2px solid ${f.propia?C.ma:"#e2e8f0"}`,background:f.propia?C.ma3:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:800,color:f.propia?C.ma:C.md,fontSize:"0.85rem"}}>
                🚜 Máquina propia
              </button>
              <button onClick={()=>sf("propia",false)} style={{padding:"13px",borderRadius:12,border:`2px solid ${f.propia===false?C.az:"#e2e8f0"}`,background:f.propia===false?C.az3:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:800,color:f.propia===false?C.az:C.md,fontSize:"0.85rem"}}>
                👤 Tercero / Contratista
              </button>
            </div>
          </div>
          {f.propia&&<>
            <InfoBox text="Este costo se registrará como ingreso de Maquinaria y como gasto del área que indiques abajo." color="brown" emoji="🚜"/>
          <div style={{marginBottom:10}}>
            <label style={{fontSize:"0.7rem",fontWeight:800,color:C.md,textTransform:"uppercase",letterSpacing:"0.4px",display:"block",marginBottom:8}}>¿A qué área se carga el gasto? <span style={{color:C.ro}}>*</span></label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
              {AREAS_EMPRESA.filter(a=>a.id!=="maquinaria").map(a=>(
                <button key={a.id} onClick={()=>sf("areaGasto",a.id)} style={{padding:"9px 6px",borderRadius:11,border:`2px solid ${f.areaGasto===a.id?a.col:"#e2e8f0"}`,background:f.areaGasto===a.id?a.col3:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:800,color:f.areaGasto===a.id?a.col:C.md,fontSize:"0.75rem",textAlign:"center"}}>
                  {a.label}
                </button>
              ))}
            </div>
          </div>
            <div style={{background:C.ma3,border:`1.5px solid #d4b896`,borderRadius:13,padding:13,marginBottom:10}}>
              <Inp label="Máquina propia utilizada" value={f.maquinaId||""} onChange={v=>{sf("maquinaId",v);const mq=db.maquinas.find(m=>m.id==v);if(mq)sf("maquina",mq.nom);}} opts={[{v:"",l:"-- Seleccionar --"},...db.maquinas.map(m=>({v:m.id,l:m.nom}))]} sx={{marginBottom:0}}/>
            </div>
          </>}
          {f.propia===false&&<>
            <Inp label="Contratista / Empresa" value={f.maquina||""} onChange={v=>sf("maquina",v)} sx={{marginBottom:10}}/>
            <div style={{marginBottom:10}}>
              <label style={{fontSize:"0.7rem",fontWeight:800,color:C.md,textTransform:"uppercase",letterSpacing:"0.4px",display:"block",marginBottom:8}}>¿A qué área se carga este gasto? <span style={{color:C.ro}}>*</span></label>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
                {AREAS_EMPRESA.map(a=>(
                  <button key={a.id} onClick={()=>sf("areaGasto",a.id)} style={{padding:"9px 6px",borderRadius:11,border:`2px solid ${f.areaGasto===a.id?a.col:"#e2e8f0"}`,background:f.areaGasto===a.id?a.col3:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:800,color:f.areaGasto===a.id?a.col:C.md,fontSize:"0.75rem",textAlign:"center"}}>
                    {a.label}
                  </button>
                ))}
              </div>
            </div>
            <InfoBox text="Este gasto se registrará automáticamente en el área elegida." color="blue" emoji="📋"/>
          </>}
          <Inp label="Observaciones" value={f.obs||""} onChange={v=>sf("obs",v)} sx={{marginBottom:4}}/>
          <MBtns onClose={()=>{setML(false);setF({});}} sv="brown" onSave={guardarLabor}/>
        </>}

        {tab==="servicios"&&<>
          <FR>
            <Inp label="Fecha" type="date" value={f.fecha||hoy()} onChange={v=>sf("fecha",v)}/>
            <Inp label="Tipo de servicio" value={f.tipo||""} onChange={v=>sf("tipo",v)} opts={["Fumigación","Cosecha","Siembra","Flete","Mantenimiento","Veterinario","Asesoramiento","Otro"]}/>
          </FR>
          <FR>
            <Inp label="Campo" value={f.campoId||""} onChange={v=>sf("campoId",v)} opts={db.campos.map(c=>({v:c.id,l:c.nombre}))}/>
            <Inp label="Lote" value={f.lote||""} onChange={v=>sf("lote",v)} opts={lotesOpts}/>
          </FR>
          <FR>
            <Inp label="Proveedor / Empresa" value={f.proveedor||""} onChange={v=>sf("proveedor",v)}/>
            <Inp label="Monto ($)" type="number" value={f.monto||""} onChange={v=>sf("monto",v)}/>
          </FR>
          <Inp label="Descripción / Notas" value={f.obs||""} onChange={v=>sf("obs",v)} sx={{marginBottom:4}}/>
          <MBtns onClose={()=>{setML(false);setF({});}} sv="teal" onSave={()=>{
            const nd=f.id
              ?addMov({...db,trabajos:trabajosAll.map(x=>x.id===f.id?{...f,monto:parseFloat(f.monto)||0}:x)},`✏️ Servicio editado: ${f.tipo}`)
              :addMov({...db,trabajos:[...trabajosAll,{id:Date.now(),...f,monto:parseFloat(f.monto)||0}]},`🔧 Servicio: ${f.tipo} — ${camNom(db,f.campoId)}`);
            setDb(nd);setML(false);setF({});
          }}/>
        </>}
      </Modal>
    </div>
  );
}

// ── LLUVIAS ───────────────────────────────────────────────
function SecLluvias({db,setDb}){
  const [mL,setML]=useState(false);const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));
  const mmMes=db.lluvias.filter(l=>l.fecha.startsWith(mesActual())).reduce((s,l)=>s+parseFloat(l.mm||0),0);
  const mmAnio=db.lluvias.filter(l=>l.fecha.startsWith(new Date().getFullYear().toString())).reduce((s,l)=>s+parseFloat(l.mm||0),0);
  const porCampo={};
  db.lluvias.forEach(l=>{const n=camNom(db,l.campoId);if(!porCampo[n])porCampo[n]=0;porCampo[n]+=parseFloat(l.mm||0);});
  return(
    <div>
      <div style={{display:"flex",gap:7,marginBottom:12}}><Btn v="teal" onClick={()=>{setF({fecha:hoy(),tipo:"Lluvia",campoId:(db.campos[0]&&db.campos[0].id)});setML(true);}}>+ Registrar lluvia</Btn></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:10,marginBottom:12}}>
        <GC title="Este mes" val={mmMes.toFixed(0)+" mm"} acc={C.az} emoji="🌧️"/>
        <GC title="Este año" val={mmAnio.toFixed(0)+" mm"} acc={C.ce} emoji="💧"/>
        {Object.entries(porCampo).map(([nom,mm],i)=><GC key={nom} title={nom} val={mm.toFixed(0)+" mm"} sub="total registrado" acc={ACCS[i%7]} emoji="🌾"/>)}
      </div>
      <Tabla heads={["Fecha","Campo","mm","Tipo","Observación"]}
        rows={db.lluvias.slice().reverse().map(l=><tr key={l.id}><Td bold>{l.fecha}</Td><Td>{camNom(db,l.campoId)}</Td><Td bold>{l.mm} mm</Td><Td>{l.tipo||"Lluvia"}</Td><Td>{l.obs||"—"}</Td></tr>)}/>
      <Modal open={mL} onClose={()=>setML(false)} title="🌧️ Registrar Lluvia">
        <FR><Inp label="Fecha" type="date" value={f.fecha||hoy()} onChange={v=>sf("fecha",v)}/><Inp label="Campo" value={f.campoId||""} onChange={v=>sf("campoId",v)} opts={db.campos.map(c=>({v:c.id,l:c.nombre}))}/></FR>
        <FR><Inp label="Milímetros (mm)" type="number" value={f.mm||""} onChange={v=>sf("mm",v)} placeholder="Ej: 25"/><Inp label="Tipo" value={f.tipo||"Lluvia"} onChange={v=>sf("tipo",v)} opts={["Lluvia","Granizo","Llovizna","Tormenta"]}/></FR>
        <Inp label="Observación" value={f.obs||""} onChange={v=>sf("obs",v)} placeholder="Ej: Tormenta de tarde" sx={{marginBottom:4}}/>
        <MBtns onClose={()=>setML(false)} sv="teal" onSave={()=>{const nd=addMov({...db,lluvias:[...db.lluvias,{id:Date.now(),...f}]},`🌧️ Lluvia: ${f.mm}mm en ${camNom(db,f.campoId)}`);setDb(nd);setML(false);setF({});}}/>
      </Modal>
    </div>
  );
}

// ── ANÁLISIS DE SUELO ─────────────────────────────────────
function SecSuelos({db,setDb}){
  const [mS,setMS]=useState(false);const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));
  return(
    <div>
      <div style={{display:"flex",gap:7,marginBottom:12}}><Btn v="teal" onClick={()=>{setF({fecha:hoy(),campoId:(db.campos[0]&&db.campos[0].id),anio:db.years[db.years.length-1]});setMS(true);}}>+ Agregar análisis</Btn></div>
      <Tabla heads={["Fecha","Campo","Lote","pH","M.O.%","Fósforo","Nitrógeno","Campaña","Lab"]}

// ── PESADAS ───────────────────────────────────────────────
function SecPesadas({db,setDb}){
  const [mP,setMP]=useState(false);const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));
  const gdpCards=[];
  const gdpData={};
  db.pesadas.forEach(p=>{
    const key=`${p.campoId}||${p.categoria}`;
    if(!gdpData[key])gdpData[key]=[];
    gdpData[key].push({fecha:p.fecha,peso:parseFloat(p.peso)||0});
  });
  Object.entries(gdpData).forEach(([key,arr])=>{
    if(arr.length>=2){
      arr.sort((a,b)=>a.fecha.localeCompare(b.fecha));
      const prim=arr[0];const ult=arr[arr.length-1];
      const dias=Math.round((new Date(ult.fecha)-new Date(prim.fecha))/(1000*60*60*24));
      const gdp=dias>0?((ult.peso-prim.peso)/dias).toFixed(2):0;
      const [cId,cat]=key.split("||");
      gdpCards.push({cId,cat,gdp,inicio:prim.peso,fin:ult.peso,desde:prim.fecha,hasta:ult.fecha});
    }
  });
  return(
    <div>
      <div style={{display:"flex",gap:7,marginBottom:12}}><Btn v="brown" onClick={()=>{setF({fecha:hoy(),campoId:(db.campos[0]&&db.campos[0].id)});setMP(true);}}>+ Registrar pesada</Btn></div>
      {gdpCards.length>0&&<>
        <div style={{fontSize:"0.75rem",fontWeight:800,color:C.md,textTransform:"uppercase",marginBottom:8}}>📈 Ganancia diaria de peso (GDP)</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(155px,1fr))",gap:10,marginBottom:14}}>
          {gdpCards.map((g,i)=><GC key={i} title={`${camNom(db,g.cId)} – ${g.cat}`} val={`${g.gdp} kg/día`} sub={`${g.inicio}→${g.fin}kg`} acc={parseFloat(g.gdp)>0.8?C.v:parseFloat(g.gdp)>0.5?C.am:C.ro} emoji="⚖️"/>)}
        </div>
      </>}
      <Tabla heads={["Fecha","Campo","Categoría","Cant.","Peso prom.(kg)","Cond.corporal","Nota"]}
        rows={db.pesadas.slice().reverse().map(p=><tr key={p.id}><Td>{p.fecha}</Td><Td>{camNom(db,p.campoId)}</Td><Td bold>{p.categoria||"—"}</Td><Td>{p.cantidad||"—"}</Td><Td bold>{p.peso||"—"}</Td><Td>{p.cc||"—"}</Td><Td>{p.nota||"—"}</Td></tr>)}/>
      <Modal open={mP} onClose={()=>setMP(false)} title="⚖️ Registrar Pesada">
        <FR><Inp label="Fecha" type="date" value={f.fecha||hoy()} onChange={v=>sf("fecha",v)}/><Inp label="Campo" value={f.campoId||""} onChange={v=>sf("campoId",v)} opts={db.campos.map(c=>({v:c.id,l:c.nombre}))}/></FR>
        <FR><Inp label="Categoría" value={f.categoria||""} onChange={v=>sf("categoria",v)} placeholder="Ej: Novillos"/><Inp label="Cantidad animales" type="number" value={f.cantidad||""} onChange={v=>sf("cantidad",v)}/></FR>
        <FR><Inp label="Peso promedio (kg)" type="number" value={f.peso||""} onChange={v=>sf("peso",v)}/><Inp label="Condición corporal (1-9)" type="number" value={f.cc||""} onChange={v=>sf("cc",v)}/></FR>
        <Inp label="Nota" value={f.nota||""} onChange={v=>sf("nota",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>setMP(false)} sv="brown" onSave={()=>{const nd=addMov({...db,pesadas:[...db.pesadas,{id:Date.now(),...f}]},`⚖️ Pesada: ${f.categoria||""} ${f.peso||"?"}kg`);setDb(nd);setMP(false);setF({});}}/>
      </Modal>
    </div>
  );
}

// ── CAMIONES (sección propia mejorada) ────────────────────
function SecCamionesDetalle({db,setDb}){
  const [tab,setTab]=useState("lista");
  const [mC,setMC]=useState(false);
  const [mChofer,setMChofer]=useState(false);
  const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));
  const [filtChofer,setFiltChofer]=useState("");
  const [filtCereal,setFiltCereal]=useState("");
  const [filtAnio,setFiltAnio]=useState("");

  // Choferes predeterminados + los que el usuario agrega
  const choferesPred=(db.choferesPred||[]).length>0
    ?db.choferesPred
    :[{id:"s1",nombre:"Sebastián"},{id:"s2",nombre:"Matías"}];

  const camiones=db.cosechaCamiones||[];

  // Filtrar
  const listaFilt=camiones.filter(c=>{
    const mC=!filtChofer||c.chofer===filtChofer;
    const mCer=!filtCereal||c.cereal===filtCereal;
    const mA=!filtAnio||(c.fecha||"").startsWith(filtAnio);
    return mC&&mCer&&mA;
  });

  // Stats
  const totalKg=listaFilt.reduce((s,c)=>s+(parseFloat(c.kg)||0),0);
  const porChofer={};
  camiones.forEach(c=>{
    const ch=c.chofer||"Sin chofer";
    if(!porChofer[ch])porChofer[ch]={kg:0,viajes:0};
    porChofer[ch].kg+=parseFloat(c.kg)||0;
    porChofer[ch].viajes++;
  });
  const porCereal={};
  camiones.forEach(c=>{
    if(!c.cereal)return;
    if(!porCereal[c.cereal])porCereal[c.cereal]={kg:0,viajes:0};
    porCereal[c.cereal].kg+=parseFloat(c.kg)||0;
    porCereal[c.cereal].viajes++;
  });

  const aniosDisp=[...new Set(camiones.map(c=>(c.fecha||"").slice(0,4)).filter(Boolean))].sort().reverse();
  const cerealesDisp=[...new Set(camiones.map(c=>c.cereal).filter(Boolean))];

  return(
    <div>
      <Tabs items={[{id:"lista",label:"🚛 Viajes"},{id:"choferes",label:"👤 Choferes"},{id:"resumen",label:"📊 Resumen"}]} active={tab} onChange={setTab}/>

      {tab==="lista"&&<div>
        {/* Filtros */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7,marginBottom:10}}>
          <select value={filtChofer} onChange={e=>setFiltChofer(e.target.value)} style={{padding:"8px 10px",border:"1.5px solid #e2e8f0",borderRadius:10,fontFamily:"inherit",fontSize:"0.82rem",outline:"none"}}>
            <option value="">Todos los choferes</option>
            {Object.keys(porChofer).map(ch=><option key={ch} value={ch}>{ch}</option>)}
          </select>
          <select value={filtCereal} onChange={e=>setFiltCereal(e.target.value)} style={{padding:"8px 10px",border:"1.5px solid #e2e8f0",borderRadius:10,fontFamily:"inherit",fontSize:"0.82rem",outline:"none"}}>
            <option value="">Todos los cereales</option>
            {cerealesDisp.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <select value={filtAnio} onChange={e=>setFiltAnio(e.target.value)} style={{padding:"8px 10px",border:"1.5px solid #e2e8f0",borderRadius:10,fontFamily:"inherit",fontSize:"0.82rem",outline:"none"}}>
            <option value="">Todos los años</option>
            {aniosDisp.map(a=><option key={a} value={a}>{a}</option>)}
          </select>
        </div>
        {(filtChofer||filtCereal||filtAnio)&&<div style={{background:C.az3,borderRadius:10,padding:"7px 12px",marginBottom:8,fontSize:"0.78rem",color:C.az,fontWeight:700}}>
          {listaFilt.length} viajes · {fmt(totalKg)} kg filtrados
        </div>}
        <Btn onClick={()=>{setF({fecha:hoy(),dest:"Acopio",modalidad:"Blanco"});setMC(true);}}>+ Registrar viaje</Btn>
        <div style={{marginTop:10}}>
          {!listaFilt.length&&<div style={{textAlign:"center",padding:30,color:C.lt}}><div style={{fontSize:"2rem"}}>🚛</div><p style={{marginTop:8}}>Sin viajes{filtChofer||filtCereal||filtAnio?" con estos filtros":""}</p></div>}
          {listaFilt.slice().reverse().map(c=>{
            const cos=db.cosechas.find(x=>x.id==c.cosechaId);
            return(
              <div key={c.id} style={{background:"#fff",borderRadius:13,padding:"12px 14px",marginBottom:8,boxShadow:"0 2px 8px rgba(0,0,0,.05)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                  <div>
                    <div style={{fontWeight:900,fontSize:"0.92rem"}}>🚛 {c.camionNom||"—"} · {fmt(c.kg)} kg</div>
                    <div style={{fontSize:"0.74rem",color:C.md,marginTop:2}}>{c.fecha} · {c.cereal||cos?.cereal||"—"} · {c.dest||"—"}</div>
                    {c.chofer&&<div style={{fontSize:"0.74rem",color:C.md}}>👤 {c.chofer}</div>}
                    {c.carta&&<div style={{fontSize:"0.72rem",color:C.lt}}>📋 CP: {c.carta}</div>}
                    {c.patente&&<div style={{fontSize:"0.72rem",color:C.lt}}>🚛 Pat: {c.patente}</div>}
                    {c.empresa&&<div style={{fontSize:"0.72rem",color:C.lt}}>🏢 {c.empresa}</div>}
                  </div>
                  <div style={{display:"flex",gap:4,alignItems:"center"}}>
                    {c.modalidad&&<Bdg label={c.modalidad==="Negro"?"🤝 Negro":"✅ Blanco"} col={c.modalidad==="Negro"?"gray":"green"}/>}
                    <Btn sz="xs" v="ghost" onClick={()=>{setF({...c});setMC(true);}}>✏️</Btn>
                    <Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,cosechaCamiones:db.cosechaCamiones.filter(x=>x.id!==c.id)});}}>🗑️</Btn>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>}

      {tab==="choferes"&&<div>
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <Btn v="teal" onClick={()=>{setF({nombre:""});setMChofer(true);}}>+ Agregar chofer</Btn>
        </div>
        {/* Choferes predeterminados */}
        {choferesPred.map(ch=>{
          const stats=porChofer[ch.nombre]||{kg:0,viajes:0};
          return(
            <Panel key={ch.id} accent={C.az}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontWeight:900,fontSize:"0.95rem"}}>👤 {ch.nombre}</div>
                  <div style={{fontSize:"0.74rem",color:C.md,marginTop:2}}>{stats.viajes} viaje{stats.viajes!==1?"s":""} · {fmt(stats.kg)} kg transportados</div>
                </div>
                <div style={{display:"flex",gap:5}}>
                  <Btn sz="xs" v="ghost" onClick={()=>{setF({...ch});setMChofer(true);}}>✏️</Btn>
                  {!["s1","s2"].includes(ch.id)&&<Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar chofer?"))setDb({...db,choferesPred:(db.choferesPred||[]).filter(x=>x.id!==ch.id)});}}>🗑️</Btn>}
                </div>
              </div>
            </Panel>
          );
        })}
        {/* Choferes que aparecen en viajes pero no están en la lista */}
        {Object.keys(porChofer).filter(ch=>!choferesPred.some(p=>p.nombre===ch)&&ch!=="Sin chofer").map(ch=>(
          <div key={ch} style={{background:C.bg,borderRadius:12,padding:"11px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontWeight:700,fontSize:"0.88rem"}}>👤 {ch} <span style={{fontSize:"0.7rem",color:C.lt,fontWeight:400}}>(externo)</span></div>
              <div style={{fontSize:"0.72rem",color:C.md}}>{porChofer[ch].viajes} viaje{porChofer[ch].viajes!==1?"s":""} · {fmt(porChofer[ch].kg)} kg</div>
            </div>
          </div>
        ))}
      </div>}

      {tab==="resumen"&&<div>
        {/* Por chofer */}
        {Object.keys(porChofer).length>0&&<Panel title="👤 Por chofer" accent={C.az}>
          {Object.entries(porChofer).sort((a,b)=>b[1].kg-a[1].kg).map(([ch,d])=>(
            <div key={ch} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #f0f4f8"}}>
              <div>
                <div style={{fontWeight:700,fontSize:"0.88rem"}}>{ch}</div>
                <div style={{fontSize:"0.72rem",color:C.md}}>{d.viajes} viaje{d.viajes!==1?"s":""}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontWeight:900,color:C.az,fontSize:"0.95rem"}}>{fmt(d.kg)} kg</div>

              </div>
            </div>
          ))}
        </Panel>}
        {/* Por cereal */}
        {Object.keys(porCereal).length>0&&<Panel title="🌾 Por cereal" accent={C.v}>
          {Object.entries(porCereal).sort((a,b)=>b[1].kg-a[1].kg).map(([cer,d])=>(
            <div key={cer} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #f0f4f8"}}>
              <div style={{fontWeight:700,fontSize:"0.88rem"}}>{cer}</div>
              <div style={{textAlign:"right"}}>
                <div style={{fontWeight:900,color:C.v,fontSize:"0.95rem"}}>{fmt(d.kg)} kg</div>
                <div style={{fontSize:"0.68rem",color:C.lt}}>{d.viajes} viaje{d.viajes!==1?"s":""}</div>
              </div>
            </div>
          ))}
        </Panel>}
        {/* Gráfico mensual */}
        {(()=>{
          const mesesMap={};
          camiones.forEach(c=>{
            const key=(c.fecha||"").slice(0,7);
            if(!key)return;
            if(!mesesMap[key])mesesMap[key]={label:key.slice(0,7),kg:0};
            mesesMap[key].kg+=parseFloat(c.kg)||0;
          });
          const data=Object.entries(mesesMap).sort((a,b)=>a[0].localeCompare(b[0])).map(([,v])=>v).filter(v=>v.kg>0);
          if(data.length<2)return null;
          return(<Panel title="📅 Kg transportados por mes" accent={C.na}>
            <BarChart data={data} labelKey="label" valueKey="kg" colorFn={()=>C.na}/>
          </Panel>);

        <FR>
          <Inp label="Cereal" value={f.cereal||"Soja"} onChange={v=>sf("cereal",v)} opts={CERALES}/>

          </div>
        </div>
        <MBtns onClose={()=>{setMC(false);setF({});}} sv="orange" saveLabel={f.id?"Guardar cambios":"Registrar viaje"} onSave={()=>{
          const kg=parseFloat(f.kg)||0;
          const choferFinal=f.chofer==="__otro"?"":f.chofer;
          const nd=f.id
            ?addMov({...db,cosechaCamiones:db.cosechaCamiones.map(x=>x.id===f.id?{...f,kg,chofer:choferFinal}:x)},`✏️ Viaje editado: ${fmt(kg)}kg`)
            :addMov({...db,cosechaCamiones:[...db.cosechaCamiones,{id:Date.now(),...f,kg,chofer:choferFinal}]},`🚛 ${fmt(kg)}kg ${f.cereal||""} – ${f.camionNom||"camión"} (${choferFinal||"sin chofer"})`);
          setDb(nd);setMC(false);setF({});
        }}/>
      </Modal>

      {/* MODAL CHOFER */}
      <Modal open={mChofer} onClose={()=>{setMChofer(false);setF({});}} title={f.id?"✏️ Editar chofer":"👤 Agregar chofer"}>
        <Inp label="Nombre del chofer" value={f.nombre||""} onChange={v=>sf("nombre",v)} placeholder="Ej: Juan Pérez" sx={{marginBottom:4}}/>
        <MBtns onClose={()=>{setMChofer(false);setF({});}} sv="teal" saveLabel={f.id?"Guardar":"Agregar"} onSave={()=>{
          if(!f.nombre)return alert("Ingresá el nombre");
          const nuevos=f.id
            ?(db.choferesPred||[]).map(c=>c.id===f.id?{...c,nombre:f.nombre}:c)
            :[...choferesPred,{id:"c"+Date.now(),nombre:f.nombre}];
          setDb({...db,choferesPred:nuevos});
          setMChofer(false);setF({});
        }}/>
      </Modal>
    </div>
  );
}

// ── VENTAS ────────────────────────────────────────────────
function SecVentas({db,setDb}){
  const [tab,setTab]=useState("todas");

  const [verV,setVerV]=useState(null);
  const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));

  const ESTADOS_VENTA=[
    {id:"A_precio",    label:"A precio",     desc:"Precio fijado, pendiente entrega",             col:"blue"},
    {id:"A_fijar",     label:"A fijar",      desc:"Entregado sin precio fijado todavía",          col:"orange"},
    {id:"entregado",   label:"Entregado",    desc:"Entregado y cobrado",                          col:"green"},
    {id:"forward",     label:"Forward",      desc:"Venta a término — precio y fecha futura pactados",col:"purple"},
    {id:"consignacion",label:"Consignación", desc:"En consignación en el acopio",                 col:"teal"},
    {id:"canje",       label:"Canje",        desc:"Canje por insumos u otro bien",                col:"brown"},
    {id:"cancelado",   label:"Cancelado",    desc:"Operación cancelada",                          col:"red"},
  ];
  const getEst=(id)=>ESTADOS_VENTA.find(e=>e.id===id)||{label:id||"Pendiente",col:"gray",desc:""};

  // Totales por cereal con blanco/negro
  const totCereal={};
  db.ventas.forEach(v=>{
    if(!totCereal[v.cereal])totCereal[v.cereal]={cobrado:0,porCobrar:0,aFijar:0,t:0,tBlanco:0,tNegro:0,mBlanco:0,mNegro:0};
    const t=parseFloat(v.toneladas)||0;
    const m=parseFloat(v.precio||0)*t;
    totCereal[v.cereal].t+=t;
    if(v.modalidad==="Negro"){totCereal[v.cereal].tNegro+=t;totCereal[v.cereal].mNegro+=m;}
    else{totCereal[v.cereal].tBlanco+=t;totCereal[v.cereal].mBlanco+=m;}
    if(v.estado==="entregado")totCereal[v.cereal].cobrado+=m;
    else if(v.estado==="A_fijar")totCereal[v.cereal].aFijar+=t;
    else totCereal[v.cereal].porCobrar+=m;
  });

  // Global blanco/negro
  const gBlanco={t:0,m:0};const gNegro={t:0,m:0};
  db.ventas.forEach(v=>{
    const t=parseFloat(v.toneladas)||0;
    const m=parseFloat(v.precio||0)*t;
    if(v.modalidad==="Negro"){gNegro.t+=t;gNegro.m+=m;}
    else{gBlanco.t+=t;gBlanco.m+=m;}
  });

  const ventasFilt=tab==="todas"?db.ventas
    :tab==="blanco"?db.ventas.filter(v=>v.modalidad!=="Negro")
    :tab==="negro"?db.ventas.filter(v=>v.modalidad==="Negro")
    :db.ventas.filter(v=>v.estado===tab);

  return(
    <div>
      {/* RESUMEN POR CEREAL */}
      {Object.entries(totCereal).length>0&&<div style={{marginBottom:12}}>
        {Object.entries(totCereal).map(([cer,d],i)=>(
          <div key={cer} style={{background:`linear-gradient(135deg,${ACCS[i%7]},${ACCS[i%7]}bb)`,borderRadius:14,padding:13,marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{fontWeight:900,fontSize:"0.95rem",color:"#fff"}}>🌾 {cer}</span>
              <span style={{color:"rgba(255,255,255,.85)",fontSize:"0.85rem",fontWeight:700}}>{fmt(d.t)} t</span>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7,marginBottom:7}}>
              {[{l:"Cobrado",v:"$"+fmtC(Math.round(d.cobrado))},{l:"Por cobrar",v:"$"+fmtC(Math.round(d.porCobrar))},{l:"A fijar",v:fmt(d.aFijar)+" t"}].map(item=>(
                <div key={item.l} style={{background:"rgba(255,255,255,.15)",borderRadius:9,padding:"6px",textAlign:"center"}}>
                  <div style={{fontSize:"0.58rem",color:"rgba(255,255,255,.7)",fontWeight:700,textTransform:"uppercase",marginBottom:2}}>{item.l}</div>
                  <div style={{fontSize:"0.82rem",fontWeight:900,color:"#fff"}}>{item.v}</div>
                </div>
              ))}
            </div>
            {/* Blanco vs Negro */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
              <div style={{background:"rgba(255,255,255,.2)",borderRadius:9,padding:"6px",textAlign:"center"}}>
                <div style={{fontSize:"0.58rem",color:"rgba(255,255,255,.8)",fontWeight:700,marginBottom:2}}>✅ En blanco</div>
                <div style={{fontSize:"0.82rem",fontWeight:900,color:"#fff"}}>{fmt(d.tBlanco)} t</div>
                {d.mBlanco>0&&<div style={{fontSize:"0.65rem",color:"rgba(255,255,255,.7)"}}>${fmtC(Math.round(d.mBlanco))}</div>}
              </div>
              <div style={{background:"rgba(0,0,0,.2)",borderRadius:9,padding:"6px",textAlign:"center"}}>

                <div style={{fontSize:"0.82rem",fontWeight:900,color:"#fff"}}>{fmt(d.tNegro)} t</div>
                {d.mNegro>0&&<div style={{fontSize:"0.65rem",color:"rgba(255,255,255,.7)"}}>${fmtC(Math.round(d.mNegro))}</div>}
              </div>
            </div>
          </div>

      </div>}

      {/* RESUMEN GLOBAL BLANCO/NEGRO */}

        </div>
        <div style={{background:"#1a2332",borderRadius:13,padding:13,boxShadow:"0 2px 8px rgba(0,0,0,.1)"}}>
          <div style={{fontSize:"0.7rem",fontWeight:800,color:"rgba(255,255,255,.6)",textTransform:"uppercase",marginBottom:6}}>🤝 Total en negro</div>
          <div style={{fontSize:"1.1rem",fontWeight:900,color:"#fff"}}>{fmt(gNegro.t)} t</div>
          {gNegro.m>0&&<div style={{fontSize:"0.82rem",fontWeight:700,color:"rgba(255,255,255,.7)"}}>${fmtC(Math.round(gNegro.m))}</div>}
        </div>
      </div>}

      {/* TABS */}
      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:12}}>
        {[{id:"todas",l:"📋 Todas"},{id:"blanco",l:"✅ Blanco"},{id:"negro",l:"🤝 Negro"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"7px 12px",borderRadius:30,border:`1.5px solid ${tab===t.id?C.dk:"#e2e8f0"}`,background:tab===t.id?C.dk:"#fff",color:tab===t.id?"#fff":C.md,fontSize:"0.74rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>
            {t.l} ({t.id==="todas"?db.ventas.length:t.id==="blanco"?db.ventas.filter(v=>v.modalidad!=="Negro").length:db.ventas.filter(v=>v.modalidad==="Negro").length})
          </button>
        ))}
        {ESTADOS_VENTA.filter(e=>db.ventas.some(v=>v.estado===e.id)).map(e=>(
          <button key={e.id} onClick={()=>setTab(e.id)} style={{padding:"7px 12px",borderRadius:30,border:`1.5px solid ${tab===e.id?C.az:"#e2e8f0"}`,background:tab===e.id?C.az3:"#fff",color:tab===e.id?C.az:C.md,fontSize:"0.74rem",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            {e.label} ({db.ventas.filter(v=>v.estado===e.id).length})
          </button>
        ))}
      </div>

      <Btn onClick={()=>{setF({fecha:hoy(),cereal:"Soja",estado:"A_precio",modalidad:"Blanco",campania:CAMPANIAS[3]});setMV(true);}}>+ Nueva operación</Btn>

      {/* LISTA */}
      <div style={{marginTop:12}}>
        {!ventasFilt.length&&<div style={{textAlign:"center",padding:30,color:C.lt}}><div style={{fontSize:"2rem"}}>📋</div><p style={{marginTop:8}}>Sin operaciones</p></div>}
        {ventasFilt.slice().reverse().map(v=>{
          const est=getEst(v.estado);
          const monto=parseFloat(v.precio||0)*parseFloat(v.toneladas||0);
          return(
            <div key={v.id} onClick={()=>setVerV(v)} style={{background:"#fff",borderRadius:14,padding:"13px 15px",marginBottom:9,boxShadow:"0 2px 10px rgba(0,0,0,.06)",cursor:"pointer",borderLeft:`4px solid ${v.modalidad==="Negro"?C.dk:C.az}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                <div>
                  <div style={{fontWeight:900,fontSize:"0.95rem",color:C.dk}}>🌾 {v.cereal} — {v.toneladas} t</div>
                  <div style={{fontSize:"0.74rem",color:C.md,marginTop:2}}>{v.fecha}{v.fechaEntrega?` · Entrega: ${v.fechaEntrega}`:""}{v.corredor?` · ${v.corredor}`:""}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  {parseFloat(v.precio)>0&&<div style={{fontSize:"1rem",fontWeight:900,color:C.dk}}>${fmtC(Math.round(monto))}</div>}
                  <div style={{display:"flex",gap:4,justifyContent:"flex-end",marginTop:3}}>
                    <Bdg label={est.label} col={est.col}/>
                    <Bdg label={v.modalidad==="Negro"?"🤝 Negro":"✅ Blanco"} col={v.modalidad==="Negro"?"gray":"green"}/>
                  </div>
                </div>
              </div>
              <div style={{display:"flex",gap:4,justifyContent:"flex-end",marginTop:6}}>
                <Btn sz="xs" v="ghost" onClick={e=>{e.stopPropagation();setF({...v});setMV(true);}}>✏️</Btn>
                <Btn sz="xs" v="danger" onClick={e=>{e.stopPropagation();if(confirm("¿Eliminar?"))setDb({...db,ventas:db.ventas.filter(x=>x.id!==v.id)});}}>🗑️</Btn>
              </div>
            </div>
          );
        })}
      </div>

      {/* MODAL DETALLE */}
      <Modal open={!!verV} onClose={()=>setVerV(null)} title="📋 Detalle operación">
        {verV&&(()=>{
          const est=getEst(verV.estado);
          const monto=parseFloat(verV.precio||0)*parseFloat(verV.toneladas||0);
          return(<div>
            <div style={{background:verV.modalidad==="Negro"?`linear-gradient(135deg,#1a2332,#2a3a4a)`:`linear-gradient(135deg,${C.dk},${C.dk2})`,borderRadius:16,padding:16,marginBottom:14,textAlign:"center"}}>
              <div style={{fontSize:"0.72rem",fontWeight:800,color:"rgba(255,255,255,.6)",textTransform:"uppercase",marginBottom:4}}>🌾 {verV.cereal} · {verV.modalidad==="Negro"?"🤝 En negro":"✅ En blanco"}</div>
              {parseFloat(verV.precio)>0&&<div style={{fontSize:"1.8rem",fontWeight:900,color:"#fff"}}>${fmt(Math.round(monto))}</div>}
              <div style={{fontSize:"0.85rem",color:"rgba(255,255,255,.7)",marginTop:3}}>{verV.toneladas} t{parseFloat(verV.precio)>0?` · $${fmt(verV.precio)}/t`:""}</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9,marginBottom:12}}>
              {[
                {l:"📋 Estado",v:<Bdg label={est.label} col={est.col}/>},
                {l:"📅 Fecha",v:verV.fecha},
                {l:"🚚 Entrega",v:verV.fechaEntrega||"—"},
                {l:"🌾 Campo",v:camNom(db,verV.campoId)||"—"},
                {l:"📅 Campaña",v:verV.campania||"—"},
                {l:"🏢 Corredor",v:verV.corredor||"—"},
                {l:"📄 Contrato",v:verV.contrato||"—"},
                {l:"💼 Modalidad",v:verV.modalidad||"—"},
              ].map(item=>(
                <div key={item.l} style={{background:C.bg,borderRadius:10,padding:"8px 11px"}}>
                  <div style={{fontSize:"0.65rem",fontWeight:800,color:C.md,textTransform:"uppercase",marginBottom:3}}>{item.l}</div>
                  <div style={{fontSize:"0.88rem",fontWeight:700,color:C.dk}}>{item.v}</div>
                </div>
              ))}
            </div>
            {verV.obs&&<div style={{background:C.bg,borderRadius:10,padding:"10px 12px",marginBottom:10}}>
              <div style={{fontSize:"0.65rem",fontWeight:800,color:C.md,textTransform:"uppercase",marginBottom:3}}>📝 Obs.</div>
              <div style={{fontSize:"0.85rem",color:C.dk}}>{verV.obs}</div>
            </div>}
            <InfoBox text={est.desc} color="blue" emoji="ℹ️"/>
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <Btn v="ghost" sx={{flex:1,justifyContent:"center"}} onClick={()=>setVerV(null)}>Cerrar</Btn>
              <Btn v="orange" sx={{flex:1,justifyContent:"center"}} onClick={()=>{setF({...verV});setVerV(null);setMV(true);}}>✏️ Editar</Btn>
            </div>
          </div>);

      </Modal>

      {/* MODAL NUEVA OPERACIÓN */}
      <Modal open={mV} onClose={()=>{setMV(false);setF({});}} title={f.id?"✏️ Editar operación":"📋 Nueva operación de venta"}>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:"0.7rem",fontWeight:800,color:C.md,textTransform:"uppercase",letterSpacing:"0.4px",display:"block",marginBottom:8}}>Tipo de operación</label>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
            {ESTADOS_VENTA.filter(e=>e.id!=="cancelado").map(e=>(
              <button key={e.id} onClick={()=>sf("estado",e.id)} style={{padding:"10px 8px",borderRadius:11,border:`2px solid ${f.estado===e.id?C.az:"#e2e8f0"}`,background:f.estado===e.id?C.az3:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:800,color:f.estado===e.id?C.az:C.md,fontSize:"0.78rem",textAlign:"left"}}>
                <div>{e.label}</div>
                <div style={{fontSize:"0.65rem",fontWeight:400,color:f.estado===e.id?C.az:C.lt,marginTop:2,lineHeight:1.3}}>{e.desc}</div>
              </button>
            ))}
          </div>
        </div>
        {/* Modalidad blanco/negro */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
          <button onClick={()=>sf("modalidad","Blanco")} style={{padding:"12px",borderRadius:12,border:`2px solid ${f.modalidad!=="Negro"?C.v:"#e2e8f0"}`,background:f.modalidad!=="Negro"?C.v3:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:800,color:f.modalidad!=="Negro"?C.v:C.md,fontSize:"0.88rem"}}>✅ En blanco</button>
          <button onClick={()=>sf("modalidad","Negro")} style={{padding:"12px",borderRadius:12,border:`2px solid ${f.modalidad==="Negro"?"#1a2332":"#e2e8f0"}`,background:f.modalidad==="Negro"?"#1a2332":"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:800,color:f.modalidad==="Negro"?"#fff":C.md,fontSize:"0.88rem"}}>🤝 En negro</button>
        </div>

          <Inp label="Cereal" value={f.cereal||"Soja"} onChange={v=>sf("cereal",v)} opts={CERALES}/>
        </FR>
        <FR>
          <Inp label="Toneladas" type="number" value={f.toneladas||""} onChange={v=>sf("toneladas",v)} placeholder="Ej: 100"/>
          <Inp label="Precio ($/t)" type="number" value={f.precio||""} onChange={v=>sf("precio",v)} placeholder="Ej: 210000"/>
        </FR>
        <FR>
          <Inp label="Campo" value={f.campoId||""} onChange={v=>sf("campoId",v)} opts={[{v:"",l:"-- Seleccionar --"},...db.campos.map(c=>({v:c.id,l:c.nombre}))]}/>
          <Inp label="Campaña" value={f.campania||CAMPANIAS[3]} onChange={v=>sf("campania",v)} opts={CAMPANIAS}/>
        </FR>
        <FR>
          <Inp label="Corredor / Acopio" value={f.corredor||""} onChange={v=>sf("corredor",v)}/>
          <Inp label="Fecha de entrega" type="date" value={f.fechaEntrega||""} onChange={v=>sf("fechaEntrega",v)}/>
        </FR>
        <FR>
          <Inp label="Nº Contrato" value={f.contrato||""} onChange={v=>sf("contrato",v)}/>
        </FR>
        <Inp label="Observaciones" value={f.obs||""} onChange={v=>sf("obs",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>{setMV(false);setF({});}} sv="blue" onSave={()=>{
          if(!f.estado)return alert("Seleccioná el tipo de operación");
          if(!f.toneladas)return alert("Ingresá las toneladas");
          const tons=parseFloat(f.toneladas)||0;
          const precio=parseFloat(f.precio||0);
          const totalVenta=Math.round(tons*1000*precio/1000); // tons * precio/t
          const ventaId=f.id||Date.now();
          let nd;
          if(f.id){
            // Editar: si cambió a entregado y antes no lo era, agregar a caja
            const ventaAnterior=db.ventas.find(v=>v.id===f.id);
            nd=addMov({...db,ventas:db.ventas.map(x=>x.id===f.id?{...f}:x)},`✏️ Venta editada: ${f.cereal}`);
            if(f.estado==="entregado"&&ventaAnterior?.estado!=="entregado"&&totalVenta>0){
              nd=addCaja(nd,{tipo:"entrada",monto:totalVenta,concepto:`Venta ${f.cereal} ${tons}t`,categoria:"Cobro venta granos",area:"agropecuaria",fecha:f.fecha,origenTipo:"venta_grano",origenId:f.id,contraparte:f.corredor||f.acopio||""});
            }
          }else{
            const nuevaVenta={id:ventaId,...f,toneladas:tons,precio};
            nd=addMov({...db,ventas:[...db.ventas,nuevaVenta]},
              `📋 ${f.estado}: ${tons}t ${f.cereal}${precio?` $${fmt(precio)}/t`:""} (${f.modalidad||"Blanco"})`);
            if(f.estado==="entregado"&&totalVenta>0){
              nd=addCaja(nd,{tipo:"entrada",monto:totalVenta,concepto:`Venta ${f.cereal} ${tons}t`,categoria:"Cobro venta granos",area:"agropecuaria",fecha:f.fecha,origenTipo:"venta_grano",origenId:ventaId,contraparte:f.corredor||f.acopio||""});
            }
          }
          setDb(nd);setMV(false);setF({});
        }}/>
      </Modal>
    </div>
  );
}

// ── COMBUSTIBLE ───────────────────────────────────────────
function SecCombustible({db,setDb}){
  const [mC,setMC]=useState(false);const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));
  const tot={};db.combustible.forEach(c=>{tot[c.tipo]=(tot[c.tipo]||0)+c.litros});

  // Opciones de destino: tanques del campo + camionetas/autos de maquinas
  const vehiculos=db.maquinas.filter(m=>["Camioneta","Auto","Pick-up","4x4"].includes(m.tipo)||m.esCamioneta);
  const TANQUES_CAMPO=[{v:"Blanco",l:"⚪ Tanque Blanco"},{v:"Amarillo",l:"🟡 Tanque Amarillo"},{v:"Rojo",l:"🔴 Tanque Rojo"}];

  return(
    <div>
      <div style={{display:"flex",gap:7,marginBottom:12}}><Btn onClick={()=>{setF({tipo:"Gasoil",fecha:hoy(),campoId:(db.campos[0]&&db.campos[0].id),destTipo:"tanque"});setMC(true);}}>+ Carga</Btn></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:10,marginBottom:12}}>
        {Object.entries(tot).map(([t,l],i)=><GC key={t} title={t} val={fmt(l)+" L"} sub="litros total" acc={ACCS[i%7]} emoji="⛽"/>)}
      </div>
      {(()=>{
        const porTanque={};
        db.combustible.forEach(c=>{
          const dest=c.destNom||c.tanque||c.maq||"—";
          if(dest&&dest!=="—"){if(!porTanque[dest])porTanque[dest]=0;porTanque[dest]+=c.litros||0;}
        });
        if(!Object.keys(porTanque).length)return null;
        return<Panel title="⛽ Consumo por destino" accent={C.na}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:8}}>
            {Object.entries(porTanque).sort((a,b)=>b[1]-a[1]).map(([dest,litros])=>(

            <button onClick={()=>sf("destTipo","vehiculo")} style={{padding:"11px",borderRadius:11,border:`2px solid ${f.destTipo==="vehiculo"?C.az:"#e2e8f0"}`,background:f.destTipo==="vehiculo"?C.az3:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:800,color:f.destTipo==="vehiculo"?C.az:C.md,fontSize:"0.82rem"}}>🚗 Vehículo / Camioneta</button>
          </div>
          {(f.destTipo||"tanque")==="tanque"&&(

          )}
          {(f.destTipo==="vehiculo"&&(f.maqId==="otra"||vehiculos.length===0))&&<Inp label="Nombre del vehículo" value={f.destNom||""} onChange={v=>{sf("destNom",v);sf("maq",v);}} sx={{marginTop:8,marginBottom:0}}/>}
        </div>

        <FR><Inp label="Litros" type="number" value={f.litros||""} onChange={v=>sf("litros",v)}/></FR>
        <BloqueIVA f={f} sf={sf} campoMonto="precio" label="Precio por litro"/>
        <Inp label="Campo" value={f.campoId||""} onChange={v=>sf("campoId",v)} opts={db.campos.map(c=>({v:c.id,l:c.nombre}))} sx={{marginBottom:8}}/>
        <MBtns onClose={()=>setMC(false)} onSave={()=>{
          const li=parseFloat(f.litros)||0;
          const {neto,iva,total:precioTotal}=calcIVA(f,"precio");
          const destNom=f.destNom||(f.tanque?`Tanque ${f.tanque}`:f.maq||"—");
          const combId=Date.now();
          let nd=addMov({...db,combustible:[...db.combustible,{id:combId,...f,litros:li,precio:precioTotal,precioNeto:neto,precioIva:iva,ivaAlicuota:f.ivaAlicuota||"21",total:Math.round(li*precioTotal),totalNeto:Math.round(li*neto),totalIva:Math.round(li*iva),destNom}]},`⛽ ${li}L ${f.tipo} → ${destNom}`);
          nd=addCaja(nd,{tipo:"salida",monto:Math.round(li*precioTotal),concepto:`Combustible ${li}L ${f.tipo} → ${destNom}`,categoria:"Combustible",area:"maquinaria",fecha:f.fecha,origenTipo:"combustible",origenId:combId});
          setDb(nd);setMC(false);setF({});
        }}/>
      </Modal>
    </div>
  );
}

        <FR><Inp label="Prioridad" value={f.prioridad||"Normal"} onChange={v=>sf("prioridad",v)} opts={["Normal","Alta","Urgente","Baja"]}/><Inp label="Estado" value={f.est||"Pendiente"} onChange={v=>sf("est",v)} opts={["Pendiente","En curso","Completada"]}/></FR>
        <Inp label="Detalle / Nota" value={f.nota||""} onChange={v=>sf("nota",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>setMT(false)} onSave={()=>{const nd=f.id?addMov({...db,tareas:db.tareas.map(x=>x.id===f.id?{...f}:x)},`✏️ Tarea editada: ${f.nom}`):addMov({...db,tareas:[...db.tareas,{id:Date.now(),...f}]},`📅 Tarea: ${f.nom}`);setDb(nd);setMT(false);setF({});}}/>
