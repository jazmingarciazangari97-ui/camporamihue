        const consumoProd={};
        aplicsConProd.forEach(a=>{
          const ha=parseFloat(a.ha)||0;
          (Array.isArray(a.productos)?a.productos:[]).forEach(p=>{
            const nom=p.nombre==="__otro"?(p.nombreCustom||"Otro"):p.nombre;
            if(!nom)return;
            if(!consumoProd[nom])consumoProd[nom]={totalAbsoluto:0,und:p.und||"L/ha",aplicaciones:[],cultivos:{}};
            const dosis=parseFloat(p.dosis)||0;
            if(p.und&&p.und.includes("/ha")&&ha>0) consumoProd[nom].totalAbsoluto+=dosis*ha;
            else consumoProd[nom].totalAbsoluto+=dosis;
            consumoProd[nom].aplicaciones.push({campo:camNom(db,a.campoId),ha});
            if(a.cultivo) consumoProd[nom].cultivos[a.cultivo]=(consumoProd[nom].cultivos[a.cultivo]||0)+(ha>0?dosis*ha:dosis);
          });
        });
        const prodOrdenados=Object.entries(consumoProd).sort((a,b)=>b[1].totalAbsoluto-a[1].totalAbsoluto);
        return(
          <div>
            <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:12,flexWrap:"wrap"}}>
              <span style={{fontSize:"0.75rem",fontWeight:800,color:C.md}}>Campaña:</span>
              {CAMPANIAS.map(cp=>(
                <button key={cp} onClick={()=>setCampConsume(cp)} style={{padding:"6px 14px",borderRadius:30,border:`1.5px solid ${cp===campConsume?C.ce:"#e2e8f0"}`,background:cp===campConsume?C.ce:"#fff",color:cp===campConsume?"#fff":C.md,fontSize:"0.76rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>{cp}</button>
              ))}
            </div>
            {prodOrdenados.length===0&&<div style={{textAlign:"center",padding:30,color:C.lt}}>
              <div style={{fontSize:"2.5rem"}}>🧪</div>
              <p style={{marginTop:8,fontWeight:600}}>Sin aplicaciones con productos detallados</p>
              <p style={{fontSize:"0.8rem",marginTop:4}}>Registrá aplicaciones con los productos en la sección Aplicaciones para ver el consumo acá</p>
            </div>}
            {prodOrdenados.length>0&&<>
              <div style={{background:`linear-gradient(135deg,${C.ce},${C.ce}bb)`,borderRadius:16,padding:14,marginBottom:12}}>
                <div style={{fontSize:"0.7rem",fontWeight:800,color:"rgba(255,255,255,.7)",textTransform:"uppercase",marginBottom:4}}>🧪 Consumo campaña {campConsume}</div>
                <div style={{fontSize:"0.85rem",color:"rgba(255,255,255,.85)"}}>{prodOrdenados.length} productos · {aplicsConProd.length} aplicaciones registradas</div>
              </div>
              {prodOrdenados.map(([nom,d])=>(
                <Panel key={nom} accent={C.ce}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
                    <div style={{fontWeight:900,fontSize:"0.95rem"}}>🧪 {nom}</div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:"1.15rem",fontWeight:900,color:C.ce}}>{Math.round(d.totalAbsoluto*10)/10} {(d.und||"L/ha").replace("/ha","")}</div>
                      <div style={{fontSize:"0.65rem",color:C.lt}}>total campaña</div>
                    </div>
                  </div>
                  {Object.keys(d.cultivos).length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:5}}>
                    {Object.entries(d.cultivos).map(([cult,tot])=>(
                      <div key={cult} style={{background:C.ce3,borderRadius:20,padding:"3px 9px",fontSize:"0.72rem",fontWeight:800,color:C.ce}}>
                        {cult}: {Math.round(tot*10)/10} {(d.und||"L/ha").replace("/ha","")}
                      </div>
                    ))}
                  </div>}
                  <div style={{fontSize:"0.7rem",color:C.md}}>{d.aplicaciones.length} aplicación{d.aplicaciones.length!==1?"es":""} · {[...new Set(d.aplicaciones.map(a=>a.campo))].join(", ")}</div>
                </Panel>
              ))}
              <Panel title="📅 Estimación para la próxima campaña" accent={C.az}>
                <InfoBox text="Consumo de esta campaña + 10% de margen de seguridad." color="blue" emoji="💡"/>
                {prodOrdenados.filter(([,d])=>d.totalAbsoluto>0).map(([nom,d])=>(
                  <div key={nom} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid #f0f4f8",fontSize:"0.82rem"}}>
                    <span style={{fontWeight:700,color:C.dk}}>{nom}</span>
                    <span style={{fontWeight:900,color:C.az}}>~{Math.ceil(d.totalAbsoluto*1.1*10)/10} {(d.und||"L/ha").replace("/ha","")}<span style={{fontSize:"0.68rem",color:C.lt,marginLeft:4}}>(+10%)</span></span>
                  </div>
                ))}
              </Panel>
            </>}
          </div>
        );
      })()}
    </div>
  );
}

// ── GASTOS ────────────────────────────────────────────────
function SecGastos({db,setDb}){
  const [tab,setTab]=useState("gastos");
  const [filtro,setFiltro]=useState("todos");
  const [busqGasto,setBusqGasto]=useState("");
  const [mesSel,setMesSel]=useState(null);
  const [catSel,setCatSel]=useState("Todos");
  const [ivaTabMes,setIvaTabMes]=useState(mesActual());
  const [mG,setMG]=useState(false);
  const [mF,setMF]=useState(false); // modal foto
  const [mRemito,setMRemito]=useState(false);
  const [mFactura,setMFactura]=useState(false);
  const [mPago,setMPago]=useState(false);
  const [selFactura,setSelFactura]=useState(null);
  const [filtRemProv,setFiltRemProv]=useState("");
  const [filtRemMes,setFiltRemMes]=useState("");
  const [filtFacProv,setFiltFacProv]=useState("");
  const [filtFacMes,setFiltFacMes]=useState("");
  const [filtFacEst,setFiltFacEst]=useState("");
  const [buscaRem,setBuscaRem]=useState("");
  const [buscaFac,setBuscaFac]=useState("");
  const [gastoVer,setGastoVer]=useState(null);
  const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));

  const MEDIOS_PAGO=[
    {id:"efectivo",    label:"💵 Efectivo"},
    {id:"transferencia",label:"🏦 Transferencia"},
    {id:"debito",      label:"💳 Débito"},
    {id:"credito",     label:"💳 Crédito"},
    {id:"cheque",      label:"📄 Cheque físico"},
    {id:"echeq",       label:"📱 eChecq"},
    {id:"cta_cte",     label:"📋 Cta. Cte. proveedor"},
    {id:"canje",       label:"🌾 Canje por granos"},
  ];

  const cb={"Ferretería":"yellow","Veterinaria":"blue","Repuestos":"orange","Combustible":"green","Mano de obra":"purple","Arrendamiento":"brown","Seguros":"teal"};

  // Remitos y facturas del db
  const remitos=db.remitos||[];
  const facturas=db.facturas||[];

  // Remitos sin factura asociada
  const remPendientes=remitos.filter(r=>!r.facturaId);
  const facPendPago=facturas.filter(f=>f.estado!=="pagada"&&f.estado!=="cancelada");
  const facVencidas=facPendPago.filter(f=>{
    if(!f.vencimiento)return false;
    return new Date(f.vencimiento)<new Date();
  });

  // Saldo por proveedor (facturas pendientes)
  const saldoProv={};
  facPendPago.forEach(fac=>{
    const prov=fac.proveedor||"Sin proveedor";
    if(!saldoProv[prov])saldoProv[prov]={total:0,facturas:[],vencidas:0};
    const pagado=(fac.pagos||[]).reduce((s,p)=>s+(parseFloat(p.monto)||0),0);
    const saldo=(parseFloat(fac.monto)||0)-pagado;
    saldoProv[prov].total+=saldo;
    saldoProv[prov].facturas.push(fac);
    if(new Date(fac.vencimiento)<new Date())saldoProv[prov].vencidas++;
  });

  // Gastos filtrados
  const bq=busqGasto.toLowerCase().trim();
  const matchGasto=(g)=>{
    if(!bq)return true;
    const areaObj=AREAS_EMPRESA.find(a=>a.id===g.area);
    return(
      (g.concepto||"").toLowerCase().includes(bq)||
      (g.prov||"").toLowerCase().includes(bq)||
      (g.cat||"").toLowerCase().includes(bq)||
      (g.items||"").toLowerCase().includes(bq)||
      (g.fact||"").toLowerCase().includes(bq)||
      (g.campania||"").toLowerCase().includes(bq)||
      (camNom(db,g.campoId)||"").toLowerCase().includes(bq)||
      (areaObj?areaObj.label:"").toLowerCase().includes(bq)||
      String(g.monto||"").includes(bq)||
      (g.fecha||"").includes(bq)
    );
  };
  const listaBase=filtro==="todos"?db.gastos
    :filtro==="otros"?db.gastos.filter(g=>!["Ferretería","Veterinaria","Repuestos","Combustible","Mercadería"].includes(g.cat))
    :filtro==="areas"||filtro==="meses"||filtro==="graficos"?db.gastos
    :db.gastos.filter(g=>g.cat===filtro);
  const lista=listaBase.filter(matchGasto);
  const total=lista.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);

  const gastoPorMaquina={};
  db.gastos.filter(g=>g.cat==="Repuestos"&&g.maquinaId).forEach(g=>{
    const mq=db.maquinas.find(m=>m.id==g.maquinaId);
    const nom=mq?mq.nom:(g.maquinaNom||"Sin asignar");
    if(!gastoPorMaquina[nom])gastoPorMaquina[nom]=0;
    gastoPorMaquina[nom]+=parseFloat(g.monto)||0;
  });

  const onDatos=d=>{setF({fecha:d.fecha||hoy(),cat:d.categoria||"Ferretería",concepto:d.concepto||"",prov:d.proveedor||"",monto:d.monto||"",fact:d.factura||"",items:d.items||"",campoId:(db.campos[0]&&db.campos[0].id)||"",_ia:true});setMG(true);};

  const formatMes=(key)=>{if(!key)return"";const[y,m]=key.split("-");const d=new Date(y,parseInt(m)-1,1);return d.toLocaleString("es-AR",{month:"long",year:"numeric"});};

  return(
    <div>
      {/* ALERTAS */}
      {facVencidas.length>0&&<div style={{background:"#fff3cd",border:"1.5px solid #f5c842",borderRadius:12,padding:"10px 14px",marginBottom:10,display:"flex",gap:8,alignItems:"center"}}>
        <span style={{fontSize:"1.2rem"}}>⚠️</span>
        <div>
          <div style={{fontWeight:800,fontSize:"0.82rem",color:"#856404"}}>Facturas vencidas: {facVencidas.length}</div>
          <div style={{fontSize:"0.74rem",color:"#856404"}}>{facVencidas.map(f=>f.proveedor||"—").join(", ")}</div>
        </div>
      </div>}

      {/* TABS PRINCIPALES */}
      <div style={{display:"flex",gap:6,marginBottom:12,borderBottom:"2px solid #f0f4f8",paddingBottom:8}}>
        {[
          {id:"gastos",label:"💰 Gastos",badge:null},
          {id:"remitos",label:"📄 Remitos",badge:remPendientes.length||null},
          {id:"facturas",label:"🧾 Facturas",badge:facPendPago.length||null},
          {id:"proveedores",label:"🏢 Proveedores",badge:Object.keys(saldoProv).length||null},
          {id:"iva",label:"🔢 IVA",badge:null},
        ].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"8px 14px",borderRadius:10,border:"none",background:tab===t.id?C.dk:"transparent",color:tab===t.id?"#fff":C.md,fontSize:"0.78rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit",position:"relative"}}>
            {t.label}
            {t.badge>0&&<span style={{position:"absolute",top:-4,right:-4,background:C.ro,color:"#fff",borderRadius:"50%",width:16,height:16,fontSize:"0.6rem",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900}}>{t.badge}</span>}
          </button>
        ))}
      </div>

      {/* ═══ PESTAÑA GASTOS ═══ */}
      {tab==="gastos"&&<div>
        <Tabs items={[{id:"todos",label:"📋 Todos"},{id:"Ferretería",label:"🔧 Ferr."},{id:"Veterinaria",label:"💉 Vet."},{id:"Repuestos",label:"⚙️ Rep."},{id:"Mercadería",label:"🛒 Merc."},{id:"otros",label:"📌 Otros"},{id:"areas",label:"🏢 Áreas"},{id:"meses",label:"📅 Mes"},{id:"graficos",label:"📈 Gráficos"}]} active={filtro} onChange={setFiltro}/>

        {/* BUSCADOR */}
        {filtro!=="graficos"&&filtro!=="meses"&&<Buscador value={busqGasto} onChange={v=>setBusqGasto(v)} placeholder="🔍 Concepto, proveedor, campo, área, categoría..."/>}
        {filtro!=="graficos"&&filtro!=="meses"&&bq&&<div style={{fontSize:"0.78rem",color:C.v,fontWeight:700,marginBottom:8}}>{lista.length} resultado{lista.length!==1?"s":""} para "{busqGasto}"</div>}

        <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
          <Btn onClick={()=>{setF({fecha:hoy(),cat:"Ferretería",campoId:(db.campos[0]&&db.campos[0].id)||"",medioPago:"efectivo"});setMG(true);}}>+ Gasto</Btn>
          <Btn v="green" onClick={()=>{setF({fecha:hoy(),cat:"Ferretería",campoId:(db.campos[0]&&db.campos[0].id)||"",esNotaCredito:true});setMG(true);}}>📄 Nota de crédito</Btn>
          <button onClick={()=>setMF(true)} style={{background:`linear-gradient(135deg,${C.na},${C.na2})`,color:"#fff",border:"none",borderRadius:12,padding:"10px 16px",fontSize:"0.82rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>📷 Foto remito</button>
        </div>

        {filtro==="Repuestos"&&Object.keys(gastoPorMaquina).length>0&&(
          <Panel title="⚙️ Repuestos por máquina" accent={C.na}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:9}}>
              {Object.entries(gastoPorMaquina).sort((a,b)=>b[1]-a[1]).map(([nom,monto],i)=><GC key={nom} title={nom} val={"$"+fmt(monto)} sub="en repuestos" acc={ACCS[i%7]} emoji="⚙️"/>)}
            </div>
          </Panel>
        )}

        {/* VISTA POR ÁREA */}
        {filtro==="areas"&&(()=>{
          const totalGeneral=db.gastos.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);
          return(
            <div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:10,marginBottom:12}}>
                {AREAS_EMPRESA.map(area=>{
                  const gastosArea=db.gastos.filter(g=>g.area===area.id);
                  const totalArea=gastosArea.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);
                  const pct=totalGeneral>0?Math.round((totalArea/totalGeneral)*100):0;
                  return(
                    <div key={area.id} style={{background:"#fff",borderRadius:16,padding:14,boxShadow:"0 2px 12px rgba(0,0,0,.06)",borderTop:`3px solid ${area.col}`}}>
                      <div style={{fontSize:"0.72rem",fontWeight:800,color:area.col,marginBottom:6}}>{area.label}</div>
                      <div style={{fontSize:"1.2rem",fontWeight:900,color:C.dk}}>${fmtC(totalArea)}</div>
                      <div style={{fontSize:"0.7rem",color:C.md,marginTop:3}}>{pct}% · {gastosArea.length} gastos</div>
                      <div style={{background:"#f0f4f8",borderRadius:20,height:5,overflow:"hidden",marginTop:6}}>
                        <div style={{height:"100%",width:`${pct}%`,background:area.col,borderRadius:20}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
              {(()=>{const sinArea=db.gastos.filter(g=>!g.area);const totalSin=sinArea.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);if(!sinArea.length)return null;return(<InfoBox text={`⚠️ ${sinArea.length} gastos por $${fmtC(totalSin)} sin área asignada.`} color="orange" emoji="📋"/>);})()}
            </div>
          );
        })()}

        {/* VISTA POR MES */}
        {filtro==="meses"&&(()=>{
          const mesesMap={};
          db.gastos.forEach(g=>{
            const key=(g.fecha||"").slice(0,7);
            if(!key)return;
            if(!mesesMap[key])mesesMap[key]={total:0,gastos:[]};
            mesesMap[key].total+=parseFloat(g.monto)||0;
            mesesMap[key].gastos.push(g);
          });
          const meses=Object.entries(mesesMap).sort((a,b)=>b[0].localeCompare(a[0]));
          const mesActualSel=mesSel||meses[0]?.[0];
          const gastosMes=mesActualSel?(mesesMap[mesActualSel]?.gastos||[]).filter(g=>catSel==="Todos"||g.cat===catSel):[];
          const totalMes=gastosMes.reduce((s,g)=>s+(parseFloat(g.monto)||0),0);
          const catsMes=mesActualSel?[...new Set((mesesMap[mesActualSel]?.gastos||[]).map(g=>g.cat).filter(Boolean))]:[];
          return(
            <div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
                {meses.slice(0,18).map(([key,d])=>(
                  <button key={key} onClick={()=>{setMesSel(key);setCatSel("Todos");}} style={{padding:"7px 12px",borderRadius:30,border:`1.5px solid ${key===mesActualSel?C.ro:"#e2e8f0"}`,background:key===mesActualSel?C.ro:"#fff",color:key===mesActualSel?"#fff":C.md,fontSize:"0.74rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit",textAlign:"center"}}>
                    <div>{formatMes(key).slice(0,3).toUpperCase()} {key.slice(0,4)}</div>
                    <div style={{fontSize:"0.65rem",opacity:.8}}>${fmtC(d.total)}</div>
                  </button>
                ))}
              </div>
              {mesActualSel&&<>
                <div style={{background:`linear-gradient(135deg,${C.ro},#f07070)`,borderRadius:16,padding:14,marginBottom:12}}>
                  <div style={{fontSize:"0.72rem",fontWeight:800,color:"rgba(255,255,255,.7)",textTransform:"uppercase",marginBottom:4}}>💸 {formatMes(mesActualSel)}</div>
                  <div style={{fontSize:"1.6rem",fontWeight:900,color:"#fff"}}>${fmt(Math.round(mesesMap[mesActualSel]?.total||0))}</div>
                  <div style={{fontSize:"0.78rem",color:"rgba(255,255,255,.7)",marginTop:3}}>{mesesMap[mesActualSel]?.gastos.length} gastos</div>
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
                  {["Todos",...catsMes].map(cat=>(
                    <button key={cat} onClick={()=>setCatSel(cat)} style={{padding:"6px 12px",borderRadius:30,border:`1.5px solid ${cat===catSel?C.dk:"#e2e8f0"}`,background:cat===catSel?C.dk:"#fff",color:cat===catSel?"#fff":C.md,fontSize:"0.73rem",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                      {cat}{cat!=="Todos"?` $${fmtC(mesesMap[mesActualSel]?.gastos.filter(g=>g.cat===cat).reduce((s,g)=>s+(parseFloat(g.monto)||0),0))}` :""}
                    </button>
                  ))}
                </div>
                {gastosMes.slice().sort((a,b)=>b.monto-a.monto).map(g=>{
                  const areaObj=AREAS_EMPRESA.find(a=>a.id===g.area);
                  return(
                    <div key={g.id} onClick={()=>setGastoVer(g)} style={{background:"#fff",borderRadius:12,padding:"11px 14px",marginBottom:7,boxShadow:"0 1px 6px rgba(0,0,0,.05)",borderLeft:`3px solid ${areaObj?areaObj.col:"#e2e8f0"}`,cursor:"pointer"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:800,fontSize:"0.88rem",color:C.dk}}>{g.concepto||"Sin concepto"}</div>
                          <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:3,alignItems:"center"}}>
                            <Bdg label={g.cat} col={cb[g.cat]||"gray"}/>
                            {areaObj&&<span style={{background:areaObj.col3,color:areaObj.col,padding:"2px 7px",borderRadius:20,fontSize:"0.64rem",fontWeight:800}}>{areaObj.label}</span>}
                            {g.prov&&<span style={{fontSize:"0.7rem",color:C.md}}>· {g.prov}</span>}
                          </div>
                        </div>
                        <span style={{fontWeight:900,color:C.dk,fontSize:"1rem",marginLeft:8}}>${fmt(Math.round(g.monto))}</span>
                      </div>
                    </div>
                  );
                })}
              </>}
            </div>
          );
        })()}

        {/* VISTA GRÁFICOS */}
        {filtro==="graficos"&&(()=>{
          const mesesMap={};
          const hoyDate=new Date();
          for(let i=11;i>=0;i--){
            const d=new Date(hoyDate.getFullYear(),hoyDate.getMonth()-i,1);
            const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
            const label=d.toLocaleString("es-AR",{month:"short",year:"2-digit"});
            mesesMap[key]={label,monto:0};
          }
          db.gastos.forEach(g=>{
            const key=(g.fecha||"").slice(0,7);
            if(mesesMap[key])mesesMap[key].monto+=parseFloat(g.monto)||0;
          });
          const dataMeses=Object.entries(mesesMap).map(([,v])=>v).filter(v=>v.monto>0);
          const catMap={};
          db.gastos.forEach(g=>{if(!catMap[g.cat])catMap[g.cat]=0;catMap[g.cat]+=parseFloat(g.monto)||0;});
          const dataCats=Object.entries(catMap).map(([cat,monto])=>({cat,monto:Math.round(monto)})).sort((a,b)=>b.monto-a.monto);
          const areaMap={};
          db.gastos.forEach(g=>{const a=g.area||"sin_area";if(!areaMap[a])areaMap[a]=0;areaMap[a]+=parseFloat(g.monto)||0;});
          const dataAreas=AREAS_EMPRESA.map(a=>({area:a.label,monto:Math.round(areaMap[a.id]||0),col:a.col})).filter(d=>d.monto>0);
          return(
            <div>
              {dataMeses.length>=2&&<Panel title="📅 Gastos — últimos 12 meses" accent={C.ro}><LineChart data={dataMeses} labelKey="label" valueKey="monto" colorFn={()=>C.ro}/></Panel>}
              {dataCats.length>0&&<Panel title="🏷️ Por categoría" accent={C.na}><DonutChart data={dataCats} labelKey="cat" valueKey="monto"/></Panel>}
              {dataAreas.length>0&&<Panel title="🏢 Por área" accent={C.az}><BarChart data={dataAreas} labelKey="area" valueKey="monto" colorFn={(d)=>d.col||C.az}/></Panel>}
            </div>
          );
        })()}

        {/* LISTA NORMAL */}
        {filtro!=="areas"&&filtro!=="graficos"&&filtro!=="meses"&&<div>
          {lista.length>0&&<Panel accent={C.ro}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:"0.74rem",fontWeight:800,color:C.md,textTransform:"uppercase"}}>Total {filtro!=="todos"?filtro:""}{bq?` (${lista.length} resultados)`:""}</span><span style={{fontSize:"1.35rem",fontWeight:900,color:C.dk}}>${fmt(total)}</span></div></Panel>}
          {lista.length===0&&<div style={{textAlign:"center",padding:30,color:C.lt}}><div style={{fontSize:"2rem"}}>🔍</div><p style={{marginTop:8}}>{bq?"Sin resultados":"Sin gastos registrados"}</p></div>}
          {lista.slice().reverse().map(g=>{
            const areaObj=AREAS_EMPRESA.find(a=>a.id===g.area);
            const medioPago=MEDIOS_PAGO.find(m=>m.id===g.medioPago);
            return(
              <div key={g.id} onClick={()=>setGastoVer(g)} style={{background:g.esNotaCredito?"#f0fff6":"#fff",borderRadius:13,padding:"12px 14px",marginBottom:8,boxShadow:"0 2px 8px rgba(0,0,0,.05)",cursor:"pointer",borderLeft:`3px solid ${g.esNotaCredito?C.v:areaObj?areaObj.col:"#e2e8f0"}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:800,fontSize:"0.9rem",color:C.dk,marginBottom:3,display:"flex",alignItems:"center",gap:6}}>
                      {g.esNotaCredito&&<span style={{background:C.v3,color:C.v,padding:"1px 7px",borderRadius:10,fontSize:"0.68rem",fontWeight:800}}>📄 NC</span>}
                      {g.concepto||"Sin concepto"}
                    </div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                      <Bdg label={g.cat} col={cb[g.cat]||"gray"}/>
                      {areaObj&&<span style={{background:areaObj.col3,color:areaObj.col,padding:"2px 7px",borderRadius:20,fontSize:"0.65rem",fontWeight:800}}>{areaObj.label}</span>}
                      {medioPago&&<span style={{fontSize:"0.68rem",color:C.md}}>{medioPago.label}</span>}
                      {g.prov&&<span style={{fontSize:"0.72rem",color:C.md}}>· {g.prov}</span>}
                    </div>
                    <div style={{fontSize:"0.72rem",color:C.lt,marginTop:4}}>{g.fecha}{g.campoId?` · ${camNom(db,g.campoId)}`:""}</div>
                  </div>
                  <div style={{textAlign:"right",marginLeft:10,flexShrink:0}}>
                    <div style={{fontSize:"1.1rem",fontWeight:900,color:g.esNotaCredito?C.v:C.dk}}>{g.esNotaCredito?"+":""}{g.esNotaCredito?`$${fmt(Math.abs(g.monto))}`:`$${fmt(g.monto)}`}</div>
                    <div style={{display:"flex",gap:4,marginTop:6,justifyContent:"flex-end"}}>
                      <Btn sz="xs" v="ghost" onClick={e=>{e.stopPropagation();setF({...g});setMG(true);}}>✏️</Btn>
                      <Btn sz="xs" v="danger" onClick={e=>{e.stopPropagation();if(confirm("¿Eliminar?"))setDb({...db,gastos:db.gastos.filter(x=>x.id!==g.id)});}}>🗑️</Btn>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>}
      </div>}

      {/* ═══ PESTAÑA REMITOS ═══ */}
      {tab==="remitos"&&<div>
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <Btn v="orange" onClick={()=>{setF({fecha:hoy(),tipo:"remito"});setMRemito(true);}}>+ Remito</Btn>
        </div>
        {remPendientes.length>0&&<InfoBox text={`⚠️ ${remPendientes.length} pendiente${remPendientes.length>1?"s":""} de facturar`} color="orange" emoji="📄"/>}
        {/* FILTROS REMITOS */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:8}}>
          <input value={filtRemMes} onChange={e=>setFiltRemMes(e.target.value)} type="month" style={{padding:"8px 10px",border:"1.5px solid #e2e8f0",borderRadius:10,fontFamily:"inherit",fontSize:"0.82rem",outline:"none"}}/>
          <input value={filtRemProv} onChange={e=>setFiltRemProv(e.target.value)} placeholder="🔍 Proveedor..." style={{padding:"8px 10px",border:"1.5px solid #e2e8f0",borderRadius:10,fontFamily:"inherit",fontSize:"0.82rem",outline:"none"}}/>
        </div>
        <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
          {[{v:"",l:"Todos"},{v:"pendiente",l:"⏳ Pendientes"},{v:"facturado",l:"✅ Facturados"}].map(op=>(

            const nuevoGasto={id:facId+1,fecha:f.fecha||hoy(),concepto:f.concepto||`Factura ${f.numero||""}`,cat:f.cat||"Otros",area:areaFinal,prov:f.proveedor||"",monto:total,montoNeto:neto,montoIva:iva,ivaAlicuota:f.ivaAlicuota||"21",campoId:f.campoId||null,fact:f.numero||"",maquinaId:maquinaIdFinal,maquinaNom:maquinaNomFinal,auto:true,facturaId:facId};

        <MBtns onClose={()=>{setMG(false);setF({});}} sv={f.esNotaCredito?"green":undefined} saveLabel={f.esNotaCredito?"Guardar nota de crédito":undefined} onSave={()=>{

      {tab==="iva"&&(()=>{
        const formatMesIva=(key)=>{if(!key)return"";const[y,m]=key.split("-");const d=new Date(y,parseInt(m)-1,1);return d.toLocaleString("es-AR",{month:"long",year:"numeric"});};

        const todosItems=[
          ...db.gastos.filter(g=>g.montoIva>0).map(g=>({...g,seccion:"Gasto",concepto:g.concepto||g.cat||"—",proveedor:g.prov||"—"})),
          ...(db.comprasIns||[]).filter(c=>c.totalIva>0).map(c=>({...c,monto:c.total||0,montoNeto:c.totalNeto||0,montoIva:c.totalIva||0,seccion:"Insumo",concepto:`${c.nom||"—"} x${c.qty}${c.und||""}`,proveedor:c.proveedor||c.lugar||"—"})),
          ...(db.combustible||[]).filter(c=>c.totalIva>0).map(c=>({...c,monto:c.total||0,montoNeto:c.totalNeto||0,montoIva:c.totalIva||0,seccion:"Combustible",concepto:`${c.litros}L ${c.tipo||""}`,proveedor:c.maq||"—"})),
          ...(db.labores||[]).filter(l=>l.montoIva>0).map(l=>({...l,monto:l.costo||0,seccion:"Labor",concepto:`${l.tipo||"—"} — ${l.lote||"—"}`,proveedor:l.maquina||"Propio"})),
          ...(db.trabajos||[]).filter(t=>t.montoIva>0).map(t=>({...t,seccion:"Trabajo",concepto:t.tipo||"—",proveedor:t.proveedor||"—"})),
          ...(db.pagosArr||[]).filter(p=>p.montoIva>0).map(p=>({...p,seccion:"Arrendamiento",concepto:p.concepto||"—",proveedor:"—"})),
          ...(db.facturas||[]).filter(f=>f.montoIva>0).map(f=>({...f,seccion:"Factura",concepto:f.concepto||f.numero||"—",proveedor:f.proveedor||"—"})),
        ].filter(i=>i.fecha);

        // Meses disponibles
        const mesesMap={};
        todosItems.forEach(i=>{
          const key=(i.fecha||"").slice(0,7);
          if(!key)return;
          if(!mesesMap[key])mesesMap[key]={items:[],iva105:0,iva21:0,ivaTotal:0,neto:0,total:0};
          mesesMap[key].items.push(i);
          const alicuota=parseFloat(i.ivaAlicuota||"21");
          if(alicuota===10.5)mesesMap[key].iva105+=i.montoIva||0;
          else if(alicuota===21)mesesMap[key].iva21+=i.montoIva||0;
          mesesMap[key].ivaTotal+=(i.montoIva||0);
          mesesMap[key].neto+=(i.montoNeto||0);
          mesesMap[key].total+=(i.monto||0);
        });
        const meses=Object.entries(mesesMap).sort((a,b)=>b[0].localeCompare(a[0]));
        const datosMes=mesesMap[ivaTabMes]||{items:[],iva105:0,iva21:0,ivaTotal:0,neto:0,total:0};

        // Totales generales (todos los meses)
        const totGlobal={iva105:0,iva21:0,ivaTotal:0,neto:0,total:0};
        Object.values(mesesMap).forEach(m=>{totGlobal.iva105+=m.iva105;totGlobal.iva21+=m.iva21;totGlobal.ivaTotal+=m.ivaTotal;totGlobal.neto+=m.neto;totGlobal.total+=m.total;});

        return(
          <div>
            {todosItems.length===0&&<InfoBox text="Aún no hay registros con IVA discriminado. Al cargar gastos, labores, combustible, arrendamientos o trabajos elegí la alícuota de IVA correspondiente." color="blue" emoji="🧾"/>}

            {/* Resumen general */}
            {todosItems.length>0&&<>
              <div style={{background:`linear-gradient(135deg,${C.az},#5b9cf6)`,borderRadius:16,padding:14,marginBottom:12}}>
                <div style={{fontSize:"0.72rem",fontWeight:800,color:"rgba(255,255,255,.7)",textTransform:"uppercase",marginBottom:4}}>📊 IVA Compras — Acumulado total</div>
                <div style={{fontSize:"1.7rem",fontWeight:900,color:"#fff"}}>${fmtC(Math.round(totGlobal.ivaTotal))}</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7,marginTop:10}}>
                  <div style={{background:"rgba(255,255,255,.15)",borderRadius:9,padding:"8px",textAlign:"center"}}>
                    <div style={{fontSize:"0.58rem",fontWeight:700,color:"rgba(255,255,255,.7)",textTransform:"uppercase"}}>Neto s/IVA</div>
                    <div style={{fontSize:"0.9rem",fontWeight:900,color:"#fff"}}>${fmtC(Math.round(totGlobal.neto))}</div>
                  </div>
                  <div style={{background:"rgba(255,255,255,.15)",borderRadius:9,padding:"8px",textAlign:"center"}}>
                    <div style={{fontSize:"0.58rem",fontWeight:700,color:"rgba(255,255,255,.7)",textTransform:"uppercase"}}>IVA 10,5%</div>
                    <div style={{fontSize:"0.9rem",fontWeight:900,color:"#fff"}}>${fmtC(Math.round(totGlobal.iva105))}</div>
                  </div>
                  <div style={{background:"rgba(255,255,255,.15)",borderRadius:9,padding:"8px",textAlign:"center"}}>
                    <div style={{fontSize:"0.58rem",fontWeight:700,color:"rgba(255,255,255,.7)",textTransform:"uppercase"}}>IVA 21%</div>
                    <div style={{fontSize:"0.9rem",fontWeight:900,color:"#fff"}}>${fmtC(Math.round(totGlobal.iva21))}</div>
                  </div>
                </div>
              </div>

              {/* Selector de mes */}

              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
                {meses.map(([key,d])=>(
                  <button key={key} onClick={()=>setIvaTabMes(key)} style={{padding:"6px 12px",borderRadius:30,border:`1.5px solid ${key===ivaTabMes?C.az:"#e2e8f0"}`,background:key===ivaTabMes?C.az:"#fff",color:key===ivaTabMes?"#fff":C.md,fontSize:"0.73rem",fontWeight:800,cursor:"pointer",fontFamily:"inherit",textAlign:"center"}}>
                    {formatMesIva(key).slice(0,3).toUpperCase()} {key.slice(0,4)}<br/>
                    <span style={{fontSize:"0.62rem",opacity:.8}}>${fmtC(Math.round(d.ivaTotal))}</span>

                  <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginTop:6}}>
                    <div style={{textAlign:"center"}}>
                      <div style={{fontSize:"0.58rem",fontWeight:700,color:C.md,textTransform:"uppercase"}}>Neto</div>
                      <div style={{fontSize:"0.88rem",fontWeight:900,color:C.dk}}>${fmtC(Math.round(datosMes.neto))}</div>

                    <div style={{textAlign:"center"}}>
                      <div style={{fontSize:"0.58rem",fontWeight:700,color:C.na,textTransform:"uppercase"}}>IVA 10,5%</div>
                      <div style={{fontSize:"0.88rem",fontWeight:900,color:C.na}}>${fmtC(Math.round(datosMes.iva105))}</div>

                      <div style={{fontSize:"0.58rem",fontWeight:700,color:C.v,textTransform:"uppercase"}}>IVA 21%</div>

                      <div style={{fontSize:"0.58rem",fontWeight:700,color:C.az,textTransform:"uppercase"}}>Total IVA</div>
                      <div style={{fontSize:"0.88rem",fontWeight:900,color:C.az}}>${fmtC(Math.round(datosMes.ivaTotal))}</div>
                    </div>
                  </div>
                </div>
              </div>

              {/* Lista detallada del mes */}
              {datosMes.items.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).map((item,i)=>(
                <div key={i} style={{background:"#fff",borderRadius:12,padding:"10px 13px",marginBottom:7,boxShadow:"0 1px 6px rgba(0,0,0,.05)",borderLeft:`3px solid ${parseFloat(item.ivaAlicuota||"21")===10.5?C.na:C.v}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:800,fontSize:"0.86rem",color:C.dk}}>{item.concepto}</div>
                      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:3,alignItems:"center"}}>
                        <Bdg label={item.seccion} col={item.seccion==="Combustible"?"green":item.seccion==="Labor"?"brown":item.seccion==="Insumo"?"teal":item.seccion==="Arrendamiento"?"purple":"blue"}/>
                        <span style={{fontSize:"0.7rem",color:C.md}}>{item.fecha}</span>
                        {item.proveedor&&item.proveedor!=="—"&&<span style={{fontSize:"0.7rem",color:C.md}}>· {item.proveedor}</span>}
                      </div>
                    </div>
                    <div style={{textAlign:"right",flexShrink:0}}>
                      <div style={{fontSize:"0.72rem",color:C.md}}>Neto: ${fmt(item.montoNeto||0)}</div>
                      <div style={{fontSize:"0.78rem",fontWeight:800,color:parseFloat(item.ivaAlicuota||"21")===10.5?C.na:C.v}}>IVA {item.ivaAlicuota||"21"}%: ${fmt(item.montoIva||0)}</div>
                      <div style={{fontSize:"0.82rem",fontWeight:900,color:C.dk}}>Total: ${fmt(item.monto||0)}</div>
                    </div>
                  </div>
                </div>
              ))}
              {datosMes.items.length===0&&<InfoBox text="Sin registros con IVA en este mes." color="blue" emoji="📅"/>}
            </>}
          </div>
        );
      })()}

      <FotoModal open={mF} onClose={()=>setMF(false)} onDatos={onDatos}/>
    </div>
  );
}

// ── COSECHA ───────────────────────────────────────────────
function SecCosecha({db,setDb}){
  const [tab,setTab]=useState("cosechas");
  const [mC,setMC]=useState(false);
  const [mCam,setMCam]=useState(false);
  const [cosechaSel,setCosechaSel]=useState(null);
  const [editCos,setEditCos]=useState(null); // cosecha en edición
  const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));

  const totGen={};
  db.cosechas.forEach(c=>{
    const kgCams=db.cosechaCamiones.filter(x=>x.cosechaId==c.id).reduce((s,x)=>s+x.kg,0);
    const kgSilos=(c.silobolsas&&c.silobolsas.length>0?(c.silobolsas||[]).reduce((s,sb)=>s+(parseFloat(sb.kg)||0),0):(parseFloat(c.kgSilo)||0));
    totGen[c.cereal]=(totGen[c.cereal]||0)+kgSilos+kgCams;
  });

  const abrirCam=(cos)=>{setCosechaSel(cos);setF({fecha:hoy(),cosechaId:cos.id,dest:"Acopio",modalidad:"Blanco"});setMCam(true);};

  const abrirEditar=(cos)=>{
    setEditCos(cos);
    setF({...cos, silobolsas: cos.silobolsas||[]});
    setMC(true);
  };

  const guardarCosecha=()=>{
    const br=parseFloat(f.brutos)||0, dc=parseFloat(f.desc)||0;
    const netos=br-dc;
    const silosForm=f.silobolsas||[];
    const kgSiloTotal=silosForm.reduce((s,sb)=>s+(parseFloat(sb.kg)||0),0);
    // Lotes seleccionados (puede ser uno o varios)
    const lotesSelec=f.lotesMulti&&f.lotesMulti.length>0?f.lotesMulti:[f.lote==="__otro"?(f.loteManual||""):f.lote].filter(Boolean);
    if(!lotesSelec.length)return alert("Seleccioná al menos un lote");

    let newDb={...db};
    const cosId=editCos?editCos.id:Date.now();

    if(editCos){
      // Editar cosecha existente (solo un lote)
      const loteReal=lotesSelec[0];
      newDb={...newDb,cosechas:newDb.cosechas.map(c=>c.id===editCos.id?{...c,...f,lote:loteReal,lotes:lotesSelec,brutos:br,desc:dc,netos,kgSilo:0,silobolsas:silosForm}:c)};
      const silosSinEsta=newDb.silos.filter(s=>s.origenCosechaId!==editCos.id);
      const silosEditados=silosForm.filter(sb=>sb.num&&sb.kg).map((sb,i)=>({
        id:editCos.id*100+i+1,
        campoId:f.campoId, lote:loteReal, cereal:f.cereal,
        num:sb.num, kg:parseFloat(sb.kg)||0, kgRest:parseFloat(sb.kg)||0,
        hum:f.hum||"", humMax:f.humMax||"",
        fecha:f.fecha||hoy(), campania:f.campania||"",
        estado:"Activa", origenCosechaId:editCos.id
      }));
      newDb={...newDb,cosechas:newDb.cosechas,silos:[...silosSinEsta,...silosEditados]};
      newDb=addMov(newDb,`✏️ Cosecha editada: ${f.cereal} ${camNom(db,f.campoId)}`);
    }else{
      // Nueva cosecha — crear una por lote si son múltiples
      lotesSelec.forEach((lote,idx)=>{
        const thisId=cosId+idx;
        // Kg de este lote (si el usuario los especificó por lote, si no se reparte)
        const kgLote=f.kgPorLote&&f.kgPorLote[lote]?parseFloat(f.kgPorLote[lote]):null;
        const brLote=kgLote||br/lotesSelec.length;
        const dcLote=kgLote?0:dc/lotesSelec.length;
        const netosLote=brLote-dcLote;
        // Silobolsas solo al primer lote si no se especificaron por lote
        const silosEste=idx===0?silosForm:[];
        const nuevaCosecha={id:thisId,...f,
          lote, lotes:lotesSelec,
          brutos:Math.round(brLote), desc:Math.round(dcLote),
          netos:Math.round(netosLote),
          kgSilo:0, silobolsas:silosEste,
          haLote:f.haLotePorLote&&f.haLotePorLote[lote]?f.haLotePorLote[lote]:f.haLote
        };
        newDb={...newDb,cosechas:[...newDb.cosechas,nuevaCosecha]};
        if(silosEste.length>0){
          const nuevosSilos=silosEste.filter(sb=>sb.num&&sb.kg).map((sb,i)=>({
            id:thisId*100+i+1,
            campoId:f.campoId, lote, cereal:f.cereal,
            num:sb.num, kg:parseFloat(sb.kg)||0, kgRest:parseFloat(sb.kg)||0,
            hum:f.hum||"", humMax:f.humMax||"",
            fecha:f.fecha||hoy(), campania:f.campania||"",
            estado:"Activa", origenCosechaId:thisId
          }));
          newDb={...newDb,silos:[...newDb.silos,...nuevosSilos]};
        }
      });
      newDb=addMov(newDb,`🌽 ${f.cereal} — ${lotesSelec.length} lote${lotesSelec.length>1?"s":""}: ${lotesSelec.join(", ")} — ${camNom(db,f.campoId)}`);
    }
    setDb(newDb);setMC(false);setEditCos(null);setF({});
  };

  return(
    <div>
      <Tabs items={[{id:"cosechas",label:"🌽 Cosechas"},{id:"graficos",label:"📈 Gráficos"},{id:"camiones",label:"🚛 Camiones"}]} active={tab} onChange={setTab}/>

      {tab==="cosechas"&&<div>
        <div style={{display:"flex",gap:7,marginBottom:12}}>
          <Btn onClick={()=>{setEditCos(null);setF({cereal:"Soja",fecha:hoy(),campoId:db.campos[0]?db.campos[0].id:"",silobolsas:[]});setMC(true);}}>+ Registrar cosecha</Btn>
        </div>

        {Object.keys(totGen).length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:10,marginBottom:12}}>
          {Object.entries(totGen).map(([cer,kg],i)=><GC key={cer} title={cer} val={fmt(kg)+" kg"} sub={(kg/1000).toFixed(1)+" t"} acc={ACCS[i%7]} emoji="🌽"/>)}
        </div>}

        {!db.cosechas.length
          ?<div style={{textAlign:"center",padding:30,color:C.lt}}><div style={{fontSize:"2.5rem"}}>🌽</div><p>Sin cosechas registradas</p></div>
          :db.cosechas.slice().reverse().map(cos=>{
            const cf=db.campos.find(x=>x.id==cos.campoId);
            const cams=db.cosechaCamiones.filter(c=>c.cosechaId==cos.id);
            const kgCams=cams.reduce((s,c)=>s+c.kg,0);
            const kgSilos=(cos.silobolsas&&cos.silobolsas.length>0?(cos.silobolsas||[]).reduce((s,sb)=>s+(parseFloat(sb.kg)||0),0):(parseFloat(cos.kgSilo)||0));
            const totalLote=kgSilos+kgCams;
            const haLote=parseFloat(cos.haLote)||0;
            const promHa=haLote>0&&totalLote>0?Math.round(totalLote/haLote):0;
            return(
              <Panel key={cos.id} accent={C.v}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                  <div>
                    <div style={{fontWeight:900,fontSize:"0.96rem"}}>🌽 {cos.cereal} — {cf?cf.nombre:"—"}</div>
                    <div style={{fontSize:"0.74rem",color:C.md,marginTop:2}}>Lote: {cos.lote||"—"}{haLote>0?` · ${haLote} ha`:""} · {cos.fecha}</div>
                    {(cos.hum||cos.humMax)&&<div style={{fontSize:"0.72rem",color:C.md,marginTop:1}}>Hum: {cos.hum||"?"}%{cos.humMax?`–${cos.humMax}%`:""} · Brutos: {fmt(cos.brutos||0)} kg</div>}
                  </div>
                  <div style={{display:"flex",gap:5}}>
                    <Btn sz="xs" v="ghost" onClick={()=>abrirEditar(cos)}>✏️</Btn>
                    <Btn sz="xs" v="orange" onClick={()=>abrirCam(cos)}>🚛 +Cam</Btn>
                    <Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar cosecha?"))setDb({...db,cosechas:db.cosechas.filter(x=>x.id!==cos.id)});}}>🗑️</Btn>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:8}}>
                  <div style={{background:C.v3,borderRadius:10,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:"0.64rem",color:C.md,fontWeight:700,textTransform:"uppercase"}}>Kg Netos</div>
                    <div style={{fontSize:"1.1rem",fontWeight:900,color:C.dk}}>{fmt(cos.netos||0)}</div>
                  </div>
                  <div style={{background:C.az3,borderRadius:10,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:"0.64rem",color:C.md,fontWeight:700,textTransform:"uppercase"}}>A Silo</div>
                    <div style={{fontSize:"1.1rem",fontWeight:900,color:C.az}}>{fmt(kgSilos)}</div>
                  </div>
                  <div style={{background:C.na3,borderRadius:10,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:"0.64rem",color:C.md,fontWeight:700,textTransform:"uppercase"}}>A Camión</div>
                    <div style={{fontSize:"1.1rem",fontWeight:900,color:C.na}}>{fmt(kgCams)}</div>
                  </div>
                </div>
                {totalLote>0&&<div style={{background:`linear-gradient(135deg,${C.dk},${C.dk2})`,borderRadius:12,padding:"11px 14px",marginBottom:8,display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:"0.62rem",color:"rgba(255,255,255,.6)",fontWeight:700,textTransform:"uppercase",marginBottom:3}}>Total lote</div>
                    <div style={{fontSize:"1.25rem",fontWeight:900,color:"#fff"}}>{fmt(totalLote)} kg</div>
                    <div style={{fontSize:"0.7rem",color:"rgba(255,255,255,.5)"}}>{(totalLote/1000).toFixed(1)} t</div>
                  </div>
                  <div style={{textAlign:"center",borderLeft:"1px solid rgba(255,255,255,.15)"}}>
                    <div style={{fontSize:"0.62rem",color:"rgba(255,255,255,.6)",fontWeight:700,textTransform:"uppercase",marginBottom:3}}>Promedio</div>
                    <div style={{fontSize:"1.25rem",fontWeight:900,color:promHa>0?C.v2:"rgba(255,255,255,.4)"}}>{promHa>0?fmt(promHa)+" kg/ha":"Sin ha"}</div>
                    {haLote>0&&<div style={{fontSize:"0.7rem",color:"rgba(255,255,255,.5)"}}>{haLote} ha</div>}
                  </div>
                </div>}
                {/* Silobolsas */}
                {(cos.silobolsas||[]).length>0&&<div style={{marginBottom:6}}>
                  <div style={{fontSize:"0.7rem",fontWeight:800,color:C.md,textTransform:"uppercase",marginBottom:4}}>🛍️ Silobolsas:</div>
                  {(cos.silobolsas||[]).map((sb,i)=>(
                    <div key={i} style={{background:C.v3,borderRadius:8,padding:"5px 9px",marginBottom:3,fontSize:"0.78rem",display:"flex",justifyContent:"space-between"}}>
                      <span>Bolsa <b>{sb.num}</b> — {fmt(sb.kg)} kg</span>
                    </div>
                  ))}
                </div>}
                {/* Camiones */}
                {cams.length>0&&<div style={{marginTop:6}}>
                  <div style={{fontSize:"0.7rem",fontWeight:800,color:C.md,textTransform:"uppercase",marginBottom:4}}>Camiones directos:</div>
                  {cams.map((c,i)=>(
                    <div key={i} style={{background:C.bg,borderRadius:9,padding:"6px 10px",marginBottom:4,fontSize:"0.78rem",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <span><b>{fmt(c.kg)} kg</b> · {c.camionNom||"—"}{c.chofer?` · ${c.chofer}`:""} · {c.dest||"—"}{c.cupo&&c.cupo!=="Sin cupo"?` · Cupo: ${c.cupo}`:""}</span>
                      <div style={{display:"flex",gap:4,alignItems:"center"}}>
                        <span style={{color:C.lt,fontSize:"0.7rem"}}>{c.fecha}</span>
                        <Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,cosechaCamiones:db.cosechaCamiones.filter(x=>x.id!==c.id)});}}>🗑️</Btn>
                      </div>
                    </div>
                  ))}
                </div>}
              </Panel>
            );
          })}
      </div>}

      {tab==="graficos"&&(()=>{
        // Rendimiento por campaña (kg/ha promedio)
        const dataRendCamp=[];
        const campMap={};
        db.cosechas.forEach(c=>{
          const camp=c.campania||c.fecha?.slice(0,4)||"Sin campaña";
          if(!campMap[camp])campMap[camp]={totalKg:0,totalHa:0};
          const kgC=db.cosechaCamiones.filter(x=>x.cosechaId==c.id).reduce((s,x)=>s+(parseFloat(x.kg)||0),0);
          const kgS=c.silobolsas&&c.silobolsas.length>0?(c.silobolsas||[]).reduce((s,sb)=>s+(parseFloat(sb.kg)||0),0):(parseFloat(c.kgSilo)||0);
          campMap[camp].totalKg+=kgS+kgC;
          campMap[camp].totalHa+=parseFloat(c.haLote)||0;
        });
        Object.entries(campMap).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([camp,d])=>{
          dataRendCamp.push({camp, kg:Math.round(d.totalKg), rend:d.totalHa>0?Math.round(d.totalKg/d.totalHa):0});
        });

        // Rendimiento por lote (kg/ha, solo lotes con ha cargadas)
        const loteMap={};
        db.cosechas.filter(c=>parseFloat(c.haLote)>0).forEach(c=>{
          const key=`${c.lote||"Sin lote"} (${c.cereal||""})`;
          if(!loteMap[key])loteMap[key]={totalKg:0,totalHa:0,cereal:c.cereal};
          const kgC=db.cosechaCamiones.filter(x=>x.cosechaId==c.id).reduce((s,x)=>s+(parseFloat(x.kg)||0),0);
          const kgS=c.silobolsas&&c.silobolsas.length>0?(c.silobolsas||[]).reduce((s,sb)=>s+(parseFloat(sb.kg)||0),0):(parseFloat(c.kgSilo)||0);
          loteMap[key].totalKg+=kgS+kgC;
          loteMap[key].totalHa+=parseFloat(c.haLote)||0;
        });
        const dataLotes=Object.entries(loteMap).map(([lote,d])=>({lote,rend:d.totalHa>0?Math.round(d.totalKg/d.totalHa):0,kg:Math.round(d.totalKg),cereal:d.cereal})).sort((a,b)=>b.rend-a.rend);

        // Kg por cereal total
        const cerealMap={};
        db.cosechas.forEach(c=>{
          if(!cerealMap[c.cereal])cerealMap[c.cereal]=0;
          const kgC=db.cosechaCamiones.filter(x=>x.cosechaId==c.id).reduce((s,x)=>s+(parseFloat(x.kg)||0),0);
          const kgS=c.silobolsas&&c.silobolsas.length>0?(c.silobolsas||[]).reduce((s,sb)=>s+(parseFloat(sb.kg)||0),0):(parseFloat(c.kgSilo)||0);
          cerealMap[c.cereal]+=kgS+kgC;
        });
        const dataCereales=Object.entries(cerealMap).map(([cereal,kg])=>({cereal,kg:Math.round(kg)})).sort((a,b)=>b.kg-a.kg);

        if(!db.cosechas.length) return(
          <div style={{textAlign:"center",padding:40,color:C.lt}}>
            <div style={{fontSize:"2.5rem"}}>📈</div>
            <p style={{marginTop:8,fontWeight:600}}>Sin cosechas para graficar</p>
          </div>
        );

        return(
          <div>
            {/* Kg totales por cereal */}
            {dataCereales.length>1&&<Panel title="🌾 Kg cosechados por cereal" accent={C.v}>
              <BarChart data={dataCereales} labelKey="cereal" valueKey="kg"
                colorFn={(_,i)=>ACCS[i%7]} unit=" kg"/>
            </Panel>}

            {/* Rendimiento por campaña */}
            {dataRendCamp.length>=2&&<Panel title="📅 Rendimiento promedio por campaña (kg/ha)" accent={C.az}>
              <LineChart data={dataRendCamp} labelKey="camp" valueKey="rend"
                colorFn={()=>C.az} unit=""/>
              <div style={{fontSize:"0.72rem",color:C.md,marginTop:4}}>Solo incluye cosechas con hectáreas cargadas</div>
            </Panel>}
            {dataRendCamp.length===1&&<Panel title="📅 Rendimiento por campaña" accent={C.az}>
              <div style={{fontSize:"0.8rem",color:C.md,padding:"8px 0"}}>Necesitás cosechas de al menos 2 campañas para ver la evolución.</div>
            </Panel>}

            {/* Rendimiento por lote */}
            {dataLotes.length>0&&<Panel title="📍 Rendimiento por lote (kg/ha)" accent={C.na}>
              <BarChart data={dataLotes} labelKey="lote" valueKey="rend"
                colorFn={(d)=>{const cerIdx=CERALES.indexOf(d.cereal);return ACCS[cerIdx>=0?cerIdx:0];}} unit=""/>
              {/* Ranking */}
              <div style={{marginTop:10,borderTop:"1px solid #f0f4f8",paddingTop:8}}>
                {dataLotes.slice(0,5).map((d,i)=>(
                  <div key={d.lote} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{background:i===0?C.am:i===1?"#c0c0c0":i===2?"#cd7f32":C.bg,color:i<3?"#fff":C.md,width:18,height:18,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.65rem",fontWeight:900,flexShrink:0}}>{i+1}</span>
                      <span style={{fontSize:"0.8rem",fontWeight:700,color:C.dk}}>{d.lote}</span>
                    </div>
                    <span style={{fontSize:"0.85rem",fontWeight:900,color:C.na}}>{fmt(d.rend)} kg/ha</span>
                  </div>
                ))}
              </div>
            </Panel>}

            {/* Kg por cosecha individual */}
            {db.cosechas.length>1&&<Panel title="🌽 Kg por cosecha registrada" accent={C.v}>
              <BarChart
                data={db.cosechas.slice().map(c=>{
                  const kgC=db.cosechaCamiones.filter(x=>x.cosechaId==c.id).reduce((s,x)=>s+(parseFloat(x.kg)||0),0);
                  const kgS=c.silobolsas&&c.silobolsas.length>0?(c.silobolsas||[]).reduce((s,sb)=>s+(parseFloat(sb.kg)||0),0):(parseFloat(c.kgSilo)||0);
                  return{label:`${c.cereal} ${c.lote||""}`.trim().slice(0,10), kg:Math.round(kgS+kgC), cereal:c.cereal};
                }).filter(d=>d.kg>0)}
                labelKey="label" valueKey="kg"
                colorFn={(d)=>{const idx=CERALES.indexOf(d.cereal);return ACCS[idx>=0?idx:0];}}
              />
            </Panel>}
          </div>
        );
      })()}

      {tab==="camiones"&&<div>
        <Tabla heads={["Fecha","Campo","Lote","Cereal","Kg","Camión","Chofer","Cupo","Destino",""]}
          rows={db.cosechaCamiones.slice().reverse().map(c=>{
            const cos=db.cosechas.find(x=>x.id==c.cosechaId);
            return<tr key={c.id}>
              <Td>{c.fecha}</Td><Td>{cos?camNom(db,cos.campoId):"—"}</Td><Td>{cos?cos.lote||"—":"—"}</Td>
              <Td>{c.cereal||"—"}</Td><Td bold>{fmt(c.kg)}</Td>
              <Td>{c.camionNom||"—"}</Td><Td>{c.chofer||"—"}</Td>
              <Td>{c.cupo||"—"}</Td><Td>{c.dest||"—"}</Td>
              <Td><Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,cosechaCamiones:db.cosechaCamiones.filter(x=>x.id!==c.id)});}}>🗑️</Btn></Td>
            </tr>;
          })}/>
      </div>}

      {/* MODAL COSECHA (nueva o editar) */}
      <Modal open={mC} onClose={()=>{setMC(false);setEditCos(null);setF({});}} title={editCos?"✏️ Editar Cosecha":"🌽 Registrar Cosecha"}>
        <FR>
          <Inp label="Fecha" type="date" value={f.fecha||hoy()} onChange={v=>sf("fecha",v)}/>
          <Inp label="Campo" value={f.campoId||""} onChange={v=>sf("campoId",v)} opts={db.campos.map(c=>({v:c.id,l:c.nombre}))}/>
        </FR>
        <FR>
          <Inp label="Lote" value={f.lote||""} onChange={v=>sf("lote",v)} opts={f.campoId?[{v:"",l:"-- Seleccionar --"},...[...new Set(db.lotes.filter(l=>l.campoId==f.campoId).map(l=>l.nom))].map(n=>({v:n,l:n})),{v:"__otro",l:"Otro..."}]:[{v:"",l:"-- Elegí campo --"}]}/>
          <Inp label="Cereal" value={f.cereal||"Soja"} onChange={v=>sf("cereal",v)} opts={CERALES}/>
        </FR>

function SecCamiones({db,setDb}){
  const [mC,setMC]=useState(false);const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));
  // Historial por camión
  const histCam=(camId)=>{
    const nom=(db.camiones.find(c=>c.id==camId)||{nom:""}).nom;
    const salidasS=db.salidasSilo.filter(s=>s.camionId==camId||s.camionNom==nom);
    const salidasC=db.cosechaCamiones.filter(s=>s.camionId==camId||s.camionNom==nom);
    return{salidasS,salidasC,totalKg:([...salidasS,...salidasC]).reduce((s,x)=>s+x.kg,0),viajes:salidasS.length+salidasC.length};
  };
  return(
    <div>
      <InfoBox text="Los 3 Mercedes Benz están precargados. Podés agregar otros camiones de terceros cuando sea necesario." color="blue" emoji="🚛"/>
      <div style={{display:"flex",gap:7,marginBottom:12}}><Btn v="blue" onClick={()=>{setF({propio:false});setMC(true);}}>+ Agregar camión</Btn></div>
      {db.camiones.map((cam,i)=>{
        const h=histCam(cam.id);
        return(
          <Panel key={cam.id} accent={cam.propio?C.v:C.az}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div>
                <div style={{fontWeight:900,fontSize:"0.98rem"}}>🚛 {cam.nom}</div>
                <div style={{fontSize:"0.74rem",color:C.md,marginTop:2}}>{cam.propio?<Bdg label="Camión propio" col="green"/>:<Bdg label="Tercero" col="blue"/>} {cam.pat&&`· ${cam.pat}`}</div>
              </div>
              {!cam.propio&&<Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,camiones:db.camiones.filter(x=>x.id!==cam.id)});}}>🗑️</Btn>}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
              <div style={{background:C.bg,borderRadius:10,padding:"8px",textAlign:"center"}}>
                <div style={{fontSize:"0.64rem",color:C.md,fontWeight:700,textTransform:"uppercase"}}>Viajes</div>
                <div style={{fontSize:"1.1rem",fontWeight:900,color:C.dk}}>{h.viajes}</div>
              </div>
              <div style={{background:C.bg,borderRadius:10,padding:"8px",textAlign:"center"}}>
                <div style={{fontSize:"0.64rem",color:C.md,fontWeight:700,textTransform:"uppercase"}}>Kg totales</div>
                <div style={{fontSize:"1.1rem",fontWeight:900,color:C.dk}}>{fmt(h.totalKg)}</div>
              </div>
              <div style={{background:C.bg,borderRadius:10,padding:"8px",textAlign:"center"}}>
                <div style={{fontSize:"0.64rem",color:C.md,fontWeight:700,textTransform:"uppercase"}}>Toneladas</div>
                <div style={{fontSize:"1.1rem",fontWeight:900,color:C.dk}}>{(h.totalKg/1000).toFixed(1)}</div>
              </div>
            </div>
          </Panel>
        );
      })}
      <Modal open={mC} onClose={()=>setMC(false)} title="🚛 Nuevo Camión">
        <FR><Inp label="Nombre / Descripción" value={f.nom||""} onChange={v=>sf("nom",v)} placeholder="Ej: Scania 124 – Pedro"/><Inp label="Patente" value={f.pat||""} onChange={v=>sf("pat",v)} placeholder="ABC 123"/></FR>
        <Inp label="Chofer habitual (opcional)" value={f.chofer||""} onChange={v=>sf("chofer",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>setMC(false)} onSave={()=>{setDb({...db,camiones:[...db.camiones,{id:"cam"+Date.now(),...f,propio:false}]});setMC(false);setF({});}}/>
      </Modal>
    </div>
  );
}

// ── SANIDAD ANIMAL ────────────────────────────────────────
function SecSanidad({db,setDb}){
  const [mS,setMS]=useState(false);
  const [filtCat,setFiltCat]=useState("Todas");
  const [filtCampo,setFiltCampo]=useState("todos");
  const [f,setF]=useState({});const sf=(k,v)=>setF(p=>({...p,[k]:v}));
  const h30=new Date();h30.setDate(h30.getDate()+30);
  const CATS_ANIM=["Todas","Vacas","Novillos","Novillitos","Terneros","Vaquillonas","Toros","Todo el rodeo","Cerdos","Ovinos","Caballos","Otro"];
  const proximas=db.sanidad.filter(s=>s.proxima&&new Date(s.proxima)<=h30&&s.estado!=="Realizada");

  // Filtrar registros
  const lista=db.sanidad.filter(s=>{
    const matchCat=filtCat==="Todas"||s.categoria===filtCat;
    const matchCampo=filtCampo==="todos"||s.campoId==filtCampo;
    return matchCat&&matchCampo;
  });

  return(
    <div>
      {proximas.length>0&&<InfoBox text={`⚠️ ${proximas.length} aplicación próxima en los próximos 30 días: ${proximas.map(s=>s.descripcion).join(", ")}`} color="orange" emoji="💊"/>}

      <div style={{display:"flex",gap:7,marginBottom:12}}>
        <Btn v="purple" onClick={()=>{setF({fecha:hoy(),tipo:"Vacunación",estado:"Realizada",campoId:(db.campos[0]&&db.campos[0].id),categoria:"Todo el rodeo"});setMS(true);}}>+ Registrar sanidad</Btn>
      </div>

      {/* FILTROS */}
      <Panel title="🔍 Filtrar registros" accent={C.vi}>
        <FR>
          <Inp label="Por categoría animal" value={filtCat} onChange={v=>setFiltCat(v)} opts={CATS_ANIM}/>
          <Inp label="Por campo" value={filtCampo} onChange={v=>setFiltCampo(v)} opts={[{v:"todos",l:"Todos los campos"},...db.campos.map(c=>({v:c.id,l:c.nombre}))]}/>
        </FR>
        {(filtCat!=="Todas"||filtCampo!=="todos")&&<div style={{fontSize:"0.78rem",color:C.vi,fontWeight:700}}>
          Mostrando {lista.length} registro{lista.length!==1?"s":""}{filtCat!=="Todas"?` de ${filtCat}`:""}
          {filtCampo!=="todos"?` en ${camNom(db,filtCampo)}`:""}
        </div>}
      </Panel>

      {/* LISTADO */}
      {!lista.length
        ?<div style={{textAlign:"center",padding:30,color:C.lt}}><div style={{fontSize:"2.5rem"}}>💊</div><p>Sin registros{filtCat!=="Todas"?` para ${filtCat}`:""}</p></div>
        :lista.slice().reverse().map(s=>{
          const ec=s.estado==="Realizada"?"green":s.proxima&&new Date(s.proxima)<=h30?"orange":"blue";
          return(
            <Panel key={s.id} accent={s.estado==="Realizada"?C.v:s.proxima&&new Date(s.proxima)<=h30?C.na:C.vi}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div>
                  <div style={{fontWeight:900,fontSize:"0.95rem"}}>💊 {s.descripcion||"—"}</div>
                  <div style={{fontSize:"0.74rem",color:C.md,marginTop:2}}>
                    📅 {s.fecha} · 🌾 {camNom(db,s.campoId)}
                  </div>
                </div>
                <div style={{display:"flex",gap:5,alignItems:"center"}}>
                  <Bdg label={s.estado||"—"} col={ec}/>
                  <Btn sz="xs" v="ghost" onClick={()=>{setF({...s});setMS(true);}}>✏️</Btn>
                  <Btn sz="xs" v="danger" onClick={()=>{if(confirm("¿Eliminar?"))setDb({...db,sanidad:db.sanidad.filter(x=>x.id!==s.id)});}}>🗑️</Btn>
                </div>
              </div>
              <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:6}}>
                <Bdg label={s.tipo||"Vacunación"} col="purple"/>
                <Bdg label={s.categoria||"—"} col="brown"/>
                {s.cantAnim&&<span style={{fontSize:"0.72rem",color:C.md,fontWeight:600}}>{s.cantAnim} animales</span>}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:7}}>
                {s.producto&&<div style={{fontSize:"0.74rem",color:C.md}}><span style={{fontWeight:700}}>Producto:</span> {s.producto}</div>}
                {s.dosis&&<div style={{fontSize:"0.74rem",color:C.md}}><span style={{fontWeight:700}}>Dosis:</span> {s.dosis}</div>}
                {s.proxima&&<div style={{fontSize:"0.74rem",color:new Date(s.proxima)<=h30?C.ro:C.md}}><span style={{fontWeight:700}}>Próxima:</span> {s.proxima}</div>}
                {s.nota&&<div style={{fontSize:"0.74rem",color:C.md}}><span style={{fontWeight:700}}>Nota:</span> {s.nota}</div>}
              </div>
            </Panel>
          );
        })}

      {/* MODAL */}
      <Modal open={mS} onClose={()=>{setMS(false);setF({});}} title={f.id?"✏️ Editar Sanidad":"💊 Registrar Sanidad Animal"}>
        <FR>
          <Inp label="Fecha" type="date" value={f.fecha||hoy()} onChange={v=>sf("fecha",v)}/>
          <Inp label="Campo" value={f.campoId||""} onChange={v=>sf("campoId",v)} opts={db.campos.map(c=>({v:c.id,l:c.nombre}))}/>
        </FR>
        <FR>
          <Inp label="Tipo" value={f.tipo||"Vacunación"} onChange={v=>sf("tipo",v)} opts={["Vacunación","Desparasitación","Antibiótico","Vitaminas","Caravanas","Control veterinario","Otro"]}/>
          <Inp label="Categoría animal" value={f.categoria||"Todo el rodeo"} onChange={v=>sf("categoria",v)} opts={["Todo el rodeo","Vacas","Novillos","Novillitos","Terneros","Vaquillonas","Toros","Cerdos","Ovinos","Caballos","Otro"]}/>
        </FR>
        <FR>
          <Inp label="Descripción" value={f.descripcion||""} onChange={v=>sf("descripcion",v)} placeholder="Ej: Vacuna aftosa, Ivermectina..."/>
          <Inp label="Producto comercial" value={f.producto||""} onChange={v=>sf("producto",v)} placeholder="Ej: Aftosa Biogénesis"/>
        </FR>
        <FR>
          <Inp label="Dosis / Cantidad" value={f.dosis||""} onChange={v=>sf("dosis",v)} placeholder="Ej: 2ml/cab"/>
          <Inp label="Cantidad animales" type="number" value={f.cantAnim||""} onChange={v=>sf("cantAnim",v)}/>
        </FR>
        <FR>
          <Inp label="Próxima aplicación" type="date" value={f.proxima||""} onChange={v=>sf("proxima",v)}/>
          <Inp label="Estado" value={f.estado||"Realizada"} onChange={v=>sf("estado",v)} opts={["Realizada","Pendiente","Programada"]}/>
        </FR>
        <Inp label="Veterinario / Nota" value={f.nota||""} onChange={v=>sf("nota",v)} sx={{marginBottom:4}}/>
        <MBtns onClose={()=>{setMS(false);setF({});}} sv="purple"
          onSave={()=>{
            const nd=f.id
              ?addMov({...db,sanidad:db.sanidad.map(x=>x.id===f.id?{...f}:x)},`✏️ Sanidad editada: ${f.descripcion}`)
              :addMov({...db,sanidad:[...db.sanidad,{id:Date.now(),...f}]},`💊 ${f.tipo}: ${f.descripcion||""} – ${f.categoria||""}`);
            setDb(nd);setMS(false);setF({});
          }}/>
      </Modal>
    </div>
  );
}
